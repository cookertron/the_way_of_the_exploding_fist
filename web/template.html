function introMusic(m, outs, t0){                  // Intro_Music $90D1 with its CALL, t0 the T at the CALL
  let t = 17 + 4 + 13 + 4; M1.m1 += 4;             // CALL: DI: LD A,(Flag_Sound): AND A
  if (!m[0xB2FA]){ M1.m1 += 1; return t + 11; }

  const h = m[0x90D0] & 0x1F, l = h & 7;

    t += 12;

    for (let i = 0; i < k; i++){                   // Intro_Music_Play: H out, delay, L out, delay

function bgUdg(m, de){                             // Copy_UDG $5FF4 with its CALL: 8 rows from Background_Current_UDG to de
  const s = m[0x5F04] | m[0x5F05] << 8;

function bgNext(de){                               // $6007 with its CALL: the next cell, over a third's edge: [de, T]

function bgRuns(m, hl, de){                        // Background_Fetch_Next $5FBE without its CALL: the runs at hl to the cells from de
  let t = 0;

function bgAttrs(m, hl){                           // Background_Attributes $6010 without its CALL: the runs at hl to $5800 on

const BG_STAGE = { 0x5F53: 0x602B, 0x5F62: 0x603D, 0x5F71: 0x604F };   // Copy_Background_1-3: LD HL,Background_n_Addresses

    if (s & 0x100){ s = (s + 0x700) & 0xFFFF; t += 7 + 7 + 4 + 4; M1.m1 += 4; } else { t += 12; M1.m1 += 1; }
    m[0x5F02] = s & 0xFF; m[0x5F03] = s >> 8;
    t += 16 + 10 + 10 + (b > 1 ? 13 : 8); M1.m1 += 4;
  }
  t += 7 + 6 + 7 + 4 + 17; M1.m1 += 5;             // LD E,(HL): INC HL: LD D,(HL): EX DE,HL: CALL Background_Attributes
  t += bgAttrs(m, m[hl] | m[hl + 1] << 8);
  t += 10 + 10 + 10; M1.m1 += 3;                   // the RETs of Create_Background, Copy_Background_n, Change_Background
  let [scr, ts, ms] = rfScreenAddr(0x48);
  t += 7 + ts + 7 + 10; M1.m1 += 1 + ms + 2;       // LD A,$48: CALL Screen_Calc: LD B,$40: LD DE,Shadow_Buffer
  for (let b = 0x40, de = 0x8000; b > 0; b--, de += 0x20){
    m.copyWithin(de, scr, scr + 0x20);
    t += 11 + 11 + 11 + 10 + 21 * 32 - 5 + 10 + 10 + 10 + 17; M1.m1 += 3 + 1 + 64 + 3 + 1;
    let h = ((scr >> 8) + 1) & 0xFF, l = scr & 0xFF;   // $9229: down a pixel row
    if (h & 7){ t += 37; M1.m1 += 5; }
    else {
      const x = l + 0x20; l = x & 0xFF;
      if (x > 0xFF){ t += 59; M1.m1 += 9; } else { h = (h - 8) & 0xFF; t += 69; M1.m1 += 12; }
    }
    scr = h << 8 | l;
    t += 11 + 10 + 4 + 11 + 4 + 10 + (b > 1 ? 13 : 8); M1.m1 += 7;
  }
  M1.m1 += 1;
  return t + 10;
}
function showRank(m){                              // Show_Rank $AEBF with its CALL
  const r = m[0xB05F] & 0x1F;
  let t = 17 + 10 + 13 + 7; M1.m1 += 5;            // CALL: LD HL: LD A,(Current_Rank): AND $1F: JR NZ
  if (!r){ M1.m1 += 2; return t + 7 + 10 + printString(m, 0x0122, 0xB045, M1) + 10; }
  t += 12;
  const k = Math.min(r, 4);                        // ST, ND, RD by LD DE: CP 1-3: JR Z, else TH
  t += [29, 53, 77, 82][k - 1]; M1.m1 += [3, 6, 9, 10][k - 1] + 4;
  return t + 10 + printString(m, 0x0222, [0xB04D, 0xB050, 0xB053, 0xB056][k - 1], M1) + 10 + 10 + printString(m, 0x0422, 0xB059, M1) + 10;
}
function setupMusic(m, outs){                      // $AC5F to the music's RET, or the JR Z: { t, stage }
  let t = 13 + 4; M1.m1 += 3;                      // LD A,($AF35): AND A: JR Z
  if (!m[0xAF35]) return { t: t + 12, stage: false };
  m[0xAF35] = (m[0xAF35] - 1) & 0xFF;
  t += 7 + 4 + 13; M1.m1 += 2;                     // DEC A: LD ($AF35),A
  return { t: t + introMusic(m, outs, t), stage: true };
}
function setupRest(m, stage, cost){                // on to $AD18, with the CALL
  let t = 0;
  if (stage){
    const sc = 13 + scenery(m, m[0xAF34]);         // LD A,($AF34): CALL $9200
    if (cost) cost.scen = sc;
    t += sc + 7 + 17; M1.m1 += 3;                  // LD B,0: CALL $AF52
    t += awardTail(m, 0, SIDE1);
    t += 17 + 10 + 7 + populate(m, 0x9C2C, 1) + 17; M1.m1 += 4;   // CALL $98BF: LD HL,Num_Players: LD B,1: ..CALL Zero_To_Space
    t += zeroToSpace(m, 0xB026) + 20 + printString(m, 0x0019, 0xB024, M1) + 20 + printString(m, 0x0319, 0xB03E, M1) + 10; M1.m1 += 5;
    t += 10 + 17 + 7 + scoreBuffer(m, 0xB035) + 20 + printString(m, 0x0A19, 0xB024, M1) + 10; M1.m1 += 6;   // Print_HighScore
    m[0xAF33] = m[0xB05F] & 0x1F;
    t += 13 + 7 + 10 + 7 + 7 + populate(m, 0xAF33, 1) + 17; M1.m1 += 6;   // LD A,(Current_Rank)..LD B,1: CALL Populate: CALL Zero_To_Space
    t += zeroToSpace(m, 0xB026) + 20 + printString(m, 0x0022, 0xB024, M1) + showRank(m); M1.m1 += 2;
  }
  t += 17 + newRound(m, M1) + 17 + 7 + 13; M1.m1 += 1 + 3;   // CALL New_Round: CALL Init_Time: LD A,30: LD (Time),A
  m[0x9CA5] = 0x1E;
  t += printTime(m) + 10 + 17; M1.m1 += 2;         // RET: CALL $AD18
  return t;
}

/* ---- the attract demo: $AC3C to its first $AE29 ----------------------
   JR Main_Game_Loop, $AC09's three text rows, CALL Demo_Mode $AB70: rank
   and players cleared, two Random_Number draws (LD A,R, so R at each,
   from r at the JR plus M1.m1) for the demo's ranks $AA94 and Also_Rank,
   $AA46 = Is_Demo_Mode = 1, the stage $AF34 = 2; then $AB97: the scenery,
   DEMO, the high score, New_Round, Init_Time, $9C2B cleared, CALL $ABC8,
   whose CALL $AE26 is roundIn's.  From the listing (python tools/adis.py
   0xAB70 80); gated against python tools/callio.py --capture --state p1
   --call 0xAC3C 0xAE29 (build/callio_ac3c.json).  cost.scen gets the
   scenery's T, as setupRest's. */
function demoIn(m, r, cost){
  M1.m1 += 1;                                      // JR Main_Game_Loop
  return 12 + mainLoop(m, r, cost);
}
/* $AC27, Main_Game_Loop's dispatch after Demo_Mode's RET: Num_Players 0
   (the demo ran out, or its menu key) is the JR Z to $AC09 and a new demo,
   to its first $AE29; 1 is CALL Start_1UP_Game $AC3E: rank, demo flag and
   points cleared, $AF35 = $AA46 = 1, $AA3C = $AF34 = 2, Reset_Score $AF0B
   (the six bytes from $B02D), on to $AC5F, the setup the next bout's is
   (setupMusic, setupRest, roundIn); 2 is CALL Start_2UP_Game $AD9C: rank,
   demo flag, $AA46 and points cleared, the stage $AF34 = 2, to its CALL
   Intro_Music $ADB1 (then start2Rest, stage2, roundIn).  Gated against
   python tools/callio.py --capture --state p1 --call 0xAC27 0xAE29
   (build/callio_ac27.json; with --keys 1, build/callio_ac27_1up.json;
   --keys 2, build/callio_ac27_2up.json).  cost.scen as demoIn's. */
function gameDispatch(m, r, cost){
  const n = m[0x9C2C];
  if (n > 1){                                      // LD A,(Num_Players): AND A: JR Z: CP 1: JR Z: CALL $AD9C
    m[0xB05F] = m[0xAA06] = m[0xAA46] = m[0xAA08] = m[0xAA48] = 0;
    m[0xAF34] = 2;
    M1.m1 += 6 + 1 + 5 + 2;                        // XOR A: five LD (nn),A: LD A,2: LD ($AF34),A
    return { t: 13 + 4 + 7 + 7 + 7 + 17 + 4 + 5 * 13 + 7 + 13, at: 0xADB1 };
  }
  M1.m1 += 3;                                      // LD A,(Num_Players): AND A: JR Z
  if (!n) return { t: 13 + 4 + 12 + mainLoop(m, r, cost), at: 0xAE29 };
  m[0xAA80] = m[0xB05F] = m[0xAA06] = m[0xAA08] = m[0xAA48] = 0;
  m[0xAF35] = m[0xAA46] = 1; m[0xAA3C] = m[0xAF34] = 2;
  M1.m1 += 3 + 13;                                 // CP 1: JR Z: CALL $AC3E .. CALL Reset_Score
  const t = 13 + 4 + 7 + 7 + 12 + 17 + 4 + 5 * 13 + 4 + 2 * 13 + 4 + 2 * 13 + 17;
  return { t: t + resetScore(m), at: 0xAC5F };
}
function resetScore(m){                            // Reset_Score $AF0B without its CALL: the six bytes from $B02D
  m.fill(0, 0xB02D, 0xB033);                       // LD HL: LD (HL),0: LD DE: INC DE: LD BC,5: LDIR: RET
  M1.m1 += 5 + 2 * 5 + 1;
  return 10 + 10 + 10 + 6 + 10 + 4 * 21 + 16 + 10;
}
/* Start_2UP_Game after its tune: CALL New_Round, CALL Reset_Score, on to
   $ADBA (python tools/adis.py 0xAD9C 30) */
function start2Rest(m){
  M1.m1 += 2;                                      // CALL New_Round: CALL Reset_Score
  return 17 + newRound(m, M1) + 17 + resetScore(m);
}
/* $98BF with its CALL: Num_Players and PLAYER, the rows at $0019, $0319 */
function players(m){
  let t = 17 + 10 + 7 + populate(m, 0x9C2C, 1) + 17; M1.m1 += 4;   // CALL $98BF: LD HL,Num_Players: LD B,1: ..CALL Zero_To_Space
  t += zeroToSpace(m, 0xB026) + 20 + printString(m, 0x0019, 0xB024, M1) + 20 + printString(m, 0x0319, 0xB03E, M1) + 10; M1.m1 += 5;
  return t;
}
/* $ADBA, a 2UP bout's stage to the CALL $AE14 (roundIn's CALL $AE26 is
   the next): the scenery, players, both scores ($AF52, $AF97 with B 0),
   the high score from $B038, players again, Init_Time, $9C2B cleared.
   From the listing (python tools/adis.py 0xADBA 20).  cost.scen as
   setupRest's. */
function stage2(m, cost){
  const sc = 13 + scenery(m, m[0xAF34]);           // LD A,($AF34): CALL $9200
  if (cost) cost.scen = sc;
  let t = sc + players(m); M1.m1 += 1;
  t += 7 + 17 + awardTail(m, 0, SIDE1); M1.m1 += 2;   // LD B,0: CALL $AF52
  t += 7 + 17 + awardTail(m, 0, SIDE2); M1.m1 += 2;   // LD B,0: CALL $AF97
  t += 10 + 17 + 7 + scoreBuffer(m, 0xB038) + 20 + printString(m, 0x0A19, 0xB024, M1) + 10; M1.m1 += 6;   // Print_HighScore
  t += players(m);
  m[0x9CA5] = 0x1E;
  t += 17 + 7 + 13 + printTime(m) + 10; M1.m1 += 4;   // CALL Init_Time: LD A,30: LD (Time),A: .. RET
  m[0x9C2B] = 0;
  t += 4 + 13 + 17; M1.m1 += 3;                    // XOR A: LD ($9C2B),A: CALL $AE14
  return t;
}
/* ---- the 2UP game's ways on: $AE17-$AE25 and $ADE0-$AE13 ---------------
   (python tools/adis.py 0xAD9C 80.)  round_loop's RET to $AE17 (a point,
   the quit, or the round end's after endTail) with A: AND A: RET M -- the
   quit, through $ADE0's RET M out to $AC34 (JR Main_Game_Loop: demoIn);
   else New_Round, $AF36 awards the points, and with $9C2B clear the JR Z
   to $AE14 calls $AE26 again (roundIn's); time up, the RET to $ADE0 and on
   to $ADE2: the stage steps 1-3 ($AF27, stageStep), Intro_Music, then
   twoNext: Current_Rank $B05F by one, below 4 the JR to $ADBA (stage2);
   at 4 twoEnd $ADF3: Check_HighScore, then by $A6B6 both posed ($ACE8,
   0), P1's pose ($AE7A after the bare RET $AE78, 1) or P2's ($AE9D after
   $AE9B, 2), each loop at the SP of $AD9C's level, out by $AE12 XOR A: RET
   to $AC34 (twoOut: the JR $AE12 for both posed and P1).  r is R where
   M1.m1 was zero.  twoOn returns T, R and exit: null (back at $AE29),
   'quit' ($AC34) or 'time' ($ADE2).  Gated against python tools/callio.py
   --capture --state p1 --call 0xAE17 0xAE29,0xAC34 (build/callio_ae17.json,
   the quit and the game ends derived). */
function twoOn(m, a, r){
  M1.m1 = 0;
  let t = 4 + 5; M1.m1 += 2;                       // AND A: RET M
  const out = exit => ({ t, r: (r & 0x80) | ((r + M1.m1) & 0x7F), exit });
  if (a & 0x80) return (t += 6 + 4 + 11, M1.m1 += 2, out('quit'));   // RET M taken; $ADE0 AND A: RET M
  t += 17 + newRound(m, M1); M1.m1 += 1;           // CALL New_Round
  t += award(m) + 13 + 4; M1.m1 += 3;              // CALL $AF36: LD A,($9C2B): AND A: JR Z
  if (!m[0x9C2B]) return (t += 12 + roundIn(m, r), out(null));   // JR Z taken, to $AE14
  t += 7 + 10 + 4 + 5; M1.m1 += 3;                 // RET: $ADE0 AND A: RET M
  return out('time');
}
function stageStep(m){                             // CALL $AF27: the stage $AF34 steps 1-3
  let t = 17 + 10 + 11 + 7 + 7; M1.m1 += 5;        // CALL: LD HL: INC (HL): LD A,(HL): CP 4
  if (++m[0xAF34] !== 4) return (M1.m1 += 1, t + 11);   // RET NZ
  m[0xAF34] = 1; M1.m1 += 4;                       // LD A,1: LD (HL),A: RET
  return t + 5 + 7 + 7 + 10;
}
function twoNext(m){                               // $ADE8 to the JR $ADBA (end false) or $ADF3 (end true)
  let t = 10 + 11 + 7 + 7; M1.m1 += 5;             // LD HL,Current_Rank: INC (HL): LD A,(HL): CP 4: JR Z
  if (++m[0xB05F] === 4) return { t: t + 12, end: true };
  M1.m1 += 1;
  return { t: t + 7 + 12, end: false };            // JR $ADBA
}
function twoEnd(m){                                // $ADF3 to a pose's loop top: A its base, 0 for both posed
  let t = checkHighScore(m) + 13 + 4; M1.m1 += 3;  // LD A,($A6B6): AND A: JR Z
  const v = m[0xA6B6];
  if (!v) return { t: t + 12 + drawPose(m), A: 0 };
  t += 7 + 4; M1.m1 += 2;                          // DEC A: JR NZ
  const A = v === 1 ? 0xAA00 : 0xAA40;
  t += (v === 1 ? 7 : 12) + 17 + 10; M1.m1 += 2;   // CALL $AE78 / $AE9B, a bare RET
  return { t: t + winStart(m, A), A };
}
function twoOut(A){                                // out of a pose's loop: the JR $AE12 (not P2's), XOR A: RET to $AC34
  if (A === 0xAA40) return winEnd();
  M1.m1 += 1;
  return 12 + winEnd();
}
/* $8800 JP Game_Start $9C2E (the tape's USR 34816) to $AC09: DI, border
   5, SP $5BFF, Game_Init $B138 ($B153 = 1, $B151 = $FFFF), the $2100 bytes
   at $6000 moved down to Background_Reference $5F00 (the scenery's code and
   data run there), $C423-$C426 cleared, JP
   Main_Game $AC05: Num_Players 0, on into Main_Game_Loop.  From the listing
   (python tools/adis.py 0x9C2E 20 ; 0xB138 4 ; 0xAC05 2).  Uncontended T
   but the LDIR's, through contended RAM below $8000: +BOOT_LDIR T a byte,
   measured from $8800 to $9C45 (python tools/sample.py --state boot
   --start-here --at 0x9C45: 228219 T, 50665 over uncontended).  The
   border's OUT in out.  Gated with mainLoop by the boot's live rows
   (build/live_boot.json). */
const BOOT_LDIR = 5.997;
function gameStart(m, out){
  out.push([10 + 4 + 7, 5]);                       // JP: DI: LD A,5: OUT ($FE),A
  m[0xB153] = 1; m[0xB151] = m[0xB152] = 0xFF;
  m.copyWithin(0x5F00, 0x6000, 0x8100);            // LDIR (HL) to (DE), DE below HL: a plain move down
  m[0xC423] = m[0xC424] = m[0xC425] = m[0xC426] = 0;
  m[0x9C2C] = 0;
  M1.m1 += 1 + 14 + 2 * 0x2100 + 8;
  return 10 + 4 + 7 + 11 + 10 + 6 + 17 + 7 + 13 + 10 + 16 + 10 + 10 + 10 + 10 + (21 + BOOT_LDIR) * 0x2100 - 5
       + 7 + 4 + 7 + 16 + 16 + 10 + 4 + 13;
}
/* $AC09 Main_Game_Loop to the demo's first $AE29 */
function mainLoop(m, r, cost){
  let t = 0;
  for (const [pos, de] of [[0x0022, 0xB060], [0x0019, 0xB060], [0x0222, 0xB039]]){ t += 20 + printString(m, pos, de, M1); M1.m1 += 2; }
  m[0xB05F] = 0; m[0x9C2C] = 0;
  t += 17 + 4 + 13 + 13; M1.m1 += 4;               // CALL Demo_Mode: XOR A: LD (Current_Rank),A: LD (Num_Players),A
  for (const a of [0xAA94, 0xAA80]){               // CALL Random_Number: AND 3: ADD A,7: LD (nn),A
    M1.m1 += 1 + 2;
    const v = (r & 0x80) | ((r + M1.m1) & 0x7F);
    m[a] = (v & 3) + 7;
    t += 17 + 9 + 10 + 7 + 7 + 13; M1.m1 += 4;
  }
  m[0xAA46] = 1; m[0xAA06] = 1; m[0xAF34] = 2;
  t += 7 + 13 + 13 + 4 + 13; M1.m1 += 5;           // LD A,1 .. LD ($AF34),A
  return t + demoStage(m, r, cost);
}
/* $AB97, a demo stage to its first $AE29: LD A,($AF34) and on, as above */
function demoStage(m, r, cost){
  let t = 13; M1.m1 += 1;                          // LD A,($AF34)
  const sc = scenery(m, m[0xAF34]);
  if (cost) cost.scen = sc;
  t += sc + 20 + printString(m, 0x0222, 0xB039, M1); M1.m1 += 2;
  t += 10 + 17 + 7 + scoreBuffer(m, 0xB035) + 20 + printString(m, 0x0A19, 0xB024, M1) + 10; M1.m1 += 6;   // Print_HighScore
  t += 17 + newRound(m, M1); M1.m1 += 1;           // CALL New_Round
  m[0x9CA5] = 0x1E;
  t += 17 + 7 + 13 + printTime(m) + 10; M1.m1 += 4;   // CALL Init_Time: LD A,30: LD (Time),A: .. RET
  m[0x9C2B] = 0;
  t += 4 + 13 + 17; M1.m1 += 3;                    // XOR A: LD ($9C2B),A: CALL $ABC8
  return t + roundIn(m, r);
}

/* ---- the live game: round_loop on the 7.2 accumulator ------------------
   The page starts from the tape's hand-over at $8800 (build/live_boot.json,
   python tools/sample.py --start-here: bootPass runs Game_Start into the
   attract demo); the gates also start from mid-bout states at the CALL at
   $AE29.  It runs whole passes against a T budget
   of one 48K frame (69888 T) a video frame.  Each pass is charged its
   uncontended T with $BF13's contention means (rfPlayT, D4) and the effect's
   $FE writes go to the beeper log at their T.  A way out of the loop that
   is not ported stops the engine and says so in .exit. */
const T_FRAME = 69888;                             // 48K: 224 T x 312 lines
const fromHex = h => Uint8Array.from(h.match(/../g), x => parseInt(x, 16));
function specPort(kb, p){                          // IN as the machine answers
  if ((p & 0xFF) === 0x1F) return kb.kempston;     // Kempston, active high
  return (p & 1) ? 0xFF : kb.port(p >> 8);
}
class Fist {
  constructor(st){
    this.m = new Uint8Array(0x10000); this.m.set(fromHex(st.ram), 0x4000);
    this.r = st.r; this.sp = st.sp;
    this.passes = 0; this.simT = 0; this.acc = 0; this.exit = null;
    this.win = 0;                                  // the winner's base while the victory pose loops, else 0
    this.bonus = false;                            // P1's time bonus counting ($AD6E), after the pose
    this.both = null;                              // both fighters posing in $ACF0's loop $AD0B: 'end' (time up) or 'draw'
    this.setup = null;                             // the next bout's setup after the tune: { how, stage } to setupRest
    this.enter = false;                            // at the setup's CALL $AD18: roundIn the next pass, to $AE29
    this.stage = false;                            // ...with a new stage's text rows drawn (D5)
    this.demoAt = false;                           // at $AC3C after a lost bout: demoIn the next pass, to $AE29
    this.demo = false;                             // round_loop called by the demo's $ABC8: its points played by demoPoint
    this.two = false;                              // ...by the 2UP game's $AE14: its ways on by twoWay, its poses at SP + 2
    this.demoNext = null;                          // at $ABB9 with this A: demoOn the next pass, a new stage or out to $AC27
    this.boot = st.pc === 0x8800;                  // the tape's hand-over: bootPass the first pass, to the demo's $AE29
    this.frame = 0; this.lvl = 0; this.border = 0;
    this.sound = { log: [] };
    this.scr = new SpecScreen();
    this.script = null;                            // [[passes, keys]], as sample.py --script
  }
  get simFrame(){ return this.simT / T_FRAME; }
  /* one pass with these keys; returns its charged T */
  pass(kb){
    if (this.boot) return this.bootPass();
    if (this.setup) return this.setupPass();
    if (this.enter) return this.enterPass();
    if (this.demoAt) return this.demoPass();
    if (this.demoNext !== null) return this.demoNextPass();
    if (this.win || this.bonus) return this.winPass();
    if (this.both) return this.endPass();
    this.stage = false;
    const io = { r: this.r, out: [], in: p => specPort(kb, p), cost: { dec: 0, copy: 0, ldir: 0, t: 0 } };   // t stays 0 if the pass leaves before $BF13 (a quit)
    const res = roundPass(this.m, io, this.sp, this.demo, this.two);
    let cost = res.t + rfPlayT(io.cost.t, io.cost) - io.cost.t;
    for (const [t, v] of io.out){                  // before the ways on: a tune there logs its edges after these
      this.border = v & 7;
      const lv = (v >> 4) & 1;
      if (lv !== this.lvl){ this.lvl = lv; this.sound.log.push([(this.simT + t) / T_FRAME, lv]); }
    }
    const demo = this.demo, two = this.two;
    if (demo) cost += this.demoOut(res);           // the demo's ways on
    else if (res.exit === 'end'){                  // $AE67: time up, on into the round end's loop top $AD0B
      M1.m1 = 0; cost += endStart(this.m);
      res.r = (res.r & 0x80) | ((res.r + M1.m1) & 0x7F); res.exit = null; this.both = 'end';
    }
    else if (two && res.exit){                     // the RET to $AE17: a point or the quit
      const w = this.twoWay(res.a, res.r, cost);
      cost += w.t; res.r = w.r; res.exit = null;
    }
    if (!demo && !two) cost += this.onward(res);   // the 1UP game's ways on
    this.simT += cost; this.r = res.r; this.passes++;
    if (res.exit) this.exit = res;
    return cost;
  }
  /* the way on from pointPath's exit in res: 'time' decided by timeUp, then
     'p1' / 'p2' into the victory pose to its loop top, 'draw' out to $ACA6;
     res.r and res.exit updated, the T added returned */
  onward(res){
    if (res.exit !== 'time' && res.exit !== 'p1' && res.exit !== 'p2') return 0;
    M1.m1 = 0;
    let t = 0;
    if (res.exit === 'time'){ const u = timeUp(this.m); t += u.t; res.exit = u.exit; }
    if (res.exit === 'draw'){ t += drawStart(this.m); res.exit = null; this.both = 'draw'; }
    else {                                         // $AD94 / $AD5F
      const A = res.exit === 'p1' ? 0xAA00 : 0xAA40;
      t += winStart(this.m, A); res.exit = null; this.win = A;
    }
    res.r = (res.r & 0x80) | ((res.r + M1.m1) & 0x7F);
    return t;
  }
  /* $AE17 on, A = a and R = r there, t into the pass: twoOn, then the
     quit's demoIn in this pass (twoDemo), or time up's stage step and tune
     (twoNext the next pass, by setupPass); returns T and R */
  twoWay(a, r, t){
    const u = twoOn(this.m, a, r);
    let c = u.t;
    if (u.exit === 'quit') c += this.twoDemo(r);
    else if (u.exit === 'time'){ c += stageStep(this.m); c += this.music('2next', t + c); }
    return { t: c, r: (r & 0x80) | ((r + M1.m1) & 0x7F) };
  }
  /* $AC34 JR Main_Game_Loop into the demo's first $AE29, r R where M1.m1
     was zero: demoIn, charged as demoPass; round_loop is the demo's again */
  twoDemo(r){
    const cost = { scen: 0 }, u = demoIn(this.m, r, cost);
    this.two = false; this.demo = true; this.stage = true;
    return (u - cost.scen) * SETUP_K.rest + cost.scen * SCEN_K[this.m[0xAF34]];
  }
  /* the demo's way on from roundPass's or demoPoint's exit in res: the
     round end into $ACF0's loop top, a pose into its loop, time up or the
     quit to $ABB9 (demoNext); res.r and res.exit updated, the T returned */
  demoOut(res){
    if (!res.exit) return 0;
    M1.m1 = 0;
    let t = 0;
    if (res.exit === 'end'){ t += endStart(this.m); this.both = 'end'; }
    else if (res.exit === 'p1' || res.exit === 'p2'){ const A = res.exit === 'p1' ? 0xAA00 : 0xAA40; t += winStart(this.m, A); this.win = A; }
    else this.demoNext = res.exit === 'quit' ? 0x80 : 0;   // 'time': XOR A; 'quit': A negative
    res.r = (res.r & 0x80) | ((res.r + M1.m1) & 0x7F); res.exit = null;
    return t;
  }
  /* $ABB9 on: demoOn, the next demo stage charged as demoPass, or out to
     $AC27: with Num_Players 0 gameDispatch's new demo, charged the same;
     1, the 1UP game's start to $AC5F and its tune in this pass, as next()'s
     (the setup and roundIn the passes after); 2, Start_2UP_Game to its
     tune, the tune in this pass the same way (stage2 and roundIn after) */
  demoNextPass(){
    M1.m1 = 0;
    const cost = { scen: 0 }, a = this.demoNext, u = demoOn(this.m, a, this.r, cost);
    if (u.at === 0xAC27){                          // the RET to $AC27: a new demo the same pass
      const d = gameDispatch(this.m, this.r, cost);
      u.t += d.t; u.at = d.at;
    }
    let t = u.at === 0xAE29 ? (u.t - cost.scen) * SETUP_K.rest + cost.scen * SCEN_K[this.m[0xAF34]] : u.t;
    if (u.at === 0xAC5F){ this.demo = false; t += this.music('start', t); }
    else if (u.at === 0xADB1){ this.demo = false; this.two = true; t += this.music('2up', t); }
    this.r = (this.r & 0x80) | ((this.r + M1.m1) & 0x7F);
    this.demoNext = null;
    if (u.at === 0xAC27) this.exit = { exit: a & 0x80 ? 'quit' : 'over', at: 0xAC27, r: this.r, t };
    else if (u.at === 0xAE29) this.stage = true;
    this.simT += t; this.passes++;
    return t;
  }
  /* one iteration of $ACF0's loop $AD0B; out by its RET: at the round end
     the delays, pointPath (time up: 'time') and onward; after the draw the
     JP $AC5F to the next bout's setup */
  endPass(){
    const cost = { dec: 0, copy: 0, ldir: 0 };
    M1.m1 = 0;
    const w = winPass(this.m, 0xAA00, (this.sp + (this.both === 'end' ? -2 : 2)) & 0xFFFF, cost);   // $ACF0 from $AE6F; $ACE8 from $ACD3 or $AE07
    let t = w.t + rfPlayT(cost.t, cost) - cost.t;
    this.r = (this.r & 0x80) | ((this.r + M1.m1) & 0x7F);
    let res = null;
    if (w.out && this.both === 'draw'){            // JP $AC5F
      t += 10; this.both = null;
      M1.m1 = 1; t += this.music('draw', t);
      this.r = (this.r & 0x80) | ((this.r + M1.m1) & 0x7F);
    }
    else if (w.out && this.both === 'two'){        // the 2UP game's end, both posed: out to $AC34 and the demo
      M1.m1 = 0; t += twoOut(0); this.both = null;
      t += this.twoDemo(this.r);
      this.r = (this.r & 0x80) | ((this.r + M1.m1) & 0x7F);
    }
    else if (w.out && this.two){                   // the RET to $AE17: its ways on
      M1.m1 = 0;
      const e = endTail(this.m);
      t += e.t; this.r = (this.r & 0x80) | ((this.r + M1.m1) & 0x7F); this.both = null;
      const u = this.twoWay(e.a, this.r, t);
      t += u.t; this.r = u.r;
    }
    else if (w.out){
      M1.m1 = 0;
      const e = endTail(this.m);
      t += e.t; this.r = (this.r & 0x80) | ((this.r + M1.m1) & 0x7F); this.both = null;
      res = (this.demo ? demoPoint : pointPath)(this.m, e.a, this.r);   // the RET to $AD1B (the demo's $ABCB)
      t += res.t + (this.demo ? this.demoOut(res) : this.onward(res)); this.r = res.r;
    }
    this.simT += t; this.passes++;
    if (res && res.exit) this.exit = res;
    return t;
  }
  /* one iteration of the victory pose, or one second of P1's time bonus;
     out by the pose's RET, the 1UP bout is lost (P2) or the bonus counts
     (P1), out to $ACA6 won; then boutNext to $AC39 (lost: the high score
     checked, out at $AC3C) or $AC5F (won), the next bout's setup */
  winPass(){
    const cost = { dec: 0, copy: 0, ldir: 0 };
    M1.m1 = 0;
    let t;
    if (this.bonus){
      const b = bonusPass(this.m);
      t = b.t;
      if (b.out){ this.bonus = false; t += this.next(1, t); }
    } else {
      const w = winPass(this.m, this.win, (this.sp + (this.two ? 2 : 0)) & 0xFFFF, cost);   // the 2UP's at $AD9C's level
      t = w.t + rfPlayT(cost.t, cost) - cost.t;
      if (w.out && this.two){ t += twoOut(this.win); this.win = 0; t += this.twoDemo(this.r); }   // $AE12, out to $AC34 and the demo
      else if (w.out && this.demo){ t += winEnd(); this.win = 0; this.demoNext = 0; }   // $AC03 / $ABE8 XOR A: RET, to $ABB9
      else if (w.out && this.win === 0xAA40){ t += winEnd(); t += this.next(0, t); this.win = 0; }
      else if (w.out){                             // $AD62: the clock counted down from here, or out at once
        const b = bonusStart(this.m);
        t += b.t; this.win = 0;
        if (b.out) t += this.next(1, t); else this.bonus = true;
      }
    }
    this.r = (this.r & 0x80) | ((this.r + M1.m1) & 0x7F);
    this.simT += t; this.passes++;
    if (this.exit) this.exit.r = this.r;
    return t;
  }
  /* $ACA6 on from a bout lost (a = 0) or won (1), t into a pass whose M1
     are counted from this.r: the T; lost checks the high score and sets
     .exit at $AC3C (JR Main_Game_Loop, the menu: D7), won goes on into the
     setup's tune */
  next(a, t){
    const b = boutNext(this.m, a, this.r);
    if (b.at === 0xAC39){ this.demoAt = true; return b.t + checkHighScore(this.m); }
    return b.t + this.music('won', t + b.t);
  }
  /* $AC5F, t into the pass: setupMusic charged inside this pass whole (DI
     throughout, the screen untouched while it plays), its $FE writes to the
     border and the sound log at their T; setupRest is the next pass.  Both
     at the measured means of SETUP_K */
  music(how, t){
    const outs = [], s = how === '2up' || how === '2next' ? { t: introMusic(this.m, outs, 0), stage: true } : setupMusic(this.m, outs);
    for (let [u, v] of outs){
      u *= SETUP_K.tune;
      this.border = v & 7;
      const lv = (v >> 4) & 1;
      if (lv !== this.lvl){ this.lvl = lv; this.sound.log.push([(this.simT + t + u) / T_FRAME, lv]); }
    }
    this.setup = { how, stage: s.stage };
    return s.t * SETUP_K.tune;                     // with no tune its 29 T: the factor below measurement
  }
  /* the setup after the tune: the scenery and text rows (a new stage), New_
     Round, Init_Time, to the CALL $AD18; .stage says a new stage's text
     rows were drawn there (D5) */
  setupPass(){
    M1.m1 = 0;
    const cost = { scen: 0 }, how = this.setup.how;
    let u, end = null;
    if (how === '2next'){                          // the 2UP game's next bout ($ADBA), or its end ($ADF3) into a pose's loop
      const n = twoNext(this.m);
      if (n.end){ end = twoEnd(this.m); u = n.t + end.t; }
      else u = n.t + stage2(this.m, cost);
    }
    else u = how === '2up' ? start2Rest(this.m) + stage2(this.m, cost) : setupRest(this.m, this.setup.stage, cost);
    const t = (u - cost.scen) * SETUP_K.rest + cost.scen * SCEN_K[this.m[0xAF34]];
    this.r = (this.r & 0x80) | ((this.r + M1.m1) & 0x7F);
    this.stage = this.setup.stage && !end; this.setup = null; this.enter = !end;
    if (end){ if (end.A) this.win = end.A; else this.both = 'two'; }
    this.simT += t; this.passes++;
    return t;
  }
  /* $AD18 to $AE29, the next bout's round_loop entered: roundIn, then
     roundPass from the next pass */
  enterPass(){
    M1.m1 = 0;
    const t = roundIn(this.m, this.r);
    this.r = (this.r & 0x80) | ((this.r + M1.m1) & 0x7F);
    this.enter = false; this.stage = false;
    this.simT += t; this.passes++;
    return t;
  }
  /* $AC3C to the demo's first $AE29: demoIn, charged as setupPass (the
     scenery at SCEN_K, the rest at SETUP_K.rest); its text rows are in the
     font (D5), .stage says so; round_loop is then the demo's */
  /* the tape's JP $8800: gameStart and mainLoop to the demo's first $AE29,
     at SP $5BF9 (Demo_Mode's, $ABC8's and $AE26's CALLs below $5BFF;
     sample.py --state boot --at 0xAE29).  mainLoop charged as demoPass,
     gameStart with its own LDIR charge. */
  bootPass(){
    M1.m1 = 0;
    const out = [], cost = { scen: 0 };
    const g = gameStart(this.m, out), u = mainLoop(this.m, this.r, cost);
    const t = g + (u - cost.scen) * SETUP_K.rest + cost.scen * SCEN_K[this.m[0xAF34]];
    for (const [, v] of out) this.border = v & 7;
    this.r = (this.r & 0x80) | ((this.r + M1.m1) & 0x7F);
    this.sp = 0x5BF9;
    this.boot = false; this.demo = true; this.stage = true;
    this.simT += t; this.passes++;
    return t;
  }
  demoPass(){
    M1.m1 = 0;
    const cost = { scen: 0 }, u = demoIn(this.m, this.r, cost);
    const t = (u - cost.scen) * SETUP_K.rest + cost.scen * SCEN_K[this.m[0xAF34]];
    this.r = (this.r & 0x80) | ((this.r + M1.m1) & 0x7F);
    this.demoAt = false; this.demo = true; this.stage = true;
    this.simT += t; this.passes++;
    return t;
  }
  /* one video frame: spend its T on whole passes (a pass that overruns is
     paid back by the next frames, as the original's own slow passes are) */
  step(kb){
    if (!this.exit){
      this.acc += T_FRAME;
      while (this.acc > 0 && !this.exit) this.acc -= this.pass(kb);
    }
    this.frame++;
  }
  show(){ this.scr.load(this.m.subarray(0x4000)); }
}

/* ---- the demo "game"------------------------------------------------- */
const TONE_HZ = 440;
class Demo {
  constructor(){
    this.scr = new SpecScreen();
    this.frame = 0;            // video frames stepped (the FLASH clock too)
    this.simFrame = 0;         // the sound bridge's clock, in video frames
    this.x = 15; this.y = 11;  // the block, in character cells
    this.border = 0;
    this.lvl = 0;              // the speaker level the log last set
    this.tNext = 0;            // the next tone edge, in fractional frames
    this.firing = false;
    this.sound = { log: [] };  // rows of [simulatedFrame, level]
    this.scr.fillAttr(0x0F);   // white ink on blue paper
    this.paintCell(true);
  }
  paintCell(on){
    let p = SpecScreen.pixelAddr(this.x*8, this.y*8);
    for (let i = 0; i < 8; i++){ this.scr.put(p, on ? 0xFF : 0); p = SpecScreen.nextRow(p); }
    /* FLASH while firing: bit 7 of the attribute, swapped by renderScreen
       every 16 video frames from the frame counter it is handed */
    this.scr.put(SpecScreen.attrAt(this.x, this.y), (this.firing ? 0x80 : 0) | 0x0F);
  }
  /* one video frame.  QAOP or the cursor keys (5678, i.e. the arrows) or a
     Kempston joystick move; SPACE or fire beeps and reddens the border. */
  step(kb){
    const f0 = this.simFrame, k = kb.kempston;
    let dx = 0, dy = 0;
    if (kb.down('O') || kb.down('5') || (k & KEMPSTON_LEFT))  dx = -1;
    if (kb.down('P') || kb.down('8') || (k & KEMPSTON_RIGHT)) dx = 1;
    if (kb.down('Q') || kb.down('7') || (k & KEMPSTON_UP))    dy = -1;
    if (kb.down('A') || kb.down('6') || (k & KEMPSTON_DOWN))  dy = 1;
    const fire = kb.down('SPACE') || !!(k & KEMPSTON_FIRE);
    if ((dx || dy) && (this.frame % 4) === 0){
      this.paintCell(false);
      this.x = (this.x + dx + 32) % 32; this.y = (this.y + dy + 24) % 24;
    }
    /* the tone is an EDGE STREAM on the simulated clock: a running phase,
       so consecutive frames join without a phase jump */
    if (fire){
      const half = FRAME_HZ / (2 * TONE_HZ);         // half a period, in frames
      if (!this.firing) this.tNext = Math.max(this.tNext, f0);
      while (this.tNext < f0 + 1){
        this.lvl ^= 1; this.sound.log.push([this.tNext, this.lvl]);
        this.tNext += half;
      }
    } else if (this.lvl){
      this.lvl = 0; this.sound.log.push([f0, 0]);    // leave the speaker LOW
    }
    this.firing = fire;
    this.border = fire ? 2 : 0;
    this.paintCell(true);
    this.frame++; this.simFrame++;
  }
}

/* ---- driver ---------------------------------------------------------- */
const cvs = document.getElementById('scr'), ctx = cvs.getContext('2d');
const demo = new Demo();
const game = new Fist(A.live_boot.start);          // the tape's hand-over at $8800: Game_Start into the attract demo
/* created here, STARTED from the first gesture -- a browser will not run an
   AudioContext before one */
const sound = new SoundOut();
const keyboard = new Keyboard();
attachKeyboard(keyboard, { onGesture(){ sound.start(); } });
const loop = makeLoop({
  hz: FRAME_HZ,
  poll(){ pollGamepads(keyboard); },
  step(){ game.step(keyboard); },
  draw(){
    /* the bridge is handed the driver's log and the SIMULATED frame the
       engine has reached -- never wall time */
    sound.flush(game.sound.log, game.simFrame);
    paintBorder(game.border);
    game.show();
    renderScreen(ctx, game.scr, game.frame);
  },
});
installThemeButton('theme', 'spec-port-theme');
loop.start();
