<title>Spectrum Port Kit -- starter</title>
<style>
  /* The page is a frame around a Spectrum screen and nothing else.  Two
     themes: the default follows the system, and the corner button pins one.
     The GAME's own colours never change -- the black inside #overscan is the
     Spectrum's border, painted from the emulated OUT ($FE), not page
     furniture. */
  :root{ color-scheme:light dark;
         --bg:#0f1115; --edge:#2a313c; --btn:#98a2b3; }
  @media (prefers-color-scheme:light){
    :root{ --bg:#e9ebef; --edge:#c3c9d3; --btn:#59636f; }
  }
  :root[data-theme="dark"]{  --bg:#0f1115; --edge:#2a313c; --btn:#98a2b3; }
  :root[data-theme="light"]{ --bg:#e9ebef; --edge:#c3c9d3; --btn:#59636f; }

  *{ box-sizing:border-box }
  html,body{ height:100% }
  body{ margin:0; background:var(--bg); padding:16px;
        display:flex; align-items:center; justify-content:center;
        transition:background 140ms linear }
  #overscan{ display:inline-block; padding:24px 32px; background:#000;
             border:1px solid var(--edge); border-radius:4px; line-height:0;
             transition:background 40ms linear, border-color 140ms linear }
  canvas{ image-rendering:pixelated; background:#000; border:0; display:block;
          max-width:100%; height:auto; width:768px }
  /* deliberately faint: it is the only thing on the page that is not the game */
  #theme{ position:fixed; top:10px; right:12px; width:28px; height:28px;
          border:1px solid var(--edge); border-radius:50%; background:transparent;
          color:var(--btn); font:14px/1 system-ui,sans-serif; cursor:pointer;
          opacity:.22; transition:opacity 140ms linear, color 140ms linear;
          display:flex; align-items:center; justify-content:center; padding:0 }
  #theme:hover,#theme:focus-visible{ opacity:1 }
</style>

<!-- THE OVERSCAN FRAME: a real Spectrum draws a border around the 256x192
     display and games use it.  The padding is the border's width and its
     background is the emulated OUT ($FE). -->
<div id="overscan"><canvas id="scr" width="256" height="192"></canvas></div>
<button id="theme" type="button" title="theme: system / dark / light"
        aria-label="switch theme">&#9680;</button>

<script type="application/json" id="assets">__ASSETS__</script>
<script>
/* =======================================================================
   GENERATED FILE -- do not edit.  Edit web/template.html and rebuild with
       python tools/build.py
   =======================================================================
   THE STARTER.  Everything above the demo is the kit; the demo is the
   smallest thing that exercises every layer of it end to end -- display
   file, ULA colours and FLASH, border, keyboard matrix, Kempston/gamepad,
   the beeper edge stream and the sound bridge, the fixed-timestep loop --
   so a new port begins from a page that already runs and already has a
   headless test suite (test/kit.test.js) driving it.  Replace `Demo` with
   the port's engine; keep the shape:
       step(kb) advances ONE video frame and logs sound against its own
       frame counter; draw is fillRect-only; sound is flushed from draw
       with the simulation's frame count.                                 */
const A = JSON.parse(document.getElementById('assets').textContent);

/*#include platform.js*/

/* ---- the sprite decoder $8803 ------------------------------------------
   A transliteration of tools/sprdec.py (ledger/8803.toml): the same rows,
   the same branches, and each instruction's uncontended T, tallied into the
   return value (D3).  m is the 64K of the machine (a Uint8Array): it reads
   the sprite at hl, the flags $C40E (bit 0 mirror, bits 1/2/3 shift
   2/4/6 px), $C407 (recolour) and $C408 (the stride), the tables
   $B500-$B9FF, and writes its scratch $8AE9-$8B1C and the bytes under de.
   T measured: equal to the harness's uncontended twin on all 441 sprdec
   cases (python tools/sprdec.py --check).  Stack contention in play is not
   charged here (8803 open 1). */
const sprLdirT = n => 21 * (n || 0x10000) - 5;
const sprDjnzT = (k, body) => k * (body + 13) - 5;
function sprLdir(m, s, d, n){
  for (let i = n || 0x10000; i > 0; i--){ m[d] = m[s]; s = (s + 1) & 0xFFFF; d = (d + 1) & 0xFFFF; }
  return [s, d];
}
function sprPut16(m, a, v){ m[a] = v & 0xFF; m[a + 1] = (v >> 8) & 0xFF; }
const sprGet16 = (m, a) => m[a] | m[a + 1] << 8;

function spriteDecode(m, hl, de, paths){
  const tally = paths ? k => { paths[k] = (paths[k] || 0) + 1; } : () => {};
  const F = m[0xC40E];
  let t = 13 + 7 + 10;
  if (F & 0xFE){ m[0x8B0A] = 1; t += 7 + 13 + 10; }
  else { m[0x8B0A] = 0; t += 4 + 13; }
  m[0x8AF3] = 0; t += 7 + 13;
  let w = m[hl];
  m[0x8B1C] = w; m[0x8B1B] = w; t += 7 + 13 + 13 + 4 + 13 + 4 + 10;
  if (m[0x8B0A]){ m[0x8B1C] = (w + 1) & 0xFF; t += 13 + 4 + 13; }
  hl = (hl + 1) & 0xFFFF; t += 6;
  for (;;){
    /* $8833 row top */
    m[0x8AF3] ^= 1; t += 13 + 7 + 13;
    m[0x8AFF] = 0; m[0x8AFE] = 0; t += 4 + 13 + 13;
    t += 7 + 4 + 10;
    if (m[hl] === 0) return t + 10;
    sprPut16(m, 0x8B16, de + m[0xC408]); t += 72;
    let hd = m[hl]; t += 7 + 4 + 10;
    if (!(hd & 0x80)){                              /* $8858 raw row: w bytes */
      tally('raw');
      w = m[0x8B1B];
      sprPut16(m, 0x8B14, hl + w);
      m[0x8AE9] = w | 0x80;
      sprLdir(m, hl, 0x8AEA, w);
      hl = 0x8AE9;
      t += 13 + 4 + 7 + 11 + 11 + 16 + 10 + 11 + 10 + 7 + 7 + 6 + sprLdirT(w) + 30;
    } else {                                        /* $8875 packed row */
      tally('packed');
      sprPut16(m, 0x8B14, hl + (hd & 7) + 1);
      t += 4 + 7 + 4 + 4 + 7 + 11 + 11 + 16 + 10;
    }
    /* $8882 recolour by row parity, tables $B8/$B9 via $8AD1 */
    t += 13 + 4 + 10;
    if (m[0xC407]){
      tally('recolour');
      const a = m[hl], n = a & 7, tab = m[0x8AF3] ? 0xB800 : 0xB900;
      m[0x8AF4] = a;
      for (let i = 0; i < n; i++) m[0x8AF5 + i] = m[tab + m[(hl + 1 + i) & 0xFFFF]];
      t += 11 + 7 + 10 + 7 + 6 + 6 + 7 + 4 + 4 + 10 + 20;
      if (n) t += sprDjnzT(n, 7 + 17 + 97 + 7 + 6 + 6);
      hl = 0x8AF4;
    }
    /* $88A5 mirror: skip re-measured from the right, bytes reversed by $B7 */
    t += 13 + 8 + 10;
    if (F & 1){
      tally('mirror');
      hd = m[hl];
      const n = hd & 7, s = (hd >> 3) & 7;
      let a = (((m[0x8B1B] - s - n) & 0xFF) << 3) & 0xFF;
      t += 128;
      if (a){ a |= 0x40; t += 7; }
      m[0x8B0B] = a | 0x80 | n;
      for (let i = 0; i < n; i++) m[0x8B0B + n - i] = m[0xB700 + m[(hl + 1 + i) & 0xFFFF]];
      t += 42 + 78 + (n ? sprDjnzT(n, 65) : 0) + 20;
      hl = 0x8B0B;
    }
    /* $88F7 shift: bit 1 two pixels, bit 2 four (RRD), bit 3 six (left 2) */
    t += 13 + 8 + 10;
    let sh = 0;
    if (F & 2) sh = 2;
    else {
      t += 13 + 8 + 10;
      if (F & 4) sh = 4;
      else {
        t += 13 + 8 + 10;
        if (F & 8) sh = 6;
      }
    }
    if (sh){
      tally('shift' + sh);
      hd = m[hl]; m[0x8B01] = hd;
      const n = hd & 7, src = (hl + 1) & 0xFFFF;
      t += 7 + 11 + 10 + 7 + 10 + 6 + 7 + 10;
      if (n){
        m[0x8B00] = n;
        const first = m[src], k = n + 1;
        if (sh === 6){
          m[0x8B02] = 0;
          t += 13 + 11 + 10 + 4 + 7 + 11 + 4 + 7 + 6 + 7 + 7 + 10;
          if (first < 0x40){ m[0x8AFE] = 1; t += 20; }
          sprLdir(m, src, 0x8B03, n);
          t += 4 + 4 + 10 + sprLdirT(n) + 10 + 10 + 13 + 4 + 4 + 4 + 4 + 4 + 10;
          t += 11 + 13 + 4 + 7 + 11 + 10 + 11 + 11 + 4;
          for (let r = 0; r < 2; r++){
            let c = 0;
            for (let a = 0x8B02 + n; a > 0x8B01; a--){ const v = m[a]; m[a] = (v << 1 | c) & 0xFF; c = v >> 7; }
          }
          t += 2 * sprDjnzT(k, 24) + 10 + 4 + 4 + 10 + 7 + 4 + 10;
        } else {
          t += 13 + 11 + 10 + 4 + 7 + 7 + 7 + 10;
          if (first < (sh === 2 ? 4 : 0x10)){ m[0x8AFE] = 1; t += 20; }
          sprLdir(m, src, 0x8B02, n);
          m[0x8B02 + n] = 0;
          t += 11 + 4 + 4 + 10 + sprLdirT(n) + 10 + 4 + 7 + 10;
          if (sh === 2){
            for (let r = 0; r < 2; r++){
              let c = 0;
              for (let a = 0x8B02; a < 0x8B02 + k; a++){ const v = m[a]; m[a] = v >> 1 | c << 7; c = v & 1; }
            }
            t += 47 + 11 + 2 * sprDjnzT(k, 24) + 10 + 4 + 4;
          } else {
            let acc = 0;
            for (let a = 0x8B02; a < 0x8B02 + k; a++){ const v = m[a]; m[a] = (acc & 0xF) << 4 | v >> 4; acc = v & 0xF; }
            t += 13 + 4 + 4 + 4 + sprDjnzT(k, 24);
          }
          t += 6 + 7 + 4 + 10;
        }
        if (m[0x8B02 + n] === 0){ m[0x8AFF] = 1; t += 20; }
      }
      t += 20;
      hl = 0x8B01;
    }
    /* $8A30 plot: skip, then first byte masked by $B5, middle copied, last
       masked by $B6; a single byte takes both masks ($8AA5) */
    hd = m[hl]; t += 13 + 4 + 7 + 4 + 4 + 10;
    if (hd & 0x40){ de = (de + ((hd >> 3) & 7)) & 0xFFFF; t += 89; }
    const n = hd & 7; t += 25;
    if (n === 0){
      tally('empty');
      hl = sprGet16(m, 0x8B14); de = sprGet16(m, 0x8B16); t += 46;
      continue;
    }
    let b = n; t += 31;
    if (m[0x8B0A]){ b++; t += 4; }
    hl = (hl + 1) & 0xFFFF; b--; t += 37;
    if (m[0x8AFF]){ b--; t += 4; }
    t += 27;
    if (m[0x8AFE]){ de = (de + 1) & 0xFFFF; hl = (hl + 1) & 0xFFFF; b--; t += 16; }
    b &= 0xFF; t += 18;
    if (b === 0){
      tally('single');
      const v = m[hl];
      m[de] = m[de] & (m[0xB500 + v] | m[0xB600 + v]) | v;
      t += 121;
    } else {
      tally('edges');
      let v = m[hl];
      m[de] = m[de] & m[0xB500 + v] | v;
      hl = (hl + 1) & 0xFFFF; de = (de + 1) & 0xFFFF;
      b--; t += 96;
      if (b){ [hl, de] = sprLdir(m, hl, de, b); t += 11 + sprLdirT(b); }
      v = m[hl];
      m[de] = m[de] & m[0xB600 + v] | v;
      t += 70;
    }
    hl = sprGet16(m, 0x8B14); de = sprGet16(m, 0x8B16); t += 46;
  }
}

/* ---- render_fighters $BF13 ---------------------------------------------
   A transliteration of $BF13-$C406 (ledger/BF13.toml) around spriteDecode,
   with each instruction's uncontended T tallied into the return value (D3).
   Each fighter's box is the union of this frame and the last; the boxes are
   drawn apart when the 8-bit overlap test says so, else merged; the box is
   filled from the 64-row shadow at $8000 into the back buffer $F730 (rows
   past shadow row $40 zeroed), the fighters' parts are decoded into it, and
   the box is copied to the display file.  m is the 64K of the machine; sp
   is SP at entry, whose value less 2 the routine saves at $C2B0 while it
   borrows SP to zero-fill.  T measured: equal to the harness's uncontended
   twin on every rendfx case (python tools/rendfx.py --check).  Contention
   in play is not charged here: cost, if given, receives the split that
   rfPlayT charges (D4). */
let rfCost = { dec: 0, copy: 0, ldir: 0 };  // $8803's T, bytes and T of the $C3F0 LDIR
const rfMul = (m, d, e) => [d * e, 222 - [0, 1, 2, 3, 4, 5, 6, 7].reduce((n, i) => n + (e >> i & 1), 0)];  // $C319: HL = D*E
function rfMinMax(d, e){                          // $C1F6 with its CALL: [min, max, T]
  return d < e ? [d, e, 66] : [e, d, 78];
}
const rfLdir = (m, s, d, n) => { for (let i = n || 0x10000; i > 0; i--){ m[d] = m[s]; s = (s + 1) & 0xFFFF; d = (d + 1) & 0xFFFF; } return [s, d]; };
function rfScreenAddr(y){                         // Screen_Calc $C203 with its CALL: [HL, T]
  const hi = y & 0xC0;
  const base = hi === 0 ? 0x4000 : hi === 0x40 ? 0x4800 : 0x5000;
  return [base + ((y & 7) << 8) + ((y & 0x38) << 2), 17 + (hi === 0 ? 31 : 58) + 108];
}
/* $C234: fill the back buffer from the shadow; h = width bytes, l = rows,
   b = x & $FC, c = (ymin - $48) & 255.  Returns T with its CALL. */
function rfShadow(m, h, l, b, c, sp){
  let [p, tm] = rfMul(m, 0x20, c);
  let de = (p + (b >> 2)) & 0xFFFF;
  let t = 17 + 17 + 109 + tm + 49;
  m[0xC2B4] = 0;
  if (((c + l - 1) & 0xFF) >= 0x40){
    const nl = (0x40 - c) & 0xFF;
    m[0xC2B2] = (l - nl) & 0xFF; m[0xC2B3] = h; m[0xC2B4] = 1;
    l = nl; t += 77;
  }
  let src = (0x8000 + de) & 0xFFFF, dst = 0xF730;
  t += 39;
  for (let k = l || 256; k > 0; k--){
    [, dst] = rfLdir(m, src, dst, h);
    src = (src + 0x20) & 0xFFFF;
    t += 70 + 21 * (h || 0x10000) - 5 + (k > 1 ? 13 : 8);
  }
  t += 17;
  if (!m[0xC2B4]) return t + 11;
  t += 5 + 11 + 34 + 17;
  [p, tm] = rfMul(m, m[0xC2B2], m[0xC2B3]);
  let n = p, hl = dst;
  t += tm + 10 + 4 + 4 + 10 + 4 + 7;
  const r = n & 7;
  if (r){
    t += 7 + 8;
    for (let k = r; k > 0; k--){ m[hl] = 0; hl = (hl + 1) & 0xFFFF; n = (n - 1) & 0xFFFF; t += k > 1 ? 32 : 27; }
  } else t += 12;
  hl = (hl + n) & 0xFFFF;
  const blocks = ((n >> 3) & 0xFF) || 256;
  const s = (sp - 2) & 0xFFFF;               // the CALL to $C234 is on the stack
  m[0xC2B0] = s & 0xFF; m[0xC2B1] = s >> 8;
  t += 11 + 4 + 4 + 36 + 20 + 6 + 10;
  for (let k = blocks; k > 0; k--){
    for (let i = 0; i < 8; i++){ hl = (hl - 1) & 0xFFFF; m[hl] = 0; }
    t += 44 + (k > 1 ? 13 : 8);
  }
  return t + 20 + 10;
}
/* $C2B5: one part at box-relative (x, y), sprite at hl, buffer at de.
   Returns T with its CALL. */
function rfPart(m, x, y, hl, de){
  const [p, tm] = rfMul(m, m[0xC40D], y);
  const dst = (p + (x >> 2) + de) & 0xFFFF;
  let t = 17 + 141 + tm;
  const s = x & 3;
  t += [28, 55, 72, 72][s];
  m[0xC40E] = m[0xC40C] | [0, 2, 4, 8][s];
  m[0xC407] = m[0xC40B]; m[0xC408] = m[0xC40D];
  const td = spriteDecode(m, hl, dst);
  rfCost.dec += td;
  return t + 99 + td + 10;
}
/* $C34F: the part list at hl, box-relative origin (b, c).  T with its CALL. */
function rfParts(m, b, c, hl, tally){
  m[0xC412] = b; m[0xC413] = c;
  let n = m[hl]; hl = (hl + 1) & 0xFFFF;
  m[0xC416] = m[hl]; hl = (hl + 1) & 0xFFFF;
  m[0xC417] = m[hl]; hl = (hl + 1) & 0xFFFF;
  let t = 17 + 103;
  for (let k = n || 256; k > 0; k--){
    m[0xC414] = m[hl]; m[0xC415] = m[hl + 1 & 0xFFFF];
    const stride = m[hl + 2 & 0xFFFF] | m[hl + 3 & 0xFFFF] << 8;
    m[0xC418] = stride & 0xFF; m[0xC419] = stride >> 8;
    hl = (hl + 4) & 0xFFFF;
    m[0xC40D] = m[0xC40F]; m[0xC40C] = m[0xC410]; m[0xC40B] = m[0xC411];
    let y = (m[0xC413] + m[0xC415]) & 0xFF;
    t += 11 + 11 + 17 + 109 + 78 + 68;
    if (m[0xC415] === 0xFF){ tally('floor-part'); y = (0xBE - m[0xC41A] - 12) & 0xFF; t += 60; }
    let x;
    t += 27;
    if (!m[0xC410]){ tally('unflipped'); x = (m[0xC412] + m[0xC414]) & 0xFF; t += 48; }
    else { tally('flip'); x = (m[0xC412] + m[0xC416] - m[0xC414] - (m[hl] << 2)) & 0xFF; t += 111; }
    t += rfPart(m, x, y, hl, 0xF730);
    hl = (hl + stride) & 0xFFFF;
    t += 20 + 10 + 11 + 10 + 10 + 10 + (k > 1 ? 13 : 8);
  }
  return t + 10;
}
/* $C1A2 / $C1CC: draw fighter f (0 = P1, 1 = P2) in the box whose left
   and top are at bx, by.  T with its CALL. */
function rfFighter(m, f, bx, by, tally){
  m[0xC411] = m[0xC421 + f]; m[0xC410] = m[0xC41F + f];
  const b = (m[0xC41B + 2 * f] - (m[bx] & 0xFC)) & 0xFF;
  const c = (m[0xC41C + 2 * f] - m[by]) & 0xFF;
  const hl = m[0xC428 + 2 * f] | m[0xC429 + 2 * f] << 8;
  return 17 + 161 + rfParts(m, b, c, hl, tally) + 10;
}
/* $C091 / $C101 / $C151: size the box at (bx..bx+1, by..by+1) into
   $C409/$C40A/$C40F and fill it from the shadow.  T. */
function rfBox(m, x0, y0, sp){
  const h = ((((m[x0 + 1] - m[x0]) & 0xFF) >> 2) + 2) & 0xFF;
  m[0xC40A] = h; m[0xC40F] = h;
  const l = (m[y0 + 1] - m[y0]) & 0xFF;
  m[0xC409] = l;
  m[0xC41A] = m[y0];
  return 207 + rfShadow(m, h, l, m[x0] & 0xFC, (m[y0] - 0x48) & 0xFF, sp);
}
/* $C3E4 after its set-up at $C0E8: the box at (x0, y0) to the display.  T. */
function rfCopyOut(m, x0, y0){
  let [de, t] = rfScreenAddr(m[y0]);
  de = (de + (m[x0] >> 2)) & 0xFFFF;
  t += 13 + 13 + 8 + 8 + 4 + 7 + 11 + 4 + 10 + 17 + 34;
  let hl = 0xF730;
  const w = m[0xC40A];
  rfCost.copy += (m[0xC409] || 256) * (w || 0x10000);
  rfCost.ldir += (m[0xC409] || 256) * (21 * (w || 0x10000) - 5);
  for (let k = m[0xC409] || 256; k > 0; k--){
    [hl] = rfLdir(m, hl, de, w);
    let d = (de >> 8) + 1 & 0xFF, e = de & 0xFF;
    t += 11 + 11 + 7 + 21 * (w || 0x10000) - 5 + 10 + 10 + 4 + 4 + 7;
    if (d & 7) t += 12;
    else {
      t += 7 + 7 + 4 + 4;
      e += 0x20;
      if (e > 0xFF){ e &= 0xFF; t += 12; } else { d = (d - 8) & 0xFF; t += 7 + 4 + 7 + 4; }
    }
    de = d << 8 | e;
    t += k > 1 ? 13 : 8;
  }
  return t + 10;
}
/* $BF13's T in play: its uncontended T t, with the cost split renderFighters
   filled, charged the play-weighted contention means of D4 -- the stack is
   at $5Fxx and the display file is contended, and frame phase is lost to a
   free-running tally.  Measured (python tools/rendfx.py --capture, every
   call, s1/p1/p1b 600 frames and p1 A; 614 calls): $8803 x1.0317
   (sprdec.py), the $C3F0 LDIR +4.72 T a byte (callcost.py --sub pooled),
   the rest of $BF13 x1.0425.  Pooled within 0.15% of the contended T in
   every state; one call within 2.9% (frame phase). */
const RF_DEC = 0.0317, RF_COPY = 4.72, RF_OWN = 0.0425;
const rfPlayT = (t, c) => t + RF_DEC * c.dec + RF_COPY * c.copy + RF_OWN * (t - c.dec - c.ldir);
function renderFighters(m, paths, sp = 0x5BF5, cost){
  rfCost = cost || { dec: 0, copy: 0, ldir: 0 };
  const tally = paths ? k => { paths[k] = (paths[k] || 0) + 1; } : () => {};
  let t = 0;
  /* $BF13: the fighters' frame, x, y and facing; P2 from $AA52.., P1 from $AA12.. */
  m[0xC425] = m[0xAA52]; m[0xC426] = 0;
  m[0xC41D] = m[0xAA59]; m[0xC41E] = m[0xAA58]; m[0xC420] = m[0xAA57];
  m[0xC423] = m[0xAA12]; m[0xC424] = 0;
  m[0xC41B] = m[0xAA19]; m[0xC41C] = m[0xAA18]; m[0xC41F] = m[0xAA17];
  t += 236;
  for (const [idx, out] of [[0xC423, 0xC428], [0xC425, 0xC42A]]){
    const a = (0xC440 + 2 * m[idx]) & 0xFFFF;
    const p = (0x44CC + (m[a] | m[a + 1 & 0xFFFF] << 8)) & 0xFFFF;
    m[out] = p & 0xFF; m[out + 1] = p >> 8;
    t += 110;
  }
  /* $BF73: each box the union of this frame and the last; y-max forced to $BE */
  for (let f = 0; f < 2; f++){
    const x = m[0xC41B + 2 * f], y = m[0xC41C + 2 * f], last = 0xC42C + 4 * f, box = 0xC434 + 4 * f;
    const fr = m[0xC428 + 2 * f] | m[0xC429 + 2 * f] << 8;
    const w = m[fr + 1 & 0xFFFF], hh = m[fr + 2 & 0xFFFF];
    let r;
    r = rfMinMax(x, m[last]); m[box] = r[0]; t += 51 + r[2];
    r = rfMinMax(m[last + 1], (x + w) & 0xFF); m[box + 1] = r[1]; t += 94 + r[2];
    r = rfMinMax(y, m[last + 2]); m[box + 2] = r[0]; t += 51 + r[2];
    r = rfMinMax(m[last + 3], (y + hh) & 0xFF); m[box + 3] = 0xBE; t += 81 + r[2];
  }
  /* $C007: this frame becomes the last */
  for (let f = 0; f < 2; f++){
    const x = m[0xC41B + 2 * f], y = m[0xC41C + 2 * f], last = 0xC42C + 4 * f;
    const fr = m[0xC428 + 2 * f] | m[0xC429 + 2 * f] << 8;
    m[last] = x; m[last + 1] = (x + m[fr + 1 & 0xFFFF]) & 0xFF;
    m[last + 2] = y; m[last + 3] = (y + m[fr + 2 & 0xFFFF]) & 0xFF;
  }
  t += 248;
  /* $C03B: the overlap test, 8-bit, with 11 pixels of slack */
  let apart = ((m[0xC439] + 11) & 0xFF) < m[0xC434];
  t += 51;
  if (!apart){ apart = ((m[0xC435] + 11) & 0xFF) < m[0xC438]; t += 51; }
  if (apart){
    tally('separate');
    t += rfBox(m, 0xC434, 0xC436, sp) + rfFighter(m, 0, 0xC434, 0xC436, tally);
    t += rfCopyOut(m, 0xC434, 0xC436);
    t += rfBox(m, 0xC438, 0xC43A, sp) + rfFighter(m, 1, 0xC438, 0xC43A, tally);
    t += rfCopyOut(m, 0xC438, 0xC43A);
    return t + 10;
  }
  tally('merged');
  let r;
  r = rfMinMax(m[0xC434], m[0xC438]); m[0xC434] = r[0]; t += 51 + r[2];
  r = rfMinMax(m[0xC435], m[0xC439]); m[0xC435] = r[1]; t += 51 + r[2];
  r = rfMinMax(m[0xC436], m[0xC43A]); m[0xC436] = r[0]; t += 51 + r[2];
  r = rfMinMax(m[0xC437], m[0xC43B]); m[0xC437] = r[1]; t += 51 + r[2];
  t += rfBox(m, 0xC434, 0xC436, sp);
  m[0xC438] = m[0xC434]; m[0xC43A] = m[0xC436];
  t += 52 + 27;
  if (m[0xC427]){
    tally('p1-first');
    t += rfFighter(m, 0, 0xC434, 0xC436, tally) + rfFighter(m, 1, 0xC438, 0xC43A, tally) + 10;
  } else {
    tally('p2-first');
    t += rfFighter(m, 1, 0xC438, 0xC43A, tally) + rfFighter(m, 0, 0xC434, 0xC436, tally);
  }
  t += rfCopyOut(m, 0xC434, 0xC436);
  return t + 10;
}

/* ---- the demo "game" ------------------------------------------------- */
const TONE_HZ = 440;
class Demo {
  constructor(){
    this.scr = new SpecScreen();
    this.frame = 0;            // video frames stepped (the FLASH clock too)
    this.simFrame = 0;         // the sound bridge's clock, in video frames
    this.x = 15; this.y = 11;  // the block, in character cells
    this.border = 0;
    this.lvl = 0;              // the speaker level the log last set
    this.tNext = 0;            // the next tone edge, in fractional frames
    this.firing = false;
    this.sound = { log: [] };  // rows of [simulatedFrame, level]
    this.scr.fillAttr(0x0F);   // white ink on blue paper
    this.paintCell(true);
  }
  paintCell(on){
    let p = SpecScreen.pixelAddr(this.x*8, this.y*8);
    for (let i = 0; i < 8; i++){ this.scr.put(p, on ? 0xFF : 0); p = SpecScreen.nextRow(p); }
    /* FLASH while firing: bit 7 of the attribute, swapped by renderScreen
       every 16 video frames from the frame counter it is handed */
    this.scr.put(SpecScreen.attrAt(this.x, this.y), (this.firing ? 0x80 : 0) | 0x0F);
  }
  /* one video frame.  QAOP or the cursor keys (5678, i.e. the arrows) or a
     Kempston joystick move; SPACE or fire beeps and reddens the border. */
  step(kb){
    const f0 = this.simFrame, k = kb.kempston;
    let dx = 0, dy = 0;
    if (kb.down('O') || kb.down('5') || (k & KEMPSTON_LEFT))  dx = -1;
    if (kb.down('P') || kb.down('8') || (k & KEMPSTON_RIGHT)) dx = 1;
    if (kb.down('Q') || kb.down('7') || (k & KEMPSTON_UP))    dy = -1;
    if (kb.down('A') || kb.down('6') || (k & KEMPSTON_DOWN))  dy = 1;
    const fire = kb.down('SPACE') || !!(k & KEMPSTON_FIRE);
    if ((dx || dy) && (this.frame % 4) === 0){
      this.paintCell(false);
      this.x = (this.x + dx + 32) % 32; this.y = (this.y + dy + 24) % 24;
    }
    /* the tone is an EDGE STREAM on the simulated clock: a running phase,
       so consecutive frames join without a phase jump */
    if (fire){
      const half = FRAME_HZ / (2 * TONE_HZ);         // half a period, in frames
      if (!this.firing) this.tNext = Math.max(this.tNext, f0);
      while (this.tNext < f0 + 1){
        this.lvl ^= 1; this.sound.log.push([this.tNext, this.lvl]);
        this.tNext += half;
      }
    } else if (this.lvl){
      this.lvl = 0; this.sound.log.push([f0, 0]);    // leave the speaker LOW
    }
    this.firing = fire;
    this.border = fire ? 2 : 0;
    this.paintCell(true);
    this.frame++; this.simFrame++;
  }
}

/* ---- driver ---------------------------------------------------------- */
const cvs = document.getElementById('scr'), ctx = cvs.getContext('2d');
const demo = new Demo();
/* created here, STARTED from the first gesture -- a browser will not run an
   AudioContext before one */
const sound = new SoundOut();
const keyboard = new Keyboard();
attachKeyboard(keyboard, { onGesture(){ sound.start(); } });
const loop = makeLoop({
  hz: FRAME_HZ,
  poll(){ pollGamepads(keyboard); },
  step(){ demo.step(keyboard); },
  draw(){
    /* the bridge is handed the driver's log and the SIMULATED frame the
       engine has reached -- never wall time */
    sound.flush(demo.sound.log, demo.simFrame);
    paintBorder(demo.border);
    renderScreen(ctx, demo.scr, demo.frame);
  },
});
installThemeButton('theme', 'spec-port-theme');
loop.start();

/* the test hook: test/kit.test.js loads the BUILT file and drives this */
globalThis.__PORT__ = { Demo, demo, sound, keyboard, loop, assets: A, spriteDecode, renderFighters, rfPlayT };
</script>
