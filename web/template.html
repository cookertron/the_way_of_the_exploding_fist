<title>Spectrum Port Kit -- starter</title>
<style>
  /* The page is a frame around a Spectrum screen and nothing else.  Two
     themes: the default follows the system, and the corner button pins one.
     The GAME's own colours never change -- the black inside #overscan is the
     Spectrum's border, painted from the emulated OUT ($FE), not page
     furniture. */
  :root{ color-scheme:light dark;
         --bg:#0f1115; --edge:#2a313c; --btn:#98a2b3; }
  @media (prefers-color-scheme:light){
    :root{ --bg:#e9ebef; --edge:#c3c9d3; --btn:#59636f; }
  }
  :root[data-theme="dark"]{  --bg:#0f1115; --edge:#2a313c; --btn:#98a2b3; }
  :root[data-theme="light"]{ --bg:#e9ebef; --edge:#c3c9d3; --btn:#59636f; }

  *{ box-sizing:border-box }
  html,body{ height:100% }
  body{ margin:0; background:var(--bg); padding:16px;
        display:flex; align-items:center; justify-content:center;
        transition:background 140ms linear }
  #overscan{ display:inline-block; padding:24px 32px; background:#000;
             border:1px solid var(--edge); border-radius:4px; line-height:0;
             transition:background 40ms linear, border-color 140ms linear }
  canvas{ image-rendering:pixelated; background:#000; border:0; display:block;
          max-width:100%; height:auto; width:768px }
  /* deliberately faint: it is the only thing on the page that is not the game */
  #theme{ position:fixed; top:10px; right:12px; width:28px; height:28px;
          border:1px solid var(--edge); border-radius:50%; background:transparent;
          color:var(--btn); font:14px/1 system-ui,sans-serif; cursor:pointer;
          opacity:.22; transition:opacity 140ms linear, color 140ms linear;
          display:flex; align-items:center; justify-content:center; padding:0 }
  #theme:hover,#theme:focus-visible{ opacity:1 }
</style>

<!-- THE OVERSCAN FRAME: a real Spectrum draws a border around the 256x192
     display and games use it.  The padding is the border's width and its
     background is the emulated OUT ($FE). -->
<div id="overscan"><canvas id="scr" width="256" height="192"></canvas></div>
<button id="theme" type="button" title="theme: system / dark / light"
        aria-label="switch theme">&#9680;</button>

<script type="application/json" id="assets">__ASSETS__</script>
<script>
/* =======================================================================
   GENERATED FILE -- do not edit.  Edit web/template.html and rebuild with
       python tools/build.py
   =======================================================================
   THE STARTER.  Everything above the demo is the kit; the demo is the
   smallest thing that exercises every layer of it end to end -- display
   file, ULA colours and FLASH, border, keyboard matrix, Kempston/gamepad,
   the beeper edge stream and the sound bridge, the fixed-timestep loop --
   so a new port begins from a page that already runs and already has a
   headless test suite (test/kit.test.js) driving it.  Replace `Demo` with
   the port's engine; keep the shape:
       step(kb) advances ONE video frame and logs sound against its own
       frame counter; draw is fillRect-only; sound is flushed from draw
       with the simulation's frame count.                                 */
const A = JSON.parse(document.getElementById('assets').textContent);

/*#include platform.js*/

/* ---- the sprite decoder $8803 ------------------------------------------
   A transliteration of tools/sprdec.py (ledger/8803.toml): the same rows,
   the same branches, and each instruction's uncontended T, tallied into the
   return value (D3).  m is the 64K of the machine (a Uint8Array): it reads
   the sprite at hl, the flags $C40E (bit 0 mirror, bits 1/2/3 shift
   2/4/6 px), $C407 (recolour) and $C408 (the stride), the tables
   $B500-$B9FF, and writes its scratch $8AE9-$8B1C and the bytes under de.
   T measured: equal to the harness's uncontended twin on all 441 sprdec
   cases (python tools/sprdec.py --check).  Stack contention in play is not
   charged here (8803 open 1). */
const sprLdirT = n => 21 * (n || 0x10000) - 5;
const sprDjnzT = (k, body) => k * (body + 13) - 5;
function sprLdir(m, s, d, n){
  for (let i = n || 0x10000; i > 0; i--){ m[d] = m[s]; s = (s + 1) & 0xFFFF; d = (d + 1) & 0xFFFF; }
  return [s, d];
}
function sprPut16(m, a, v){ m[a] = v & 0xFF; m[a + 1] = (v >> 8) & 0xFF; }
const sprGet16 = (m, a) => m[a] | m[a + 1] << 8;

function spriteDecode(m, hl, de, paths){
  const tally = paths ? k => { paths[k] = (paths[k] || 0) + 1; } : () => {};
  const F = m[0xC40E];
  /* M1 (for R) beside each T: one per instruction, two for BIT, SLA, RRD,
     LD DE,(nn) and each LDIR repeat (python tools/blockcost.py 0x8803 0x8AE9) */
  let t = 13 + 7 + 10; M1.m1 += 3;
  if (F & 0xFE){ m[0x8B0A] = 1; t += 7 + 13 + 10; M1.m1 += 3; }
  else { m[0x8B0A] = 0; t += 4 + 13; M1.m1 += 2; }
  m[0x8AF3] = 0; t += 7 + 13; M1.m1 += 2;
  let w = m[hl];
  m[0x8B1C] = w; m[0x8B1B] = w; t += 7 + 13 + 13 + 4 + 13 + 4 + 10; M1.m1 += 7;
  if (m[0x8B0A]){ m[0x8B1C] = (w + 1) & 0xFF; t += 13 + 4 + 13; M1.m1 += 3; }
  hl = (hl + 1) & 0xFFFF; t += 6; M1.m1 += 1;
  /* a sprite ends at a 0 header within a few hundred rows; one that does
     not is not sprite data (the machine would run away too): say so */
  for (let rows = 0; ; rows++){
    if (rows > 0xFFFF) throw new Error(`FIST_RUNAWAY spriteDecode: no end row in 65536 from $${hl.toString(16)}`);
    /* $8833 row top */
    m[0x8AF3] ^= 1; t += 13 + 7 + 13;
    m[0x8AFF] = 0; m[0x8AFE] = 0; t += 4 + 13 + 13;
    t += 7 + 4 + 10; M1.m1 += 9;
    if (m[hl] === 0){ M1.m1 += 1; return t + 10; }
    sprPut16(m, 0x8B16, de + m[0xC408]); t += 72; M1.m1 += 7;
    let hd = m[hl]; t += 7 + 4 + 10; M1.m1 += 3;
    if (!(hd & 0x80)){                              /* $8858 raw row: w bytes */
      tally('raw');
      w = m[0x8B1B];
      sprPut16(m, 0x8B14, hl + w);
      m[0x8AE9] = w | 0x80;
      sprLdir(m, hl, 0x8AEA, w);
      hl = 0x8AE9;
      t += 13 + 4 + 7 + 11 + 11 + 16 + 10 + 11 + 10 + 7 + 7 + 6 + sprLdirT(w) + 30; M1.m1 += 15 + 2 * (w || 0x10000);
    } else {                                        /* $8875 packed row */
      tally('packed');
      sprPut16(m, 0x8B14, hl + (hd & 7) + 1);
      t += 4 + 7 + 4 + 4 + 7 + 11 + 11 + 16 + 10; M1.m1 += 9;
    }
    /* $8882 recolour by row parity, tables $B8/$B9 via $8AD1 */
    t += 13 + 4 + 10; M1.m1 += 3;
    if (m[0xC407]){
      tally('recolour');
      const a = m[hl], n = a & 7, tab = m[0x8AF3] ? 0xB800 : 0xB900;
      m[0x8AF4] = a;
      for (let i = 0; i < n; i++) m[0x8AF5 + i] = m[tab + m[(hl + 1 + i) & 0xFFFF]];
      t += 11 + 7 + 10 + 7 + 6 + 6 + 7 + 4 + 4 + 10 + 20;
      if (n) t += sprDjnzT(n, 7 + 17 + 97 + 7 + 6 + 6);
      M1.m1 += 12 + 17 * n;                         // $8AD1 is 11 either way
      hl = 0x8AF4;
    }
    /* $88A5 mirror: skip re-measured from the right, bytes reversed by $B7 */
    t += 13 + 8 + 10; M1.m1 += 4;
    if (F & 1){
      tally('mirror');
      hd = m[hl];
      const n = hd & 7, s = (hd >> 3) & 7;
      let a = (((m[0x8B1B] - s - n) & 0xFF) << 3) & 0xFF;
      t += 128; M1.m1 += 22;
      if (a){ a |= 0x40; t += 7; M1.m1 += 1; }
      m[0x8B0B] = a | 0x80 | n;
      for (let i = 0; i < n; i++) m[0x8B0B + n - i] = m[0xB700 + m[(hl + 1 + i) & 0xFFFF]];
      t += 42 + 78 + (n ? sprDjnzT(n, 65) : 0) + 20; M1.m1 += 7 + 13 + 10 * n + 2;
      hl = 0x8B0B;
    }
    /* $88F7 shift: bit 1 two pixels, bit 2 four (RRD), bit 3 six (left 2) */
    t += 13 + 8 + 10; M1.m1 += 4;
    let sh = 0;
    if (F & 2) sh = 2;
    else {
      t += 13 + 8 + 10; M1.m1 += 4;
      if (F & 4) sh = 4;
      else {
        t += 13 + 8 + 10; M1.m1 += 4;
        if (F & 8) sh = 6;
      }
    }
    if (sh){
      tally('shift' + sh);
      hd = m[hl]; m[0x8B01] = hd;
      const n = hd & 7, src = (hl + 1) & 0xFFFF;
      t += 7 + 11 + 10 + 7 + 10 + 6 + 7 + 10; M1.m1 += 8;
      if (n){
        m[0x8B00] = n;
        const first = m[src], k = n + 1;
        if (sh === 6){
          m[0x8B02] = 0;
          t += 13 + 11 + 10 + 4 + 7 + 11 + 4 + 7 + 6 + 7 + 7 + 10; M1.m1 += 12;
          if (first < 0x40){ m[0x8AFE] = 1; t += 20; M1.m1 += 2; }
          sprLdir(m, src, 0x8B03, n);
          t += 4 + 4 + 10 + sprLdirT(n) + 10 + 10 + 13 + 4 + 4 + 4 + 4 + 4 + 10; M1.m1 += 12 + 2 * n;
          t += 11 + 13 + 4 + 7 + 11 + 10 + 11 + 11 + 4; M1.m1 += 9;
          for (let r = 0; r < 2; r++){
            let c = 0;
            for (let a = 0x8B02 + n; a > 0x8B01; a--){ const v = m[a]; m[a] = (v << 1 | c) & 0xFF; c = v >> 7; }
          }
          t += 2 * sprDjnzT(k, 24) + 10 + 4 + 4 + 10 + 7 + 4 + 10; M1.m1 += 10 * k + 7;
        } else {
          t += 13 + 11 + 10 + 4 + 7 + 7 + 7 + 10; M1.m1 += 8;
          if (first < (sh === 2 ? 4 : 0x10)){ m[0x8AFE] = 1; t += 20; M1.m1 += 2; }
          sprLdir(m, src, 0x8B02, n);
          m[0x8B02 + n] = 0;
          t += 11 + 4 + 4 + 10 + sprLdirT(n) + 10 + 4 + 7 + 10; M1.m1 += 8 + 2 * n;
          if (sh === 2){
            for (let r = 0; r < 2; r++){
              let c = 0;
              for (let a = 0x8B02; a < 0x8B02 + k; a++){ const v = m[a]; m[a] = v >> 1 | c << 7; c = v & 1; }
            }
            t += 47 + 11 + 2 * sprDjnzT(k, 24) + 10 + 4 + 4; M1.m1 += 12 + 10 * k;
          } else {
            let acc = 0;
            for (let a = 0x8B02; a < 0x8B02 + k; a++){ const v = m[a]; m[a] = (acc & 0xF) << 4 | v >> 4; acc = v & 0xF; }
            t += 13 + 4 + 4 + 4 + sprDjnzT(k, 24); M1.m1 += 4 + 4 * k;
          }
          t += 6 + 7 + 4 + 10; M1.m1 += 4;
        }
        if (m[0x8B02 + n] === 0){ m[0x8AFF] = 1; t += 20; M1.m1 += 2; }
      }
      t += 20; M1.m1 += 2;
      hl = 0x8B01;
    }
    /* $8A30 plot: skip, then first byte masked by $B5, middle copied, last
       masked by $B6; a single byte takes both masks ($8AA5) */
    hd = m[hl]; t += 13 + 4 + 7 + 4 + 4 + 10; M1.m1 += 6;
    if (hd & 0x40){ de = (de + ((hd >> 3) & 7)) & 0xFFFF; t += 89; M1.m1 += 15; }
    const n = hd & 7; t += 25; M1.m1 += 4;
    if (n === 0){
      tally('empty');
      hl = sprGet16(m, 0x8B14); de = sprGet16(m, 0x8B16); t += 46; M1.m1 += 4;
      continue;
    }
    let b = n; t += 31; M1.m1 += 4;
    if (m[0x8B0A]){ b++; t += 4; M1.m1 += 1; }
    hl = (hl + 1) & 0xFFFF; b--; t += 37; M1.m1 += 5;
    if (m[0x8AFF]){ b--; t += 4; M1.m1 += 1; }
    t += 27; M1.m1 += 3;
    if (m[0x8AFE]){ de = (de + 1) & 0xFFFF; hl = (hl + 1) & 0xFFFF; b--; t += 16; M1.m1 += 3; }
    b &= 0xFF; t += 18; M1.m1 += 3;
    if (b === 0){
      tally('single');
      const v = m[hl];
      m[de] = m[de] & (m[0xB500 + v] | m[0xB600 + v]) | v;
      t += 121; M1.m1 += 21;
    } else {
      tally('edges');
      let v = m[hl];
      m[de] = m[de] & m[0xB500 + v] | v;
      hl = (hl + 1) & 0xFFFF; de = (de + 1) & 0xFFFF;
      b--; t += 96; M1.m1 += 17;
      if (b){ [hl, de] = sprLdir(m, hl, de, b); t += 11 + sprLdirT(b); M1.m1 += 2 + 2 * b; }
      v = m[hl];
      m[de] = m[de] & m[0xB600 + v] | v;
      t += 70; M1.m1 += 13;
    }
    hl = sprGet16(m, 0x8B14); de = sprGet16(m, 0x8B16); t += 46; M1.m1 += 4;
  }
}

/* ---- render_fighters $BF13 ---------------------------------------------
   A transliteration of $BF13-$C406 (ledger/BF13.toml) around spriteDecode,
   with each instruction's uncontended T tallied into the return value (D3).
   Each fighter's box is the union of this frame and the last; the boxes are
   drawn apart when the 8-bit overlap test says so, else merged; the box is
   filled from the 64-row shadow at $8000 into the back buffer $F730 (rows
   past shadow row $40 zeroed), the fighters' parts are decoded into it, and
   the box is copied to the display file.  m is the 64K of the machine; sp
   is SP at entry, whose value less 2 the routine saves at $C2B0 while it
   borrows SP to zero-fill.  T measured: equal to the harness's uncontended
   twin on every rendfx case (python tools/rendfx.py --check).  Contention
   in play is not charged here: cost, if given, receives the split that
   rfPlayT charges (D4). */
let rfCost = { dec: 0, copy: 0, ldir: 0 };  // $8803's T, bytes and T of the $C3F0 LDIR
const rfPop = e => [0, 1, 2, 3, 4, 5, 6, 7].reduce((n, i) => n + (e >> i & 1), 0);
const rfMul = (m, d, e) => [d * e, 222 - rfPop(e), 38 + rfPop(e)];  // $C319: HL = D*E [HL, T, M1], without its CALL
/* M1 (for R) in the render helpers: one per instruction, two for the CB,
   ED and index-register ones and each LDIR repeat (python tools/blockcost.py
   0xBF13 0xC407); each helper adds its own into M1.m1, rfMinMax and
   rfScreenAddr return theirs for the caller */
function rfMinMax(d, e){                          // $C1F6 with its CALL: [min, max, T, M1]
  return d < e ? [d, e, 66, 7] : [e, d, 78, 10];
}
const rfLdir = (m, s, d, n) => { for (let i = n || 0x10000; i > 0; i--){ m[d] = m[s]; s = (s + 1) & 0xFFFF; d = (d + 1) & 0xFFFF; } return [s, d]; };
function rfScreenAddr(y){                         // Screen_Calc $C203 with its CALL: [HL, T]
  const hi = y & 0xC0;
  const base = hi === 0 ? 0x4000 : hi === 0x40 ? 0x4800 : 0x5000;
  return [base + ((y & 7) << 8) + ((y & 0x38) << 2), 17 + (hi === 0 ? 31 : 58) + 108, hi === 0 ? 24 : 27];
}
/* $C234: fill the back buffer from the shadow; h = width bytes, l = rows,
   b = x & $FC, c = (ymin - $48) & 255.  Returns T with its CALL. */
function rfShadow(m, h, l, b, c, sp){
  let [p, tm, rm] = rfMul(m, 0x20, c);
  let de = (p + (b >> 2)) & 0xFFFF;
  let t = 17 + 17 + 109 + tm + 49; M1.m1 += 25 + rm;
  m[0xC2B4] = 0;
  if (((c + l - 1) & 0xFF) >= 0x40){
    const nl = (0x40 - c) & 0xFF;
    m[0xC2B2] = (l - nl) & 0xFF; m[0xC2B3] = h; m[0xC2B4] = 1;
    l = nl; t += 77; M1.m1 += 11;
  }
  let src = (0x8000 + de) & 0xFFFF, dst = 0xF730;
  t += 39; M1.m1 += 5;
  for (let k = l || 256; k > 0; k--){
    [, dst] = rfLdir(m, src, dst, h);
    src = (src + 0x20) & 0xFFFF;
    t += 70 + 21 * (h || 0x10000) - 5 + (k > 1 ? 13 : 8); M1.m1 += 8 + 2 * (h || 0x10000);
  }
  t += 17; M1.m1 += 2;
  if (!m[0xC2B4]){ M1.m1 += 1; return t + 11; }
  t += 5 + 11 + 34 + 17; M1.m1 += 7;
  [p, tm, rm] = rfMul(m, m[0xC2B2], m[0xC2B3]);
  let n = p, hl = dst;
  t += tm + 10 + 4 + 4 + 10 + 4 + 7; M1.m1 += rm + 6;
  const r = n & 7;
  if (r){
    t += 7 + 8; M1.m1 += 3 + 4 * r;
    for (let k = r; k > 0; k--){ m[hl] = 0; hl = (hl + 1) & 0xFFFF; n = (n - 1) & 0xFFFF; t += k > 1 ? 32 : 27; }
  } else { t += 12; M1.m1 += 1; }
  hl = (hl + n) & 0xFFFF;
  const blocks = ((n >> 3) & 0xFF) || 256;
  const s = (sp - 2) & 0xFFFF;               // the CALL to $C234 is on the stack
  m[0xC2B0] = s & 0xFF; m[0xC2B1] = s >> 8;
  t += 11 + 4 + 4 + 36 + 20 + 6 + 10; M1.m1 += 16 + 5 * blocks + 3;   // with LD SP,(nn) and the RET
  for (let k = blocks; k > 0; k--){
    for (let i = 0; i < 8; i++){ hl = (hl - 1) & 0xFFFF; m[hl] = 0; }
    t += 44 + (k > 1 ? 13 : 8);
  }
  return t + 20 + 10;
}
/* $C2B5: one part at box-relative (x, y), sprite at hl, buffer at de.
   Returns T with its CALL. */
function rfPart(m, x, y, hl, de){
  const [p, tm, rm] = rfMul(m, m[0xC40D], y);
  const dst = (p + (x >> 2) + de) & 0xFFFF;
  let t = 17 + 141 + tm;
  const s = x & 3;
  t += [28, 55, 72, 72][s]; M1.m1 += 20 + rm + [4, 7, 9, 9][s] + 8 + 1;
  m[0xC40E] = m[0xC40C] | [0, 2, 4, 8][s];
  m[0xC407] = m[0xC40B]; m[0xC408] = m[0xC40D];
  const td = spriteDecode(m, hl, dst);
  rfCost.dec += td;
  return t + 99 + td + 10;
}
/* $C34F: the part list at hl, box-relative origin (b, c).  T with its CALL. */
function rfParts(m, b, c, hl, tally){
  m[0xC412] = b; m[0xC413] = c;
  let n = m[hl]; hl = (hl + 1) & 0xFFFF;
  m[0xC416] = m[hl]; hl = (hl + 1) & 0xFFFF;
  m[0xC417] = m[hl]; hl = (hl + 1) & 0xFFFF;
  let t = 17 + 103; M1.m1 += 14 + 1;               // with the RET
  for (let k = n || 256; k > 0; k--){
    m[0xC414] = m[hl]; m[0xC415] = m[hl + 1 & 0xFFFF];
    const stride = m[hl + 2 & 0xFFFF] | m[hl + 3 & 0xFFFF] << 8;
    m[0xC418] = stride & 0xFF; m[0xC419] = stride >> 8;
    hl = (hl + 4) & 0xFFFF;
    m[0xC40D] = m[0xC40F]; m[0xC40C] = m[0xC410]; m[0xC40B] = m[0xC411];
    let y = (m[0xC413] + m[0xC415]) & 0xFF;
    t += 11 + 11 + 17 + 109 + 78 + 68; M1.m1 += 30 + 3 + 8;   // with the 27 and the tail
    if (m[0xC415] === 0xFF){ tally('floor-part'); y = (0xBE - m[0xC41A] - 12) & 0xFF; t += 60; M1.m1 += 8; }
    let x;
    t += 27;
    if (!m[0xC410]){ tally('unflipped'); x = (m[0xC412] + m[0xC414]) & 0xFF; t += 48; M1.m1 += 6; }
    else { tally('flip'); x = (m[0xC412] + m[0xC416] - m[0xC414] - (m[hl] << 2)) & 0xFF; t += 111; M1.m1 += 17; }
    t += rfPart(m, x, y, hl, 0xF730);
    hl = (hl + stride) & 0xFFFF;
    t += 20 + 10 + 11 + 10 + 10 + 10 + (k > 1 ? 13 : 8);
  }
  return t + 10;
}
/* $C1A2 / $C1CC: draw fighter f (0 = P1, 1 = P2) in the box whose left
   and top are at bx, by.  T with its CALL. */
function rfFighter(m, f, bx, by, tally){
  m[0xC411] = m[0xC421 + f]; m[0xC410] = m[0xC41F + f];
  const b = (m[0xC41B + 2 * f] - (m[bx] & 0xFC)) & 0xFF;
  const c = (m[0xC41C + 2 * f] - m[by]) & 0xFF;
  const hl = m[0xC428 + 2 * f] | m[0xC429 + 2 * f] << 8;
  M1.m1 += 1 + 17 + 1;
  return 17 + 161 + rfParts(m, b, c, hl, tally) + 10;
}
/* $C091 / $C101 / $C151: size the box at (bx..bx+1, by..by+1) into
   $C409/$C40A/$C40F and fill it from the shadow.  T. */
function rfBox(m, x0, y0, sp){
  const h = ((((m[x0 + 1] - m[x0]) & 0xFF) >> 2) + 2) & 0xFF;
  m[0xC40A] = h; m[0xC40F] = h;
  const l = (m[y0 + 1] - m[y0]) & 0xFF;
  m[0xC409] = l;
  m[0xC41A] = m[y0];
  M1.m1 += 27;
  return 207 + rfShadow(m, h, l, m[x0] & 0xFC, (m[y0] - 0x48) & 0xFF, sp);
}
/* $C3E4 after its set-up at $C0E8: the box at (x0, y0) to the display.  T. */
function rfCopyOut(m, x0, y0){
  let [de, t, sm] = rfScreenAddr(m[y0]);
  de = (de + (m[x0] >> 2)) & 0xFFFF;
  t += 13 + 13 + 8 + 8 + 4 + 7 + 11 + 4 + 10 + 17 + 34; M1.m1 += sm + 16 + 1;   // with the RET
  let hl = 0xF730;
  const w = m[0xC40A];
  rfCost.copy += (m[0xC409] || 256) * (w || 0x10000);
  rfCost.ldir += (m[0xC409] || 256) * (21 * (w || 0x10000) - 5);
  for (let k = m[0xC409] || 256; k > 0; k--){
    [hl] = rfLdir(m, hl, de, w);
    let d = (de >> 8) + 1 & 0xFF, e = de & 0xFF;
    t += 11 + 11 + 7 + 21 * (w || 0x10000) - 5 + 10 + 10 + 4 + 4 + 7; M1.m1 += 8 + 2 * (w || 0x10000) + 1;   // with the DJNZ
    if (d & 7){ t += 12; M1.m1 += 1; }
    else {

const font = new Uint8Array(0x300);
for (const [c, g] of Object.entries(fontGlyphs)) font.set(g, (c - 0x20) * 8);
const fontMiss = { count: 0, codes: new Set() };
/* the M1 tally for R (ledger/A3FF.toml): every routine below that does not
   take a counter of its own adds the M1 cycles it executes here, so a
   caller reads R as R at its CALL plus M1.m1 (mod 128, bit 7 kept) */
const M1 = { m1: 0 };

/* $923A with its CALL: character a at screen address hl.  Returns T;
   the M1 count (for R) is added to cnt.m1 when cnt is given. */
function printChar(m, hl, a, cnt){
  const e = (a - 0x20) & 0xFF;
  const [prod, tm] = rfMul(m, 8, e);              // $C319, T without its CALL
  if (!fontGlyphs[a]){ fontMiss.count++; fontMiss.codes.add(a); }
  let src = (prod + FONT_BASE) & 0xFFFF, de = hl, n = 11 + 38 + 7 * 8;
  for (let i = 0; i < 8; i++) n += e >> i & 1;    // $C319: one ADD A,D per set bit
  let t = 17 + 11 + 7 + 4 + 7 + 17 + tm + 10 + 11 + 10 + 7 + 10;
  for (let b = 8; b > 0; b--){
    const i = src - FONT_BASE;
    m[de] = i >= 0 && i < font.length ? font[i] : 0;
    src = (src + 1) & 0xFFFF;
    t += 7 + 7 + 6 + 4 + 17 + 4 + (b > 1 ? 13 : 8);
    /* $9229: down one pixel row */
    let h = ((de >> 8) + 1) & 0xFF, l = de & 0xFF;
    if (h & 7){ t += 37; n += 5; }
    else {
      const s = l + 0x20; l = s & 0xFF;
      if (s > 0xFF){ t += 59; n += 9; }
      else { h = (h - 8) & 0xFF; t += 69; n += 12; }
    }
    de = h << 8 | l;
  }
  if (cnt) cnt.m1 += n;
  return t;
}

/* Print_String $92E4 with its CALL: the 0-terminated string at de, at
   pixel row (pos & $FF) and column (pos >> 8).  Returns T; the M1 count
   is added to cnt.m1 when cnt is given. */
function printString(m, pos, de, cnt){
  const [scr, ts] = rfScreenAddr(pos & 0xFF);
  let hl = (scr + (pos >> 8)) & 0xFFFF;
  let t = 17 + 11 + 11 + 4 + ts + 10 + 4 + 7 + 11 + 10;
  if (cnt) cnt.m1 += 4 + (pos & 0xC0 ? 8 : 5) + 19 + 5;
  for (;;){
    const a = m[de];
    t += 7 + 4;
    if (cnt) cnt.m1 += 3;
    if (!a) return t + 11;
    if (cnt) cnt.m1 += 2 + 5;
    t += 5 + 11 + 11 + printChar(m, hl, a, cnt) + 10 + 10 + 6 + 6 + 10;
    hl = (hl + 1) & 0xFFFF; de = (de + 1) & 0xFFFF;
  }
}

/* Process_Print_Time $9336 with its CALL: hl as five decimal digits into
   Time_Buffer $932C, leading zeros blanked (a lone 0 kept), printed at
   pos.  The divisors are the game's table at $92FF (-10000 .. -1). */
function printNumber(m, hl, pos){
  let t = 17 + 11 + 14;
  t += 17 + 11 + 11 + 11 + 10;                    // $9309 Process_Time with its CALL
  M1.m1 += 4 + 5;
  let ix = 0x932C, de = 0x92FF;
  for (;;){
    const c = m[de], bc = m[de + 1] << 8 | c;
    de += 2;
    t += 52; M1.m1 += 8;
    let a = 0x2F;
    for (;;){                                     // hl ends as the value before the add that failed
      a++;
      const s = hl + bc;
      t += 4 + 4 + 4 + 11; M1.m1 += 5;
      if (s > 0xFFFF){ hl = s & 0xFFFF; t += 12; } else { t += 7; break; }
    }
    m[ix++] = a;
    t += 4 + 19 + 10 + 10 + 4; M1.m1 += 8;        // with the JR NZ
    if (((c + 1) & 0xFF) === 0){ t += 7; break; }
    t += 12;
  }
  t += 10 + 10 + 10 + 10;
  m[ix] = 0;
  t += 15 + 10 + 7 + 7 + 10 + 10; M1.m1 += 4 + 7;
  let p = 0x932C;
  for (;;){
    t += 7 + 7 + 10; M1.m1 += 3;
    if (m[p] !== 0x30) break;
    m[p++] = 0x20;
    t += 7 + 7 + 6 + 10; M1.m1 += 4;
  }
  t += 10 + 7 + 7 + 10; M1.m1 += 4 + 1 + 1;     // with LD DE,$932C and the RET
  if (m[0x9330] === 0x20){ m[0x9330] = 0x30; t += 7 + 7; M1.m1 += 2; }
  return t + 10 + printString(m, pos, 0x932C, M1) + 10;
}

/* ---- bout_timer $9C6F: the bout clock --------------------------------
   Frozen while time is up ($9C2B), during either fighter's reel ($AA03,
   $AA43) or move $17 at $AA04; else every 13th pass ($9CA6) Time $9CA5
   drops by one and is reprinted at $0B00, setting $9C2B at 0.  Returns the
   uncontended T from the CALL at $9745 to $9748 (python tools/callio.py
   --capture --call 0x9745 0x9748 --blind 0x4000-0x57FF; ledger/9C6F.toml). */
function boutTimer(m){
  let t = 17 + 13 + 4;
  M1.m1 += 4;                                      // to the first RET NZ
  if (m[0x9C2B]) return t + 11;
  t += 5 + 13 + 10 + 7; M1.m1 += 4;
  if (m[0xAA03] | m[0xAA43]) return t + 11;
  t += 5 + 13 + 7; M1.m1 += 3;
  if (m[0xAA04] === 0x17) return t + 11;
  t += 5 + 10 + 11; M1.m1 += 3;
  m[0x9CA6]--;                                    // Uint8Array: wraps as DEC (HL)
  if (m[0x9CA6]) return t + 11;
  m[0x9CA6] = 13;
  t += 5 + 10 + 17 + 10 + 11 + 10; M1.m1 += 6;   // $9C87 to the JR NZ
  m[0x9CA5]--;
  if (m[0x9CA5]) t += 12;
  else { m[0x9C2B] = 1; t += 7 + 7 + 13; M1.m1 += 2; }
  M1.m1 += 4 + 1;
  return t + 13 + 7 + 4 + 10 + printNumber(m, m[0x9CA5], 0x0B00) + 10;
}

/* ---- the 2-player yin-yang award $976F-$978D -------------------------
   Only with Num_Players $9C2C = 2.  $AF01: when the fighters' reel bits
   ($AA03, $AA43 AND $10) agree -- neither reeling, or both -- the points
   $AA08/$AA48 are cleared; then Yin_Yang_1UP $900E adds them to the counts
   $AA01/$AA41 and draws, and both counts are cleared.  P1 points nonzero
   returns before P2 is looked at.  Returns the uncontended T from $976F to
   $978D (python tools/callio.py --capture --call 0x976F 0x978D --poke
   0x9C2C=2; ledger/900E.toml). */
const YY_FULL = 0x928A, YY_HALF = 0x92AA;          // Yin_Yang_UDG_Full / _Half, 32 bytes each
function yyLine(m, pos, de){                       // $92CA with its CALL: one cell from de at row pos & $FF, column pos >> 8
  const [scr, ts] = rfScreenAddr(pos & 0xFF);
  let a = (scr + (pos >> 8)) & 0xFFFF;
  let t = 17 + 11 + 11 + 4 + ts + 10 + 4 + 7 + 11 + 10 + 4 + 7;
  /* M1 (for R): its CALL, 3, Screen_Calc $C203 with its CALL (24: every
     yin-yang cell is at row 8 or 16, above row $40), 7, 7 per row with
     $9229's 5/9/12, the RET
     (python tools/blockcost.py 0x92CA 0x92E4 ; 0xC203 0xC234 ; 0x9229 0x923A) */
  M1.m1 += 1 + 3 + 24 + 7 + 8 * 7 + 1;
  for (let b = 8; b > 0; b--){
    m[a] = m[de]; de = (de + 1) & 0xFFFF;
    t += 7 + 7 + 6 + 4 + 17 + 4 + (b > 1 ? 13 : 8);
    /* $9229: down one pixel row */
    let h = ((a >> 8) + 1) & 0xFF, l = a & 0xFF;
    if (h & 7){ t += 37; M1.m1 += 5; }
    else {
      const s = l + 0x20; l = s & 0xFF;
      if (s > 0xFF){ t += 59; M1.m1 += 9; }
      else { h = (h - 8) & 0xFF; t += 69; M1.m1 += 12; }
    }
    a = h << 8 | l;
  }
  return t + 10;
}
function yyCopy(m, de, pos){                       // Yin_Yang_Copy $9255 with its CALL: 2x2 cells, 32 bytes from de
  const right = (pos + 0x100) & 0xFFFF, low = pos & 0xFF00 | (pos + 8) & 0xFF;
  M1.m1 += 1 + 2 + 9 + 11 + 10 + 1;               // its CALL, the code between the four $92CA calls, RET
  return 17 + 11 + 11 + yyLine(m, pos, de)
       + 10 + 10 + 11 + 4 + 10 + 4 + 11 + 4 + 11 + yyLine(m, right, de + 8)
       + 10 + 10 + 11 + 4 + 7 + 4 + 10 + 4 + 11 + 4 + 11 + yyLine(m, low, de + 16)
       + 10 + 10 + 4 + 4 + 7 + 4 + 10 + 4 + 11 + 4 + yyLine(m, (low + 0x100) & 0xFFFF, de + 24) + 10;
}
function yyAward(m, cnt, a, pos1, pos2){           // from LD HL,count: add a, draw by the new count
  a = m[cnt] = (a + m[cnt]) & 0xFF;
  let t = 10 + 7 + 7 + 7; M1.m1 += 4;
  if (a === 1){ M1.m1 += 4; return t + 7 + 20 + yyCopy(m, YY_HALF, pos1) + 10; }
  t += 12 + 7; M1.m1 += 2;
  if (a === 2){ M1.m1 += 4; return t + 7 + 20 + yyCopy(m, YY_FULL, pos1) + 10; }
  t += 12 + 7; M1.m1 += 2;
  if (a === 3){ M1.m1 += 6; return t + 7 + 20 + yyCopy(m, YY_FULL, pos1) + 20 + yyCopy(m, YY_HALF, pos2) + 10; }
  M1.m1 += 4; return t + 12 + 20 + yyCopy(m, YY_FULL, pos2) + 10;
}
function yinYang(m){                               // Yin_Yang_1UP $900E with its CALL
  let t = 17 + 13 + 4 + 10; M1.m1 += 4;
  if (m[0xAA08]) return t + yyAward(m, 0xAA01, m[0xAA08], 0x0408, 0x0108);
  t += 13 + 4; M1.m1 += 2;                         // Yin_Yang_2UP $9057
  M1.m1 += 1;
  if (!m[0xAA48]) return t + 11;
  return t + 5 + yyAward(m, 0xAA41, m[0xAA48], 0x1A08, 0x1D08);
}
function yinYang2P(m){
  let t = 13 + 7; M1.m1 += 2;
  M1.m1 += 1;
  if (m[0x9C2C] !== 2) return t + 12;
  t += 7 + 17 + 47 + 4; M1.m1 += 1 + 5 + 1;      // CALL $AF01 and its body, AND A
  if ((m[0xAA03] ^ m[0xAA43]) & 0x10){ t += 12; M1.m1 += 1; }
  else { m[0xAA08] = 0; m[0xAA48] = 0; t += 7 + 30; M1.m1 += 4; }
  t += yinYang(m);
  m[0xAA01] = 0; m[0xAA41] = 0;
  M1.m1 += 3; return t + 30;
}

/* ---- the sound effect $B15A: effect a, inline and blocking --------------
   Effects 1,2,3,5,6 are pulse trains whose half-periods are ROM bytes AND
   a mask, 0 read as 1 ($B25B, $B297); effect 4 takes its delays from the
   24-bit LFSR $B153-$B155 ($B2D7), carried for the whole session.  D6: the
   ROM bytes are replaced by the substitutes in the sfx asset, which keep
   each segment's count, sum and zeros, so edges and T are the machine's
   (tools/sfx.py --measure).  Each $FE write goes to `out` as [T from entry
   at the start of its OUT, value]; returns the T from $B15A to its RET,
   uncontended (OUT and the stack in contended RAM add 0.02-0.25%, not
   charged).  ledger/B15A.toml. */
const SFX_ROM = (() => {
  const rom = {};
  for (const [e, segs] of Object.entries(A.sfx.segments)){
    const r = rom[e] = new Uint8Array(0x4000);
    for (const s of segs){
      let a = s.de, i = 0;
      do { r[a] = s.vals[i++]; r[a + 1] = s.vals[i++]; a += 2; } while (a < s.hl);
    }
  }
  return rom;
})();
function soundEffect(m, a, out){
  /* M1 (for R): one per instruction, two for the CB and ED ones; each
     RET's own is counted with the test before it */
  let t = 4; M1.m1 += 2;                           // AND A
  if (!a) return t + 11;
  t += 5 + 4 + 13 + 4 + 4; M1.m1 += 5;             // LD C,A: LD A,(Flag_Sound): AND A: LD A,C
  if (!m[0xB2FA]) return t + 11;
  t += 5 + 4 + 4 + 4 + 7 + 10 + 11 + 7 + 6 + 7 + 4 + 17 + 4; M1.m1 += 12;   // to JP (HL)
  const at = 0xB144 + 2 * ((a - 1) & 0x7F);
  const rom = SFX_ROM[a] || new Uint8Array(0x4000);
  const edge = v => out.push([t, v]);
  const delay = (n, per, k) => { t += (n || 0x10000) * per - 5; M1.m1 += (n || 0x10000) * k; };   // DEC BC .. JR NZ with BC = n, k instructions a pass

  function pulses(mask, de, hl, nops){             // $B25B (4 NOPs) / $B297 (6 NOPs)
    m[0xB156] = hl & 0xFF; m[0xB157] = hl >> 8; m[0xB158] = mask;
    t += 16 + 13; M1.m1 += 2;
    for (;;){
      t += 13 + 4; M1.m1 += 2;                     // LD A,(B158): LD H,A
      for (const low of [0x1F, 0x07]){
        const v = (de < 0x4000 ? rom[de] : m[de]) & m[0xB158];
        de = (de + 1) & 0xFFFF;
        t += 7 + 6 + 4 + (v ? 12 : 11) + 4 + 13 + 7; M1.m1 += v ? 8 : 9;
        edge(m[0xB159] & low); t += 11;
        t += (v || 1) * (4 * nops + 13) - 5;       // the NOPs and DJNZ
        M1.m1 += (v || 1) * (nops + 1);
      }
      const left = (m[0xB156] | m[0xB157] << 8) - de;
      t += 16 + 4 + 15; M1.m1 += 5;                // with the RET Z
      if (!left) return t += 11;
      t += 5; M1.m1 += 1;
      if (left < 0){ M1.m1 += 1; return t += 7 + 10; }   // unreached: every effect's HL - DE is even
      t += 12;
    }
  }
  function lfsr(low){                              // $B22D (low $1F) / $B244 (low 7): returns BC
    t += 13 + 7; edge(m[0xB159] & low); t += 11 + 17;
    M1.m1 += 4 + 19 + 8;                           // to the CALL, $B2D7, the tail
    const x = m[0xB155] ^ (m[0xB154] << 1 & 0xFF);
    const c3 = m[0xB153] & 1, c4 = m[0xB154] & 1;
    m[0xB153] = (x << 1 & 0x80) | m[0xB153] >> 1;
    m[0xB154] = c3 << 7 | m[0xB154] >> 1;
    m[0xB155] = c4 << 7 | m[0xB155] >> 1;
    t += 144 + 59;                                 // $B2D7 and the tail
    const c = m[0xB153] | m[0xB154];
    return (c & 1) << 8 | c;
  }
  function noise(d0, per, k, keepB){               // one PUSH DE .. JR NZ block of $B19D
    t += 10; M1.m1 += 1;                           // LD DE
    for (let d = d0; d; d--){
      t += 11; M1.m1 += 1;                         // PUSH DE
      for (let e = 8; e; e--){
        t += 17; M1.m1 += 1; let bc = lfsr(0x1F);
        if (!keepB){ bc &= 0xFF; t += 7; M1.m1 += 1; }   // LD B,0
        delay(bc, per, k);
        t += 17; M1.m1 += 1; bc = lfsr(0x07);
        if (!keepB){ bc &= 0xFF; t += 7; M1.m1 += 1; }
        delay(bc, per, k);
        t += 4 + (e > 1 ? 12 : 7); M1.m1 += 2;     // DEC E: JR NZ
      }
      t += 10 + 4 + (d > 1 ? 12 : 7); M1.m1 += 3;  // POP DE: DEC D: JR NZ
    }
  }

  switch (m[at] | m[at + 1] << 8){
    case 0xB179: t += 7 + 10 + 10 + 17; M1.m1 += 4; pulses(0x7F, 0x000A, 0x0400, 4); t += 10; M1.m1 += 1; break;
    case 0xB185: t += 7 + 10 + 10 + 17; M1.m1 += 4; pulses(0x3F, 0x000A, 0x0300, 6); t += 10; M1.m1 += 1; break;
    case 0xB191: t += 7 + 10 + 10 + 17; M1.m1 += 4; pulses(0x3F, 0x00C0, 0x0100, 6); t += 10; M1.m1 += 1; break;
    case 0xB221: t += 7 + 10 + 10 + 17; M1.m1 += 4; pulses(0x3F, 0x0080, 0x0100, 6); t += 10; M1.m1 += 1; break;
    case 0xB19D:
      noise(3, 26, 4, false);                      // DEC BC: LD A,B: OR C: JR NZ
      noise(2, 30, 5, true);                       // .. with a NOP
      noise(2, 38, 7, true);                       // .. with three
      t += 10; M1.m1 += 1; break;
    case 0xB1FB:
      t += 7 + 10 + 10 + 17; M1.m1 += 4; pulses(0xFF, 0x00E0, 0x0120, 6);
      m[0xB151] = 0x00; m[0xB152] = 0x20; t += 10 + 16 + 17 + 20; M1.m1 += 3 + 2;   // $B2F0 with BC = $2000
      delay(0x2000, 26, 4); t += 10; M1.m1 += 1;
      m[0xB151] = 0xFF; m[0xB152] = 0xFF; t += 10 + 16; M1.m1 += 2;
      t += 7 + 10 + 10 + 17; M1.m1 += 4; pulses(0xFF, 0x03C0, 0x0400, 6); t += 10; M1.m1 += 1; break;
    default: throw new Error(`soundEffect: effect ${a} jumps to an unported address`);
  }
  m[0xB150] = 0; M1.m1 += 3;
  return t + 4 + 13 + 10;                          // XOR A: LD ($B150),A: RET
}

/* ---- the hit tests $9D29 / $9ED2: does one fighter's move land ---------
   The two routines are one body with the fighters' blocks swapped: A is
   the attacker's ($AA00 P1, $AA40 P2), V the victim's, and xa, xv their
   x copies ($A071 P1, $A072 P2).  D = the attacker's move A+$04.  Its
   table bytes are read as LD L,base+D, which wraps inside the page.  A
   frame of a striking move ($A90D+D, $A971+D matching A+$12), with A+$13
   set and A+$16, A+$09 clear, picks the reach row ($A98A or, when the
   facings A+$17/V+$17 agree, $A9BC) and the victim's frame V+$12 indexes
   it: $80 there is no reach.  The reach E and the gap C between the x
   copies decide 2 or 1 points (A+$08) by $A93F+D and $A958+D, then the
   tail sets $AA3F, the sound $B150 and the victim's reel V+$03.  t comes
   in holding the T up to LD A,(A+$04) (ledger/9ED2.toml, 9D29.toml). */
function hitTest(m, A, V, t){
  const D = m[A + 0x04];
  const tb = base => m[(base & 0xFF00) | ((base + D) & 0xFF)];
  /* M1: one per instruction, two for SLA A; each RET's own is counted
     with the test before it */
  t += 13 + 4 + 10 + 4 + 4 + 4 + 7 + 4; M1.m1 += 9;
  if (!tb(0xA90D)) return t + 11;
  t += 5 + 17; M1.m1 += 3;
  if (!m[A + 0x13]) return t + 11;
  t += 5 + 17; M1.m1 += 3;
  if (m[A + 0x16]) return t + 11;
  t += 5 + 17; M1.m1 += 3;
  if (m[A + 0x09]) return t + 11;
  t += 5 + 29 + 17; M1.m1 += 8;
  if (m[A + 0x12] !== tb(0xA971)) return t + 11;
  t += 5 + 30; M1.m1 += 4;
  const same = m[A + 0x17] === m[V + 0x17];
  const row = (same ? 0xA9BC : 0xA98A) + ((D << 1) & 0xFF);
  m[0xA06F] = m[row]; m[0xA070] = m[(row + 1) & 0xFFFF];
  t += same ? 12 + 104 : 7 + 106; M1.m1 += 14;
  const r = m[((m[0xA06F] | m[0xA070] << 8) + m[V + 0x12]) & 0xFFFF];
  t += 69; M1.m1 += 9;
  if (r === 0x80) return t + 11;
  const E = (r + 0x80) & 0xFF;
  /* the gap's sense: the fall-through takes victim x - attacker x, when
     A+$17 is clear on the $A98A path, when it is set on the $A9BC path */
  const xa = A === 0xAA00 ? 0xA071 : 0xA072, xv = A === 0xAA00 ? 0xA072 : 0xA071;
  const vFirst = !m[A + 0x17] !== same;
  t += 5 + 11 + (vFirst ? 66 : 59); M1.m1 += vFirst ? 9 : 8;
  const C = ((vFirst ? m[xv] - m[xa] : m[xa] - m[xv]) + 0x80) & 0xFF;
  t += 44; M1.m1 += 8;
  const near = tb(0xB47E) ? same : !same;   // the $9F65/$A000 test, else $9F83/$9FE4
  let pts = 0;
  if (near){
    t += same ? 12 : 7; M1.m1 += 1;
    if (same){                                // $A000: C = E hits, C > E misses
      t += 15; M1.m1 += 3;
      if (C === E){ pts = 2; t += 5; }
      else if (C > E){ M1.m1 += 1; return t + 11; }
      else { t += 5; M1.m1 += 1; }
    } else {                                  // $9F65: C < E tested, C = E hits
      t += 8; M1.m1 += 3;
      if (C < E) t += 12;
      else { t += 7; M1.m1 += 1; if (C === E){ pts = 2; t += 12; } else { M1.m1 += 1; return t + 7 + 10; } }
    }
    if (!pts){
      t += 37; M1.m1 += 8;
      if (((tb(0xA93F) + C) & 0xFF) >= E){ pts = 2; t += 12; }
      else {
        t += 7 + 37; M1.m1 += 8;
        if (((tb(0xA958) + C) & 0xFF) >= E){ pts = 1; t += 12; }
        else { M1.m1 += 1; return t + 7 + 10; }
      }
    }
  } else {                                    // $9F83 / $9FE4: C = E hits, C < E misses
    t += same ? 7 : 12;
    t += 15; M1.m1 += 4;
    if (C === E){ pts = 2; t += 5; }
    else if (C < E){ M1.m1 += 1; return t + 11; }
    else {
      t += 5 + 37; M1.m1 += 9;
      if (((C - tb(0xA93F)) & 0xFF) < E){ pts = 2; t += 12; }
      else {
        t += 7 + 37; M1.m1 += 8;
        if (((C - tb(0xA958)) & 0xFF) < E){ pts = 1; t += 12; }
        else { M1.m1 += 1; return t + 7 + 10; }
      }
    }
  }
  m[A + 0x08] = pts;
  t += 30 + 69 + 30; M1.m1 += 3 + 8 + 4;          // with the JR Z
  m[0xAA3F] = D;
  m[0xB150] = m[(0xA073 + D) & 0xFFFF];
  if (m[A + 0x17] !== m[V + 0x17]){
    t += 7 + 33; M1.m1 += 7;
    if (tb(0xB47E)){ m[V + 0x03] = 0x1A; M1.m1 += 3; return t + 12 + 30; }
    t += 7 + 4 + 7; M1.m1 += 3;
    if (D === 0x18) t += 12;
    else {
      t += 7 + 7; M1.m1 += 2;
      if (D === 7) t += 12;
      else {
        t += 7 + 7; M1.m1 += 2;
        if (D !== 0x0C){ m[V + 0x03] = 0x16; M1.m1 += 3; return t + 12 + 30; }
        t += 7;
      }
    }
    m[V + 0x03] = 0x1B; m[0xB150] = 4; M1.m1 += 5;
    return t + 50;
  }
  t += 12 + 33; M1.m1 += 7;
  if (tb(0xB47E)){ m[V + 0x03] = 0x16; M1.m1 += 4; return t + 7 + 10 + 30; }
  m[V + 0x03] = 0x1A; M1.m1 += 3;
  return t + 12 + 30;
}

/* p2_hits_p1 $9ED2: the uncontended T from the CALL at $9748 to $974B
   (python tools/callio.py --capture --call 0x9748 0x974B) */
function p2HitsP1(m){
  M1.m1 += 1;                                      // the CALL
  return hitTest(m, 0xAA40, 0xAA00, 17);
}

/* p1_hits_p2 $9D29: first copies the x bytes $AA19, $AA59 to $A071,
   $A072, which $9ED2 then reads; the T from the CALL at $974B to $974E
   (python tools/callio.py --capture --call 0x974B 0x974E) */
function p1HitsP2(m){
  m[0xA071] = m[0xAA19]; m[0xA072] = m[0xAA59];
  M1.m1 += 1 + 4;                                  // the CALL and the copy
  return hitTest(m, 0xAA00, 0xAA40, 17 + 52);
}

/* ---- fighter_motion $95D4: step each fighter's motion script ----------
   Per fighter (A = $AA00 P1, $AA40 P2), skipped while A+$0C is 0.  A+$0B
   = 0 starts script A+$0C: its bounds come from the word pair at
   $9368+2*A+$0C, the pointer A+$14 starts at one end (the far end, 4
   back, when the facing A+$16 is set) and A+$0E/A+$0F count its 4-byte
   frames.  Each pass the hold A+$10 runs down (facing clear) or up to
   A+$11 (set); when it expires the pointer steps 4 bytes and frame
   [hold, 2 bytes, 18 x $FF] is loaded into A+$10..A+$2B -- the ROM bytes
   $95D4 copies there are all $FF (ledger/95D4.toml), so no ROM is read.
   Facing A+$17 = 1 swaps three pairs of those $FF bytes ($971E).  Every
   pass then adds frame byte 2 to A+$18 and moves x A+$19 by byte 3,
   clamped to 0..$5F.  Returns the uncontended T from the CALL at $978D to
   $9790 (python tools/callio.py --capture --call 0x978D 0x9790). */
function fighterMotion(m){
  M1.m1 += 6;                                      // the site's CALL, LD HL / CALL twice, RET
  return 17 + 10 + 17 + motion(0xAA00) + 10 + 17 + motion(0xAA40) + 10;

  function motion(A){
    const f = m[A + 0x16];
    m[0x9743] = f;
    /* M1 (for R): one per instruction, two for SBC HL and the CB shifts
       (python tools/blockcost.py 0x95D4 0x9743) */
    let t = 60; M1.m1 += 8;
    if (!m[A + 0x0C]) { M1.m1 += 1; return t + 11; }
    t += 5 + 33; M1.m1 += 6;
    if (!m[A + 0x0B]) return t + start();
    t += 53; M1.m1 += 7;
    if (!f){
      t += 7 + 4; M1.m1 += 2;
      if (m[A + 0x10]){ m[A + 0x10]--; M1.m1 += 3; return t + 7 + 11 + 10 + tail(); }
      t += 12 + 6 + 6 + 7 + 4; M1.m1 += 5;
      if (!m[A + 0x0E]) { M1.m1 += 1; return t + 12 + done(); }
      m[A + 0x0E]--;
      M1.m1 += 3; return t + 7 + 11 + 10 + step();
    }
    t += 12 + 6 + 7 + 6; M1.m1 += 4;
    if (m[A + 0x10] !== m[A + 0x11]){ m[A + 0x10]++; M1.m1 += 3; return t + 7 + 11 + 10 + tail(); }
    t += 12 + 6 + 7 + 4 + 6 + 7; M1.m1 += 6;
    if (((m[A + 0x0F] - 1) & 0xFF) === m[A + 0x0E]) { M1.m1 += 1; return t + 12 + done(); }
    m[A + 0x0E]++;
    M1.m1 += 2; return t + 7 + 11 + step();

    function done(){                               // $9613
      m[A + 0x0D] = 1; m[A + 0x0C] = 0;
      M1.m1 += 5; return 42;
    }
    function step(){                               // $962B: next 4-byte frame
      let t = 61; M1.m1 += 7;
      m[A + 0x13] = 0;
      if (m[0x9743]){
        const v = m[A + 0x14] - 4;
        m[A + 0x14] = v;
        t += 7 + 7 + 7 + 6; M1.m1 += 4;
        if (v < 0){ m[A + 0x15]--; t += 7 + 11 + 12; M1.m1 += 3; } else { t += 12; M1.m1 += 1; }
      } else {
        const v = m[A + 0x14] + 4;
        m[A + 0x14] = v;
        t += 12 + 7 + 7 + 6; M1.m1 += 4;
        if (v > 0xFF){ m[A + 0x15]++; t += 7 + 11; M1.m1 += 2; } else { t += 12; M1.m1 += 1; }
      }
      return t + load();
    }
    function load(){                               // $9649
      const p = m[A + 0x14] | m[A + 0x15] << 8;
      let t = 73; M1.m1 += 10;
      m[A + 0x10] = 1;
      const a = m[p];
      if (m[0x9743]) { t += 12; M1.m1 += 1; }
      else { m[A + 0x10] = a - 1; t += 26; M1.m1 += 5; }
      m[A + 0x11] = a;
      const b = m[(p + 1) & 0xFFFF];
      m[A + 0x12] = b; m[A + 0x13] = b;
      t += 108; M1.m1 += 15;
      for (let i = 0x1A; i <= 0x2B; i++) m[A + i] = 0xFF;   // ROM $39xx/$3Axx: all $FF
      m[0x9744] = 0;
      t += 8 * (88 + 38) + 88 + 12; M1.m1 += 8 * 16 + 13;
      t += 66; M1.m1 += 7;
      if (m[A + 0x17] === 1){                      // $971E: swap three pairs
        for (const b of [0x1A, 0x20, 0x26]) for (const k of [0, 1]){
          const x = m[A + b + k]; m[A + b + k] = m[A + b + k + 4]; m[A + b + k + 4] = x;
        }
        t += 17 + 39 + 3 * 138 + 12 + 12 + 7 + 10; M1.m1 += 1 + 5 + 3 * 21 + 1;
      } else { t += 10; M1.m1 += 1; }
      return t + tail();
    }
    function start(){                              // $96CE: begin script A+$0C
      const c = m[A + 0x0C];
      m[A + 0x0B] = c;
      m[A + 0x0D] = 0;
      const w = 0x9368 + 2 * c;
      const w0 = m[w] | m[w + 1] << 8, w1 = m[w + 2] | m[w + 3] << 8;
      let t = 213; M1.m1 += 28;
      let p = w0;
      if (m[0x9743]){ p = (w1 - 4) & 0xFFFF; t += 55; M1.m1 += 8; } else { t += 12; M1.m1 += 1; }
      m[A + 0x14] = p & 0xFF; m[A + 0x15] = p >> 8;
      const n = (((w1 - w0) & 0xFFFF) >> 2) & 0xFF;
      m[A + 0x0E] = 0;
      t += 111; M1.m1 += 19;
      if (m[0x9743]) { t += 12; M1.m1 += 1; }
      else { m[A + 0x0E] = n - 1; t += 22; M1.m1 += 4; }
      m[A + 0x0F] = n;
      M1.m1 += 5; return t + 33 + load();
    }
    function tail(){                               // $9698: y and x each pass
      const p = m[A + 0x14] | m[A + 0x15] << 8;
      const back = m[A + 0x16] ^ m[A + 0x17];
      m[0x9743] = back;
      m[A + 0x18] += m[(p + 2) & 0xFFFF];
      const d = m[(p + 3) & 0xFFFF];
      let t = 166; M1.m1 += 23;
      let x;
      if (back){ x = (m[A + 0x19] - d) & 0xFF; t += 23; M1.m1 += 3; }
      else { x = (m[A + 0x19] + d) & 0xFF; t += 16; M1.m1 += 2; }
      t += 4 + 12 + 7; M1.m1 += 3;                 // AND A clears carry: JR NC always
      if (x < 0x5F){ m[A + 0x19] = x; M1.m1 += 3; return t + 12 + 7 + 10; }
      t += 7 + 7; M1.m1 += 2;
      if (x >= 0xC8){ m[A + 0x19] = 0; M1.m1 += 3; return t + 12 + 10 + 10; }
      m[A + 0x19] = 0x5F;
      M1.m1 += 3; return t + 7 + 10 + 10;
    }
  }
}

/* ---- control_pass $97CB: who drives each fighter this pass ------------
   Num_Players $9C2C = 0 (demo): the 1/2/menu keys and Kempston fire are
   tested, and both fighters are driven by the AI $A090; 1 or 2: the quit
   keys 1+6 are tested, P1 is read from its controls ($8B1F through
   $98A0's move table) and P2 likewise in 2P, or by the AI in 1P.  The
   AI works on copies: the driven fighter's record at $A5F1, its AI state
   at $A60B (P1's $AA8B, P2's $AA77), the opponent's record at $A62B.
   Its draws are LD A,R ($A3FF, ledger/A3FF.toml): R is tracked as the M1
   count from io.r, the R at the CALL at $9757.  Ports come from io.in.
   T and M1 per block are measured (python tools/blockcost.py).  Returns
   the uncontended T from the CALL at $9757 to $975A, A at the return and
   R there.  Starting a game (1/Kempston fire, 2) runs New_Round $909E and
   returns $80; key 0 (code 0x23) runs the options menu $8C54 (configs,
   below) and returns $80. */
function newRound(m, cnt){                         // New_Round $909E without its CALL: the counts cleared, the yin-yang cells blanked
  m[0xAA01] = 0; m[0xAA41] = 0; m[0xAA02] = 0; m[0xAA42] = 0;
  let t = 4 + 4 * 13; cnt.m1 += 5;
  for (const pos of [0x0108, 0x0110, 0x1A08, 0x1A10]){ t += 20 + printString(m, pos, 0xB064, cnt); cnt.m1 += 2; }
  cnt.m1 += 1;
  return t + 10;
}
function controlPass(m, io){
  let t = 0, n = 0;
  const k = (T, R) => { t += T; n += R; };
  const R = () => (io.r & 0x80) | ((io.r + n) & 0x7F);
  const out = a => ({ t, a, r: R() });
  const at = (base, i) => m[(base & 0xFF00) | ((base + i) & 0xFF)];   // LD HL,base: ADD A,L: LD L,A

  k(17 + 27, 1 + 3);                               // CALL $97CB, $97CB-$97CF
  if (m[0x9C2C]) return quit();
  k(66, 7);                                        // $97D2-$97DE (LD A,R there is dead)
  m[0xAA46] = 1; m[0xAA06] = 1;
  let [cy, a] = keyTest(0x24);
  if (!cy){ k(12, 1); return start(1); }
  k(7, 1);
  a = io.in(a << 8 | 0x1F);
  k(29, 4);                                        // $97E3-$97E7
  if (!(a & 0x20)){
    k(17, 2);                                      // $97EA-$97EC
    if (a & 0x10) return start(1);
  }
  k(24, 2);                                        // $9801-$9803
  if (!keyTest(0x1C)[0]){ k(7, 1); return start(2); }
  k(12 + 24, 1 + 2);                               // $9806 taken, $981A-$981C
  if (!keyTest(0x23)[0]){
    k(7 + 17, 1 + 1);                              // $9821 CALL Game_Configs_Main
    for (const _ of configs());                    // eslint-disable-line no-unused-vars
    k(7 + 10, 2);
    return out(0x80);
  }
  k(12, 1);
  return play();

  function start(p){                               // $97EF Start_1UP / $9808 Start_2UP
    m[0x9C2C] = p; m[0xAA46] = p === 1 ? 1 : 0; m[0xAA06] = 0;
    k(67, 6);
    const c = { m1: 0 };
    k(newRound(m, c), c.m1);
    k(17, 2);
    return out(0x80);
  }

  /* $8C54 Game_Configs_Main and its screens, with its RET.  The machine
     polls the keys inside this one call for as long as the menu is up
     (DI, no HALT), so it is a generator: it yields before every port
     read and after every Configs_Delay, where a live loop can suspend it
     with t as the clock; the gate runs it to the end.  T and M1 per
     instruction from the listing (python tools/adis.py 0x8C54 120). */
  function* configs(){
    const tp = 0x8E69;                             // Temp_Player
    clearScreen();
    for (const [de, pos] of [[0x8E6B, 0x002D], [0x8E8C, 0x1436], [0x8E99, 0x143F],
                             [0x8EA6, 0x1448], [0x8EB3, 0x055C], [0x8EC6, 0x0765]]) print(de, pos);
    for (;;){
      k(7 + 17, 2); yield;
      if (!keyTest(0x24)[0]){ k(10 + 10 + 16 + 10, 4); return yield* controlsMenu(0x8BD2); }
      k(10 + 7 + 17, 3); yield;
      if (!keyTest(0x1C)[0]){ k(10 + 10 + 16 + 10, 4); return yield* controlsMenu(0x8BE6); }
      k(10 + 7 + 17, 3); yield;
      if (!keyTest(0x15)[0]){ k(10 + 10, 2); return; }
      k(10 + 7 + 17, 3); yield;
      if (!keyTest(0x14)[0]){ m[0xB2FA] = 1; k(10 + 7 + 13 + 10 + 10, 5); return; }
      k(10 + 7 + 17, 3); yield;
      if (!keyTest(0x0C)[0]){ m[0xB2FA] = 0; k(10 + 7 + 13 + 10 + 10, 5); return; }
      k(10 + 10, 2);                               // $8CD7 JP Game_Configs_P1
    }

    function* controlsMenu(p){                     // $8CDB Game_Configs_Controls
      m[tp] = p & 0xFF; m[tp + 1] = p >> 8;
      clearScreen();
      for (const [de, pos] of [[0x8ED6, 0x012D], [0x8EF4, 0x0136], [0x8F0F, 0x013F],
                               [0x8F2A, 0x0148], [0x8F41, 0x0151], [0x8F59, 0x0371]]) print(de, pos);
      delay(); yield; delay(); yield;
      const set = de => {                          // $8D75/$8D81/$8D8D: (Temp_Player) = de
        const hl = m[tp] | m[tp + 1] << 8;
        m[hl] = de & 0xFF; m[(hl + 1) & 0xFFFF] = de >> 8;
        k(10 + 10 + 16 + 10 + 7 + 6 + 7 + 10 + 10, 9);
      };
      for (;;){
        k(7 + 17, 2); yield;
        if (!keyTest(0x24)[0]){                    // $8D57 Set_Default
          const p1 = (m[tp] | m[tp + 1] << 8) === 0x8BD2;
          if (p1){ m[0x8BD2] = 0xFA; m[0x8BD3] = 0x8B; } else { m[0x8BE6] = 0x0C; m[0x8BE7] = 0x8C; }
          k(10 + 10 + 16 + 10 + 4 + 15 + 10 + 10 + 16 + 10 + 10, 12);
          return;
        }
        k(10 + 7 + 17, 3); yield;
        if (!keyTest(0x1C)[0]) return set(0x8C30);
        k(10 + 7 + 17, 3); yield;
        if (!keyTest(0x14)[0]) return set(0x8C1E);
        k(10 + 7 + 17, 3); yield;
        if (!keyTest(0x04)[0]) return set(0x8C42);
        k(10 + 7 + 17, 3); yield;
        if (!keyTest(0x0C)[0]) break;
        k(10, 1);                                  // $8D4B JP C,Game_Controls_Defaults
      }
      k(10, 1);
      delay(); yield; delay(); yield;
      k(10, 1);                                    // $8D54 JP Game_Configs_Keys
      clearScreen();
      for (const [de, pos] of [[0x8F6B, 0x012D], [0x8F89, 0x0136], [0x8FA7, 0x013F]]) print(de, pos);
      const hl = m[tp] | m[tp + 1] << 8;
      let de = (hl + 2) & 0xFFFF;
      m[hl] = de & 0xFF; m[(hl + 1) & 0xFFFF] = de >> 8;
      k(16 + 20 + 6 + 6 + 7 + 6 + 7, 8);
      for (const text of [0x8FBB, 0x8FBE, 0x8FC7, 0x8FCD, 0x8FD8, 0x8FDD, 0x8FE7, 0x8FEC, 0x8FF4]){
        k(10 + 17 + 11 + 4 + 10, 5);              // LD HL,text: CALL $8DFC: PUSH DE: EX DE,HL: LD HL
        ps(0x055C, text);
        k(10 + 11 + 17, 3);                        // POP DE: PUSH DE: CALL Get_Key
        const key = yield* getKey();
        m[de] = key & 0xFF; m[(de + 1) & 0xFFFF] = key >> 8;
        de = (de + 2) & 0xFFFF;
        k(10 + 4 + 7 + 6 + 7 + 6 + 4 + 11 + 10 + 10, 10);
        ps(0x055C, 0x9000);
        delay(); yield; delay(); yield;
        k(10 + 10, 2);                             // POP DE: RET
      }
      k(10 + 10, 2);                               // $8DF9 JP Game_Configs_Return: RET
    }

    function* getKey(){                            // $8E22 Get_Key, CALL counted by the caller
      for (;;){
        k(10 + 7, 2);
        let p = 0x8E3A;
        for (let b = 8; b; b--){
          k(7 + 11, 2); yield;
          const a = ~io.in(m[p] << 8 | 0xFE) & 0x1F;
          k(4 + 7 + 10, 3);
          if (a){ const key = m[p] << 8 | a; k(4 + 7 + 4 + 10, 4); return key; }
          k(6 + (b > 1 ? 13 : 8), 2);
          p++;
        }
        k(10, 1);                                  // $8E33 JP Get_Key
      }
    }

    function print(de, pos){ k(20, 2); ps(pos, de); }                    // LD DE: LD HL: CALL $92E4
    function ps(pos, de){ const c = { m1: 0 }; k(printString(m, pos, de, c), c.m1); }
    function delay(){ k(17 + 10 + 60000 * 24 + 10, 3 + 60000 * 4); }    // CALL $8E42 Configs_Delay
    function clearScreen(){                        // CALL $8E4C Clear_Screen
      m.fill(0, 0x4000, 0x5800); m.fill(13, 0x5800, 0x5B00);
      k(17 + 10 + 10 + 7 + 7 + 10 + 21 * 0x17FF - 5 + 10 + 10 + 7 + 7 + 10 + 21 * 0x2FF - 5 + 10,
        6 + 2 * 0x17FF + 5 + 2 * 0x2FF + 1);
    }
  }

  function quit(){                                 // $9827 Check_Quit_Game
    k(24, 2);
    if (keyTest(1)[0]){ k(12, 1); return play(); }
    k(7 + 24, 1 + 2);
    if (keyTest(6)[0]){ k(12, 1); return play(); }
    k(7 + 38, 1 + 5);                              // $9835-$983C: both held
    m[0x9C2C] = 0;
    return out(0x80);
  }

  function play(){                                 // $983D
    if (m[0xAA03]){ m[0xAA05] = m[0xAA03]; k(24 + 23, 3 + 2); }
    else if (m[0xAA06]){

   io.r is R at the CALL at $AE29; the M1 count of everything before the
   CALL at $9757 carries it into controlPass, which returns R there, and the
   callees after it add theirs.  The effect's $FE writes go to io.out as
   [T from the CALL at $AE29, value].  sp is SP at that CALL ($BF13 runs at
   sp - 4).  Returns the uncontended T to $AE2C, A there (bit 7 set: the
   RET M at $975B; else $44, left by $9B9D for P2) and R there.  Gated
   whole against python tools/callio.py --capture --call 0xAE29 0xAE2C
   (ledger/9745.toml).  io.cost, if given, receives $BF13's split and its T
   (.t), so a caller can charge it rfPlayT. */
function playPass(m, io, sp){
  M1.m1 = 1;                                       // CALL $9745
  let t = 17 + boutTimer(m) + p2HitsP1(m) + p1HitsP2(m);
  const a = m[0xB150];
  t += 13 + 13 + 17; M1.m1 += 3;                   // LD A,(nn) twice, CALL $B15A
  const fx = [], tb = t;
  t += soundEffect(m, a, fx);
  for (const [ft, v] of fx) io.out.push([tb + ft, v]);
  const r = (io.r & 0x80) | ((io.r + M1.m1) & 0x7F);
  const c = controlPass(m, { r, in: io.in });
  t += c.t + 4; M1.m1 = 1;                         // AND A
  if (c.a & 0x80){ M1.m1 += 1; return { t: t + 11, a: c.a, r: rAt() }; }   // RET M taken
  t += 5 + 7 + 13 + 7; M1.m1 += 4;                 // RET M, LD A,$40: LD ($9C29),A: LD C,0
  m[0x9C29] = 0x40;
  t += fighterStep(m, 0) + 7 + 4 + 13; M1.m1 += 3;  // LD C,$40: XOR A: LD ($9C29),A
  m[0x9C29] = 0;
  t += fighterStep(m, 0x40) + yinYang2P(m) + fighterMotion(m);
  const tr = renderFighters(m, null, (sp - 4) & 0xFFFF, io.cost);
  if (io.cost) io.cost.t = tr;                     // $BF13's own T, for rfPlayT
  t += 17 + tr; M1.m1 += 1;
  t += 7 + 7 + 13; M1.m1 += 3;                     // LD C,0: LD A,$40: LD ($9C29),A
  m[0x9C29] = 0x40;
  t += fighterPost(m, 0) + 7 + 4 + 13; M1.m1 += 3;  // LD C,$40: XOR A: LD ($9C29),A
  m[0x9C29] = 0;
  t += fighterPost(m, 0x40) + 10; M1.m1 += 1;      // RET
  return { t, a: 0x44, r: rAt() };
  function rAt(){ return (c.r & 0x80) | ((c.r + M1.m1) & 0x7F); }
}

/* ---- round_loop $AE26: the body from the CALL at $AE29 back to it ------
   playPass, then $AE2C-$AE65 from the listing (python tools/adis.py 0xAE26
   40): the quit, $C427 from the fighters' moves $AA04/$AA44 and the table
   at $A900, and the two ways out.  Per instruction T and one M1 each (no
   prefixes).  io as playPass.  Returns T from $AE29 to the next $AE29 (or
   to the way out), R there, and exit: null to loop, 'quit' (the RET M at
   $AE2D), 'end' (the round end at $AE67: endStart, the Fist's) or, after
   a point (the RET NZ at $AE60 on $9C28), pointPath's own: the point is
   played on into the next $AE29 in the same pass -- by demoPoint when the
   CALL was the demo's at $ABC8 (demo set), which takes the quit on through
   $ABCB to $ABB9 too; with two set (the 2UP game's $AE14) every way out
   is returned as roundTail's.  roundTail is
   the body from $AE2C alone, A and R there, gated exactly against python
   tools/callio.py --capture --call 0xAE2C 0xAE29 (build/callio_ae2c.json). */
function roundPass(m, io, sp, demo, two){
  const p = playPass(m, io, sp), b = roundTail(m, p.a, p.r);
  b.t += p.t;
  if (two || b.exit !== 'ret' && !(demo && b.exit === 'quit')) return b;
  const q = (demo ? demoPoint : pointPath)(m, b.a, b.r);   // a point (or the demo's quit): on to the next $AE29, or out
  q.t += b.t;
  return q;
}
function roundTail(m, a, r){
  let t = 4 + 5, n = 2;                            // AND A: RET M
  const out = (exit, a) => ({ t, r: (r & 0x80) | ((r + n) & 0x7F), exit, a });
  if (a & 0x80) return (t += 6, out('quit', a));   // RET M taken: 11, not 5
  const at = a => m[0xA900 | ((m[a] + 0x0D) & 0xFF)];  // LD HL,$A90D: ADD A,L: LD L,A: LD A,(HL)
  let one;
  t += 13 + 7; n += 2;                             // LD A,($AA44): CP $11
  if (m[0xAA44] === 0x11){ t += 12; n += 1; one = 0; }
  else {
    t += 7 + 13 + 7; n += 3;                       // JR Z: LD A,($AA04): CP $11
    if (m[0xAA04] === 0x11){ t += 12; n += 1; one = 1; }
    else {
      t += 7 + 10 + 4 + 4 + 7 + 4; n += 6;         // JR Z: LD HL..AND A
      if (at(0xAA04)){ t += 12; n += 1; one = 0; }
      else {
        t += 7 + 13 + 10 + 4 + 4 + 7 + 4; n += 7;  // JR NZ: LD A,($AA44)..AND A
        if (at(0xAA44)){ t += 12; n += 1; one = 1; }
        else { t += 7; n += 1; one = 0; }
      }
    }
  }
  if (one){ t += 7 + 13; n += 2; m[0xC427] = 1; }      // LD A,1: LD ($C427),A
  else { t += 4 + 13 + 12; n += 3; m[0xC427] = 0; }    // XOR A: LD ($C427),A: JR
  t += 13 + 4; n += 2;                             // LD A,($9C28): AND A
  if (m[0x9C28]) return (t += 11, n += 1, out('ret', m[0x9C28]));
  t += 5 + 13 + 4; n += 3;                         // RET NZ: LD A,($9C2B): AND A
  if (!m[0x9C2B]) return (t += 12, n += 1, out(null, 0));
  return (t += 7, n += 1, out('end', m[0x9C2B]));
}

/* ---- the point path: $AD1B-$AD42, back into round_loop by $AD18 ----------
   From the RET NZ at $AE60 (a point: A = $9C28) to the next $AE29, from the
   listing (python tools/adis.py 0xAD18 50).  $AF01: when the fighters' reel
   bits ($AA03, $AA43 AND $10) differ, Yin_Yang_1UP $900E draws the points
   and $AF36 scores them; a count $AA01/$AA41 at 4 wins the bout.  Then the
   points $AA08/$AA48 are cleared and, unless time is up ($9C2B), $AD18
   calls $AE26 again: $9CA8 resets the fighters (and the AI's copies through
   $A402), falling into $9D29 at its end.  Returns T from $AD1B to $AE29 or
   to the way out, R there, and exit: null (back at $AE29), 'quit' (the RET
   M at $AD1C), 'p1' ($AD5F), 'p2' ($AD94) or 'time' ($AD44), none of which
   is ported yet.  Gated against python tools/callio.py --capture --call
   0xAD1B 0xAE29,0xAD5F,0xAD94,0xAD44 (build/callio_ad1b.json). */
function scoreAdd(m, de, b){                       // $AFC2 with its CALL: BCD add b (10 as $10) to the 3 bytes at de, low first
  let t = 17 + 4 + 7; M1.m1 += 1 + 3;              // CALL: LD A,B: CP 10: JR NZ
  if (b === 10){ b = 0x10; t += 7 + 7; M1.m1 += 1; } else t += 12;
  let c = 0;
  for (let i = 0; i < 3; i++){                     // ADD A,B then ADC A,0 twice, each with DAA
    const x = m[de + i], y = i ? 0 : b, s = x + y + c;
    const h = (x & 15) + (y & 15) + c > 15, a = s & 0xFF;
    let fix = h || (a & 15) > 9 ? 6 : 0;
    c = s > 0xFF ? 1 : 0;
    if (c || a > 0x99){ fix |= 0x60; c = 1; }
    m[de + i] = (a + fix) & 0xFF;
  }
  M1.m1 += 5 + 5 + 4 + 1;
  return t + 28 + 31 + 25 + 10;
}
function populate(m, hl, b){                      // Populate_Score_Buffer $AFDA with its CALL: b bytes down from hl, two digits each, to $B024
  let de = 0xB024, t = 17 + 10; M1.m1 += 2;
  for (; b > 0; b--){                              // high digit first, each by Convert_ASCII $B004 with its CALL
    const v = m[hl];
    m[de++] = 0x30 + (v >> 4); m[de++] = 0x30 + (v & 15);
    hl--; t += 7 + 16 + 54 + 7 + 54 + 6 + (b > 1 ? 13 : 8); M1.m1 += 20;
  }
  M1.m1 += 1;
  return t + 10;
}
function zeroToSpace(m, de){                       // Zero_To_Space $AFF3 without a CALL: 0 at de, leading '0's of 7 at $B024 to spaces
  m[de] = 0;
  let t = 4 + 7 + 10 + 7; M1.m1 += 4;
  for (let p = 0xB024, b = 7; ; ){
    t += 7 + 7; M1.m1 += 3;
    if (m[p] !== 0x30) return t + 11;
    m[p++] = 0x20; t += 5 + 10 + 6; M1.m1 += 3;
    if (--b) t += 13; else { M1.m1 += 1; return t + 8 + 10; }
  }
}
function scoreBuffer(m, hl){                       // Populate_Score_Buffer $AFDA (B = 3) and Write_00 $AFED, each with its CALL
  let t = populate(m, hl, 3);
  m[0xB02A] = 0x30; m[0xB02B] = 0x30;
  t += 17 + 7 + 7 + 6 + 7 + 6; M1.m1 += 6;         // CALL: LD A,'0': LD (DE),A: INC DE twice, falling into $AFF3
  return t + zeroToSpace(m, 0xB02C);
}
const SIDE1 = { pts: 0xAA08, cnt: 0xAA02, sc: 0xB02D, show: m => m[0x9C2C] !== 0, hl: 0xB02F, pos: 0x0100 };
const SIDE2 = { pts: 0xAA48, cnt: 0xAA42, sc: 0xB030, show: m => m[0x9C2C] === 2, hl: 0xB032, pos: 0x1600 };
function award(m){                                 // $AF36 with its CALL: score the points of one side
  let t = 17 + 13 + 7 + 10; M1.m1 += 4;            // LD A,($AA08): CP 0: JP Z
  let s = SIDE1;
  if (!m[s.pts]){
    t += 13 + 7; M1.m1 += 3;                       // $AF7D: LD A,($AA48): CP 0: RET Z
    if (!m[0xAA48]) return t + 11;
    t += 5; s = SIDE2;
  }
  let b = m[(0xB00B + m[0xAA3F]) & 0xFFFF];        // the table at $B00B by $AA3F (ADD HL,BC)
  t += 72; M1.m1 += 8;
  if (m[s.pts] === 1){ b >>= 1; t += 7 + 8; M1.m1 += 3; } else { t += 12; M1.m1 += 1; }   // SRL B
  return t + awardTail(m, b, s);
}
function awardTail(m, b, s){                       // $AF52 / $AF97 on: b to the count and the score, shown, to the RET
  const { pts, cnt, sc, hl, pos } = s, show = s.show(m);
  let t = 0;
  m[cnt] = (b + m[cnt]) & 0xFF;
  t += 38 + scoreAdd(m, sc, b) + 37; M1.m1 += 5 + 4 + 1;   // ... LD DE: CALL $AFC2: XOR A..CP: RET cc
  m[pts] = 0;
  if (!show) return t + 11;
  t += 5 + 17 + scoreBuffer(m, hl) + 20; M1.m1 += 4 + 1;   // LD HL: LD B: LD DE: LD HL, and the RET
  return t + printString(m, pos, 0xB024, M1) + 10;
}
function a402(m){                                  // $A402 with its CALL: the AI's state in the copies, from tables by $A614
  const b = m[0xA614], at = base => m[(base & 0xFF00) | ((base + b) & 0xFF)];
  m[0xA60F] = at(0xB3D6); m[0xA616] = 2;
  m[0xA612] = at(0xB3EC); m[0xA615] = at(0xB426);
  m[0xA61C] = 0x80; m[0xA5F1] = 1;
  m[0xA617] = at(0xB401);
  m[0xA611] = 0x80; m[0xA60E] = 0; m[0xA618] = 0;
  m[0xA646] = at(0xB432); m[0xA619] = at(0xB40D); m[0xA61A] = at(0xB41A);
  m[0xA610] = 1; m[0xA61B] = 0x80;
  m[0xA60B] = at(0xB43E);
  M1.m1 += 1 + 65;
  return 17 + 512;
}
function copyLdir(m, s, d, len){                   // LD HL: LD DE: LD BC: LDIR
  for (let i = 0; i < len; i++) m[d + i] = m[s + i];
  M1.m1 += 3 + 2 * len;
  return 30 + 21 * len - 5;
}
function pointPath(m, a, r){
  M1.m1 = 0;
  let t = 4 + 5; M1.m1 += 2;                       // AND A: RET M
  const out = exit => ({ t, r: (r & 0x80) | ((r + M1.m1) & 0x7F), exit });
  if (a & 0x80) return (t += 6, out('quit'));
  t += 17 + 47 + 7; M1.m1 += 1 + 5 + 1;            // CALL $AF01 and its body, JR Z
  if ((m[0xAA03] ^ m[0xAA43]) & 0x10){
    t += yinYang(m) + award(m);
    t += 13 + 7 + 7; M1.m1 += 3;                   // LD A,($AA01): CP 4: JR NC
    if (m[0xAA01] >= 4) return (t += 5, out('p1'));
    t += 13 + 7 + 10; M1.m1 += 3;                  // LD A,($AA41): CP 4: JP NC
    if (m[0xAA41] >= 4) return out('p2');
  } else t += 5;                                   // the JR Z taken
  m[0xAA08] = 0; m[0xAA48] = 0;
  t += 4 + 13 + 13 + 13 + 4 + 7; M1.m1 += 6;       // XOR A .. AND A: JR Z
  if (m[0x9C2B]) return out('time');
  t += 5 + roundIn(m, r);                          // JR Z taken, to $AD18
  return out(null);
}
/* ---- the demo's point path: $ABCB-$AC04, back into round_loop by $ABC8 --
   pointPath's twin for the CALL at $ABC8 (python tools/adis.py 0xABC8 30):
   the same $AF01, Yin_Yang_1UP and $AF36, but one count is looked at, by
   $AA03 -- set, P2's $AA41 (at 4: 'p2', the CALL $AE9D at $ABE5); clear,
   P1's $AA01 (at 4: 'p1', the CALL $AE7A at $AC00).  P1 at 4 with $AA03
   set plays on: faithful.  Time up ($9C2B): XOR A and the RET to $ABB9,
   'time'; the RET M: 'quit', to $ABB9 too.  Else $ABC8 calls $AE26 again,
   roundIn's.  Gated against python tools/callio.py --capture --call 0xABCB
   0xAE29,0xABB9,0xAC00,0xABE5 (build/callio_abcb.json). */
function demoPoint(m, a, r){
  M1.m1 = 0;
  let t = 4 + 5; M1.m1 += 2;                       // AND A: RET M
  const out = exit => ({ t, r: (r & 0x80) | ((r + M1.m1) & 0x7F), exit });
  if (a & 0x80) return (t += 6, out('quit'));
  t += 17 + 47 + 7; M1.m1 += 1 + 5 + 1;            // CALL $AF01 and its body, JR Z
  if ((m[0xAA03] ^ m[0xAA43]) & 0x10){
    t += yinYang(m) + award(m);
    t += 13 + 4 + 7; M1.m1 += 3;                   // LD A,($AA03): AND A: JR Z
    if (m[0xAA03]){
      t += 13 + 7 + 7; M1.m1 += 3;                 // LD A,($AA41): CP 4: JR C
      if (m[0xAA41] >= 4) return out('p2');
      t += 5;                                      // the JR C taken, to $ABF1
    } else {
      t += 5 + 13 + 7 + 7; M1.m1 += 3;             // the JR Z taken: LD A,($AA01): CP 4: JR NC
      if (m[0xAA01] >= 4) return (t += 5, out('p1'));
    }
  } else t += 5;                                   // the JR Z taken
  m[0xAA08] = 0; m[0xAA48] = 0;
  t += 4 + 13 + 13 + 13 + 4 + 7; M1.m1 += 6;       // XOR A .. AND A: JR Z
  if (m[0x9C2B]) return (t += 4 + 10, M1.m1 += 2, out('time'));   // XOR A: RET
  t += 5 + roundIn(m, r);                          // JR Z taken, to $ABC8
  return out(null);
}

/* ---- the demo's ways on: $ABB9-$ABC7, from the listing -----------------
   (python tools/adis.py 0xAB97 25.)  Where demoPoint's RETs land, A = 0
   after a pose ($AC00 / $ABE5, XOR A) or time up, negative for the quit.
   AND A: RET M -- the quit, out to Demo_Mode's caller $AC27.  Else the
   stage steps 1-3 ($AF27, as boutNext's), Current_Rank $B05F counts the
   demo's stages, and below 4 the JR to $AB97 (demoStage) plays the next
   one from its first $AE29; at 4 the RET, to $AC27.  r is R where M1.m1
   was zero.  Returns T and at: 0xAE29 or 0xAC27.  Gated against python
   tools/callio.py --capture --call 0xABB9 0xAE29,0xAC27 (build/
   callio_abb9.json).  cost.scen as demoIn's. */
function demoOn(m, a, r, cost){
  let t = 4; M1.m1 += 2;                           // AND A: RET M
  if (a & 0x80) return { t: t + 11, at: 0xAC27 };
  t += 5 + 17 + 10 + 11 + 7 + 7; M1.m1 += 6;       // CALL $AF27: LD HL: INC (HL): LD A,(HL): CP 4: RET NZ
  if (++m[0xAF34] === 4){ m[0xAF34] = 1; t += 5 + 7 + 7 + 10; M1.m1 += 3; }   // LD A,1: LD (HL),A: RET
  else t += 11;
  t += 10 + 11 + 7 + 7; M1.m1 += 5;                // LD HL,Current_Rank: INC (HL): LD A,(HL): CP 4: JR NZ
  m[0xB05F] = (m[0xB05F] + 1) & 0xFF;
  if (m[0xB05F] === 4) return (M1.m1 += 1, { t: t + 7 + 10, at: 0xAC27 });   // RET
  return { t: t + 12 + demoStage(m, r, cost), at: 0xAE29 };
}

/* $AD18 to $AE29: CALL $AE26, CALL $9CA8 (the fighters reset), falling
   into $9D29, whose RET is to $AE29.  r is R where M1.m1 was zero: the T */
function roundIn(m, r){
  let t = 17 + 17 + 9; M1.m1 += 1 + 1 + 2;         // CALL $AE26: CALL $9CA8: LD A,R
  m[0xA645] = (r & 0x80) | ((r + M1.m1) & 0x7F);
  for (const z of [0x9C2B, 0x9CA7, 0xAA4D, 0xAA0D, 0xAA03, 0xAA43, 0xAA16, 0xAA56, 0xAA17,
                   0xAA0B, 0xAA4B, 0xAA09, 0xAA49, 0x9C28]) m[z] = 0;
  m[0xAA19] = 0x20; m[0xAA59] = 0x3C; m[0xAA18] = m[0xAA58] = 0x7A;
  for (const z of [0xAA0C, 0xAA4C, 0xAA05, 0xAA45, 0xAA04, 0xAA44]) m[z] = 0x17;
  m[0xAA0A] = m[0xAA4A] = 1; m[0xAA57] = 1;
  t += 13 + 4 + 14 * 13 + 4 * 7 + 4 * 13 + 6 * 13 + 7 + 2 * 13 + 7 + 13; M1.m1 += 35;   // to LD ($AA57),A
  const swap = (me, them) => 17 + copyLdir(m, me, 0xA5F1, 0x1A) + copyLdir(m, them, 0xA62B, 0x1A) + 10;
  const back = (me, them) => 17 + copyLdir(m, 0xA5F1, me, 0x1A) + copyLdir(m, 0xA62B, them, 0x1A) + 10;
  const aux = s => 17 + copyLdir(m, s, 0xA60B, 0x12) + 10, unaux = d => 17 + copyLdir(m, 0xA60B, d, 0x12) + 10;
  t += swap(0xAA00, 0xAA40) + aux(0xAA8B) + a402(m) + back(0xAA00, 0xAA40) + unaux(0xAA8B);   // $AADC $AB0A $A402 $AAF3 $AB16
  t += swap(0xAA40, 0xAA00) + aux(0xAA77) + a402(m) + back(0xAA40, 0xAA00) + unaux(0xAA77);   // $AB22 $AB50 $A402 $AB39 $AB5C
  M1.m1 += 8 * 2;                                  // the eight CALLs and RETs of the copies
  t += p1HitsP2(m) - 17; M1.m1 -= 1;               // $9D29 fallen into, not called
  return t;
}

/* ---- the victory pose: $AE7A (P1) / $AE9D (P2), from the listing -------
   (python tools/adis.py 0xAE78 40.)  The winner A ($AA00 / $AA40) is set
   to script $19 (A+$0C) at height $7A (A+$18), A+$0B and the facing A+$16
   cleared, $C427 to 0 / 1 (P2's INC A); then the loop at $AE8E / $AEB2
   steps the motion ($95D4) and draws ($BF13) until the script's done flag
   A+$0D is set.  P2's is reached from pointPath's 'p2' by $AD94, which
   returns A = 0 to $ACA6 ($AD97): the 1UP bout lost.  winStart: the CALL
   and the body to the loop top.  winPass: the loop top back to it, or out
   by its RET (out); sp is SP in the loop (at the CALL at $AE29 in play),
   so $BF13 runs at sp - 2; cost as playPass's io.cost, with .t $BF13's T.
   winEnd: $AD97-$AD98 for P2, to $ACA6.  M1 adds to M1.m1 for R.  Gated
   whole against python tools/callio.py --capture --call 0xAD94 0xACA6
   (build/callio_ad94.json) and live, iteration by iteration. */
function winStart(m, A){
  const p2 = A === 0xAA40;
  m[A + 0x0C] = 0x19; m[A + 0x18] = 0x7A; m[A + 0x0B] = 0; m[A + 0x16] = 0; m[0xC427] = p2 ? 1 : 0;
  M1.m1 += p2 ? 10 : 9;                            // CALL, then LD A,n: LD (nn),A x2, XOR A, LD (nn),A x3 (and INC A)
  return 17 + (p2 ? 87 : 83);
}
function winPass(m, A, sp, cost){
  let t = fighterMotion(m);                        // CALL $95D4, counted there
  const tr = renderFighters(m, null, (sp - 2) & 0xFFFF, cost);
  if (cost) cost.t = tr;
  t += 17 + tr + 13 + 4; M1.m1 += 3;               // CALL $BF13: LD A,(A+$0D): AND A
  if (!m[A + 0x0D]) return (M1.m1 += 1, { t: t + 12, out: false });   // JR Z taken
  M1.m1 += 2;
  return { t: t + 7 + 10, out: true };             // JR Z, RET
}
function winEnd(){ M1.m1 += 2; return 4 + 10; }   // $AD97 XOR A: RET, to $ACA6 with A = 0

/* ---- P1 wins: the time bonus $AD62-$AD90, from the listing --------------
   (python tools/adis.py 0xAD18 60.)  After P1's pose ($AD5F CALL $AE7A),
   each second left on the clock scores one: a delay $AF1D (BC = $F000),
   then per second B = 1 into award's tail at $AF52 (P1's count $AA02 and
   score $B02D, printed), Time_Tick, Print_Time and the delay again, until
   Time is 0; then Print_Time and the long delay $AF1A (BC = 0).  Init_Time
   always, and A = 1 to $ACA6: the bout won.  bonusStart: $AD62 to the loop
   top $AD6E, or out ($ACA6) when the clock is already 0.  bonusPass: the
   loop top back to it, or out.  Gated whole against python tools/callio.py
   --capture --poke 0xAA01=4 --call 0xAD5F 0xACA6 (build/callio_ad5f.json,
   Time 0 derived) and live, second by second (build/live_p1w.json). */
function delayLoop(b, c){                          // $AF1D: LD A,(IX): INC C: JR NZ: INC B: JR NZ: RET; BC on entry
  const w = b ? 256 - b : 256, n = (c ? 256 - c : 256) + (w - 1) * 256;   // B steps, then iterations
  M1.m1 += 4 * n + 2 * w + 1;
  return n * 23 + (n - w) * 12 + w * 11 + (w - 1) * 12 + 7 + 10;
}
function printTime(m){                             // CALL Print_Time $9C93: Time in five digits at $0B00
  M1.m1 += 1 + 4 + 1;
  return 17 + 13 + 7 + 4 + 10 + printNumber(m, m[0x9CA5], 0x0B00) + 10;
}
function bonusOut(m){                              // $AD8B: CALL Init_Time: LD A,1: RET, to $ACA6 with A = 1
  m[0x9CA5] = 0x1E; M1.m1 += 1 + 2 + 1 + 2;
  return 17 + 7 + 13 + printTime(m) + 10 + 7 + 10;
}
function bonusStart(m){
  M1.m1 += 3;                                      // LD A,(Time): AND A: JR Z
  if (!m[0x9CA5]) return { t: 13 + 4 + 12 + bonusOut(m), out: true };
  M1.m1 += 2;                                      // LD BC: CALL $AF1D
  return { t: 13 + 4 + 7 + 10 + 17 + delayLoop(0xF0, 0), out: false };
}
function bonusPass(m){
  M1.m1 += 2;                                      // LD B,1: CALL $AF52
  let t = 7 + 17 + awardTail(m, 1, SIDE1);
  m[0x9CA5]--; M1.m1 += 1 + 3;                     // CALL Time_Tick: LD HL: DEC (HL): RET
  t += 17 + 10 + 11 + 10 + printTime(m);
  M1.m1 += 2 + 3;                                  // LD BC: CALL $AF1D; LD A,(Time): AND A: JR NZ
  t += 10 + 17 + delayLoop(0xF0, 0) + 13 + 4;
  if (m[0x9CA5]) return { t: t + 12, out: false };
  M1.m1 += 1 + 1;                                  // CALL $AF1A: LD BC,0 (CALL Print_Time counted there)
  t += 7 + printTime(m) + 17 + 10 + delayLoop(0, 0);
  return { t: t + bonusOut(m), out: true };
}

/* ---- time up: the round end $AE67-$AE78 and the decision $AD44-$AD9B ---
   (python tools/adis.py 0xAE5C 12 ; python tools/adis.py 0xACE8 20 ;
   python tools/adis.py 0xAD18 50.)  With $9C2B set and no point, round_loop
   leaves at $AE67: both fighters to script $1C, CALL $ACF0 (A+$0B, A+$0D,
   the facings cleared, both heights $7A), whose loop at $AD0B is winPass's
   shape on P1's done flag $AA0D; then two long delays $AF1A and the RET to
   $AD1B with A = (IX), IX the word at $C428 that $BF13 last loaded at
   $BF82.  endStart: $AE67 to the loop top; the loop: winPass(m, $AA00, sp
   - 2), one CALL deeper than the pose; endTail: $AE72 to the RET, and A.
   pointPath then leaves by 'time' to $AD44, where timeUp compares the
   counts $AA01/$AA41, then the tallies $AA02/$AA42: 'p1' (on at $AD5F, by
   $AD5C's CALL to a RET when the tallies decide), 'p2' (at $AD94, by
   $AD91's) or 'draw' ($AD99: A = $81 to $ACA6).  The draw: $ACA6 to
   $ACCF, CALL $ACE8, both fighters to script $19 in the same loop, its RET
   and JP $AC5F, the next bout (drawStart, then winPass as the round end's,
   then 10 T; timeUp to the draw, drawStart and the loop gated against
   --call 0xAD44 0xACD6, build/callio_ad44d.json).  Gated whole against
   python tools/callio.py --capture --call 0xAE67 0xAD1B and --call 0xAD44
   0xACA6, the start constructed (Time poked to 1, the counts poked;
   build/callio_ae67.json, build/callio_ad44.json), and live. */
function poseBoth(m, s){                          // LD A,s: LD ($AA0C),A: LD ($AA4C),A, then $ACF0 to the loop top $AD0B
  m[0xAA0C] = m[0xAA4C] = s;
  for (const z of [0xAA0D, 0xAA0B, 0xAA4B, 0xAA16, 0xAA56]) m[z] = 0;
  m[0xAA18] = m[0xAA58] = 0x7A;
  M1.m1 += 3 + 10;                                 // XOR A, LD (nn),A x6, LD A,n, LD (nn),A x2
  return 7 + 13 + 13 + 4 + 6 * 13 + 7 + 2 * 13;
}
function endStart(m){ M1.m1 += 1; return poseBoth(m, 0x1C) + 17; }   // $AE67, its CALL $ACF0
function drawPose(m){ M1.m1 += 1; return poseBoth(m, 0x19) + 17; }   // CALL $ACE8: both to script $19
function drawStart(m){                             // $ACA6 AND A: JP M; $ACCF CP $81: JR NZ, then drawPose
  M1.m1 += 4;
  return 4 + 10 + 7 + 7 + drawPose(m);
}
function endTail(m){
  M1.m1 += 2 * 2 + 1;                              // CALL $AF1A: LD BC,0, twice; RET
  const t = 17 + 10 + delayLoop(0, 0) + 17 + 10 + delayLoop(0, 0) + 10;   // each delay counts its own M1
  return { t, a: m[m[0xC428] | m[0xC429] << 8] };  // LD A,(IX) last in $AF1D
}
function timeUp(m){
  let t = 13 + 10 + 7; M1.m1 += 3;                 // LD A,($AA01): LD HL,$AA41: CP (HL)
  const call = exit => (M1.m1 += 2, { t: t + 17 + 10, exit });   // CALL $AE78 / $AE9B, to a RET
  M1.m1 += 1;
  if (m[0xAA01] < m[0xAA41]) return { t: t + 12, exit: 'p2' };   // JR C
  t += 7; M1.m1 += 1;
  if (m[0xAA01] > m[0xAA41]) return (M1.m1 += 1, { t: t + 7 + 12, exit: 'p1' });   // JR Z: JR $AD5F
  t += 12 + 13 + 10 + 7; M1.m1 += 4;               // JR Z taken: LD A,($AA02): LD HL,$AA42: CP (HL): JR C
  if (m[0xAA02] < m[0xAA42]) return (t += 12, call('p2'));
  t += 7; M1.m1 += 1;
  if (m[0xAA02] === m[0xAA42]) return (M1.m1 += 2, { t: t + 12 + 7 + 10, exit: 'draw' });   // JR Z: LD A,$81: RET
  return (t += 7, call('p1'));
}

/* ---- the 1UP game after a bout: $ACA6-$ACE5 and $AF27, from the listing -
   (python tools/adis.py 0xAC40 80 ; python tools/adis.py 0xAF27 6.)  With
   A = 0 (lost) $ACD9 returns A = 0 to Main_Game_Loop's $AC39; with A = 1
   (won) the bouts left at this rank $AA3C count down, and at 0 go back to
   2 while the stage $AF34 steps 1-3 ($AF27), the new-stage flag $AF35 is
   set, and the rank rises: Current_Rank $B05F by one in BCD and Also_Rank
   $AA80 by one, or at rank $10 Also_Rank = 7 + (R & 3) by Random_Number;
   then JP $AC5F, the next bout.  The draw ($81) is drawStart's.  r is R
   less the M1 already in M1.m1.  Returns T and the PC reached.  Gated
   against python tools/callio.py --capture --call 0xACA6 0xAC5F,0xAC39
   (build/callio_aca6.json, the starts constructed by pokes). */
function boutNext(m, a, r){
  M1.m1 += 3;                                      // AND A: JP M: JR Z
  if (!a) return (M1.m1 += 2, { t: 4 + 10 + 12 + 4 + 10, at: 0xAC39 });   // XOR A: RET
  let t = 4 + 10 + 7 + 10 + 11; M1.m1 += 3;        // LD HL,$AA3C: DEC (HL): JR NZ
  if (--m[0xAA3C] & 0xFF) return { t: t + 12, at: 0xAC5F };
  m[0xAA3C] = 2; t += 7 + 10 + 17; M1.m1 += 2;     // LD (HL),2: CALL $AF27
  t += 10 + 11 + 7 + 7; M1.m1 += 4;                // LD HL,$AF34: INC (HL): LD A,(HL): CP 4
  if (++m[0xAF34] !== 4) t += 11, M1.m1 += 1;      // RET NZ
  else { m[0xAF34] = 1; t += 5 + 7 + 7 + 10; M1.m1 += 4; }
  m[0xAF35] = 1; t += 7 + 13 + 10 + 7 + 7; M1.m1 += 6;   // LD A,1: LD ($AF35),A: LD HL: LD A,(HL): CP $10: JR Z
  const v = m[0xB05F];
  if (v === 0x10){
    t += 12 + 17; M1.m1 += 1 + 2;                  // CALL Random_Number: LD A,R
    const x = (r & 0x80) | ((r + M1.m1) & 0x7F);
    m[0xAA80] = (x & 3) + 7; M1.m1 += 5;           // RET: AND 3: ADD A,7: LD (nn),A: JP
    return { t: t + 9 + 10 + 7 + 7 + 13 + 10, at: 0xAC5F };
  }
  let s = v + 1;                                   // ADD A,1: DAA
  if ((s & 0x0F) > 9 || (v & 0x0F) === 0x0F) s += 6;
  if (s > 0x99) s += 0x60;
  m[0xB05F] = s & 0xFF; m[0xAA80] = (m[0xAA80] + 1) & 0xFF; M1.m1 += 6;
  return { t: t + 7 + 7 + 4 + 7 + 10 + 11 + 10, at: 0xAC5F };
}

/* ---- the lost bout's way on: Check_HighScore $A647, from the listing ----
   (python tools/adis.py 0xA647 60.)  Scores are 3 BCD bytes, highest at
   the address named: Score_P1 $B02F, Score_P2 $B032, Hi_Score $B035, and
   $B038 the one the 2UP path compares with.  Is_HighScore $A697 walks the
   3 bytes high to low, counts the equal ones in $A6B7, and is carry (not
   a high score) at the FIRST byte below the table's, a higher byte before
   it notwithstanding: 100000 against 001000 is not a high score.  Equal
   is.  2UP ($9C2C = 2): $A6B6 = 2, P1 against P2; P2 higher is LDDRed
   over P1, else $A6B6 = 0 on a tie, 1 otherwise; then P1 against $B038.
   A high score is LDDRed over the table and Print_HighScore $A685 draws
   it at $0A19.  Returns T with the CALL at $AC39 and the RET; gated
   against python tools/callio.py --capture --call 0xAC39 0xAC3C
   (build/callio_ac39.json, 2 played, 10 derived). */
function isHigh(m, de, hl){                        // CALL Is_HighScore $A697: { t, c }
  let t = 17 + 7 + 13 + 11 + 11 + 7, n = 0; M1.m1 += 6;   // CALL: LD A,0: LD ($A6B7),A: PUSH DE: PUSH HL: LD B,3
  for (let b = 3; b > 0; b--){
    const x = m[de], y = m[hl];
    t += 7 + 7; M1.m1 += 3;                        // LD A,(DE): CP (HL): JR C
    if (x < y){ m[0xA6B7] = n; M1.m1 += 3; return { t: t + 12 + 10 + 10 + 10, c: true }; }   // POP HL: POP DE: RET
    t += 7 + (x === y ? 7 + 13 + 4 + 13 : 12); M1.m1 += x === y ? 4 : 1;   // JR NZ, or LD A,(nn): INC A: LD (nn),A
    if (x === y) n++;
    de = (de - 1) & 0xFFFF; hl = (hl - 1) & 0xFFFF;
    t += 6 + 6 + (b > 1 ? 13 : 8); M1.m1 += 3;     // DEC DE: DEC HL: DJNZ
  }
  m[0xA6B7] = n; M1.m1 += 5;                       // SCF: CCF: POP HL: POP DE: RET
  return { t: t + 4 + 4 + 10 + 10 + 10, c: false };
}
function lddr3(m, hl, de){                         // LDDR with BC = 3: (HL) to (DE), down
  for (let i = 0; i < 3; i++) m[(de - i) & 0xFFFF] = m[(hl - i) & 0xFFFF];
  M1.m1 += 6; return 21 + 21 + 16;
}
function checkHighScore(m){
  let t = 17 + 10 + 10 + 13 + 7, hl = 0xB035, de = 0xB02F; M1.m1 += 6;   // CALL: LD HL: LD DE: LD A,(Num_Players): CP 2: JR NZ
  if (m[0x9C2C] !== 2) t += 12;
  else {
    m[0xA6B6] = 2; t += 7 + 13 + 10; M1.m1 += 2;   // LD ($A6B6),A: LD HL,Score_P2
    const h = isHigh(m, de, 0xB032);
    t += h.t; M1.m1 += 1;                          // JR NC
    if (h.c){ t += 7 + 10 + lddr3(m, 0xB032, de) + 10 + 12; M1.m1 += 3; }   // LD BC: LDDR: LD DE: JR
    else {
      t += 12 + 13 + 7 + 7; M1.m1 += 4;            // LD A,($A6B7): CP 3: LD A,1: JR NZ
      if (m[0xA6B7] === 3){ m[0xA6B6] = 0; t += 7 + 4; M1.m1 += 1; } else { m[0xA6B6] = 1; t += 12; }   // XOR A
      t += 13; M1.m1 += 1;                         // LD ($A6B6),A
    }
    hl = 0xB038; t += 10; M1.m1 += 1;              // LD HL,$B038
  }
  const h = isHigh(m, de, hl);
  t += h.t; M1.m1 += 1;                            // RET C
  if (h.c) return t + 11;
  t += 5 + 11 + 4 + 10 + lddr3(m, de, hl) + 10; M1.m1 += 4;   // PUSH HL: EX DE,HL: LD BC,3: LDDR: POP HL
  M1.m1 += 4;                                      // Print_HighScore: LD B,3: LD DE: LD HL: RET
  return t + 7 + scoreBuffer(m, hl) + 20 + printString(m, 0x0A19, 0xB024, M1) + 10;
}

/* ---- the next bout's setup: $AC5F to the CALL $AD18, from the listing ---

const SETUP_K = { tune: 36842904 / 36780114, rest: 275349 / 260490 };
/* the scenery by stage: its contended T, CALL $9200 to its return, over
