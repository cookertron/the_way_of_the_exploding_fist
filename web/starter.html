/* ---- the frame clock -------------------------------------------------- */
/* A 48K ULA frame is 69,888 T at 3.5 MHz = 50.08 Hz; a 128K's is 70,908 T at
   3.5469 MHz = 50.02 Hz.  A port sets FRAME_HZ once, from its own machine's
   loader/probe answer; the sound bridge and the loop read it. */
const FRAME_HZ_48K = 50.08, FRAME_HZ_128K = 50.02;
let FRAME_HZ = FRAME_HZ_48K;

/* ---- Spectrum display model (manual 3.2/3.3) ------------------------- */
/* BRIGHT is a second palette, not a brighter alpha: the ULA's two levels are
   $D7 and $FF.  Which one a game uses is a battery question (Q16). */
const PAL_DIM=['#000000','#0000d7','#d70000','#d700d7','#00d700','#00d7d7','#d7d700','#d7d7d7'];
const PAL_BRT=['#000000','#0000ff','#ff0000','#ff00ff','#00ff00','#00ffff','#ffff00','#ffffff'];

/* =======================================================================
   A SPECTRUM DISPLAY FILE, $4000..$5AFF
   =======================================================================
   6,144 bitmap bytes addressed 010TTLLLRRRCCCCC (T = third, L = pixel row
   within the character row, R = character row within the third, C = column)
   and 768 attributes at $5800.  Keeping the real 6,912-byte buffer and the
   real address arithmetic -- rather than inventing a character grid -- is
   what lets a port draw with the ORIGINAL's screen addresses and check its
   own arithmetic against the machine code's (the two static methods below
   are ports of the two most common ROM-idiom snippets, `RRA x3 / AND 3 /
   ADD A,$58` and `INC H / AND 7 / ...`). */
const SCR_LO = 0x4000, SCR_PX = 6144, SCR_BYTES = 6912;
class SpecScreen {
  constructor(){ this.m = new Uint8Array(SCR_BYTES); }
  clear(){ this.m.fill(0); }
  fillAttr(v){ this.m.fill(v & 0xFF, SCR_PX, SCR_BYTES); }
  load(bytes){ this.m.set(bytes.subarray(0, SCR_BYTES)); }
  /* bitmap address of pixel (x, y), the ULA's own bit layout */
  static pixelAddr(x, y){
    return 0x4000 | ((y & 0xC0) << 5) | ((y & 7) << 8) | ((y & 0x38) << 2) | (x >> 3);
  }
  static attrAt(col, row){ return 0x5800 + row*32 + col; }
  /* LD A,H / RRA x3 / AND 3 / ADD A,$58 / LD H,A -- the shift is on H, i.e.
     bits 12:11 of HL (the THIRD), and L is carried through unchanged. */
  static attrAddr(hl){ return 0x5800 + (((hl >> 11) & 3) << 8) + (hl & 0xFF); }
  /* INC H / AND 7 / JR nz / L += $20 / JR c / H -= 8 -- one pixel row down */
  static nextRow(hl){
    let h = ((hl >> 8) + 1) & 0xFF;
    let l = hl & 0xFF;
    if ((h & 7) === 0){
      const nl = l + 0x20;
      if (nl <= 0xFF){ l = nl; h = (h - 8) & 0xFF; } else l = nl & 0xFF;
    }
    return (h << 8) | l;
  }
  /* INC L, and H += 8 when L wraps -- one character column right, crossing
     from one third of the screen to the next */
  static nextCol(hl){
    let l = (hl & 0xFF) + 1, h = hl >> 8;
    if (l > 0xFF){ l = 0; h = (h + 8) & 0xFF; }
    return (h << 8) | l;
  }
  get(a){ return this.m[a - SCR_LO]; }
  put(a, v){ this.m[a - SCR_LO] = v & 0xFF; }
  plot(x, y, on){
    const a = SpecScreen.pixelAddr(x, y) - SCR_LO, m = 0x80 >> (x & 7);
    if (on) this.m[a] |= m; else this.m[a] &= ~m;
  }
  /* one 8x8 glyph (eight bytes of `bytes` from `off`) at screen address hl;
     returns the address one column right, the way every ROM printer does */
  putGlyph(hl, bytes, off){
    off = off | 0;
    let p = hl;
    for (let i = 0; i < 8; i++){ this.put(p, bytes[off + i]); p = SpecScreen.nextRow(p); }
    return SpecScreen.nextCol(hl);
  }
  /* a string through an 8-byte-per-glyph font whose first glyph is `first`
     (the ROM font at $3D00 has first = 32) */

    first = first | 0;
    let p = hl;
    for (let i = 0; i < text.length; i++)

/* ---- the renderer: a display file onto a 2D canvas -------------------
   PRIMITIVES ONLY -- fillRect and fillStyle -- so the same code runs under
   the headless rig's recording stub (manual phase 14: render twice with a
   flag changed and DIFF THE DRAW LISTS).  A row of eight pixels is drawn as
   runs, so an all-paper byte is one call, not eight.                       */
function blitOpaqueRow(ctx,bits,ink,paper,x,y,clipW){
  let run=null,start=0;
  for(let b=0;b<8;b++){
    const px=x+b, c=(bits&(0x80>>b))?ink:paper;
    if(px<0||px>=clipW){ if(run!==null){ctx.fillStyle=run;ctx.fillRect(start,y,px-start,1);run=null;} continue; }
    if(c!==run){ if(run!==null){ctx.fillStyle=run;ctx.fillRect(start,y,px-start,1);} run=c; start=px; }
  }
  if(run!==null){ const end=Math.min(x+8,clipW);
    ctx.fillStyle=run; ctx.fillRect(start,y,end-start,1); }
}
/* FLASH swaps ink and paper every 16 video frames -- bit 4 of the ULA's own
   frame counter, so pass the SIMULATION's frame count, never wall time.
   `rows` clips to the top N character rows (a HUD that must stay put). */
function renderScreen(ctx, scr, frameCtr, rows){
  const n = (rows === undefined ? 24 : rows);
  const fl = (frameCtr >> 4) & 1;
  for (let cr = 0; cr < n; cr++){
    for (let col = 0; col < 32; col++){
      const at = scr.m[SCR_PX + cr*32 + col];
      const pal = (at & 0x40) ? PAL_BRT : PAL_DIM;
      let ink = at & 7, pap = (at >> 3) & 7;
      if ((at & 0x80) && fl){ const t = ink; ink = pap; pap = t; }
      const third = cr >> 3, rowIn = cr & 7;
      for (let y = 0; y < 8; y++){
        const off = (third << 11) | (y << 8) | (rowIn << 5) | col;
        blitOpaqueRow(ctx, scr.m[off], pal[ink], pal[pap], col*8, cr*8+y, 256);
      }

/* the BORDER (OUT ($FE) bits 0-2) is the overscan element's background; it

/* =======================================================================
   THE 48K KEYBOARD AND THE KEMPSTON PORT
   =======================================================================
   The eight half-rows in select-line order: row r is read with bit r of the
   port's high byte LOW ($FE, $FD, $FB, ... $7F), and the bit within a row is
   the position in its list.  A KEY DOWN IS A ZERO BIT, which is why a game's
   tests read backwards (`BIT n,(IX+r)` / `RET z` = "return when pressed"). */
const KB_HALFROWS = [
  ['CAPS', 'Z', 'X', 'C', 'V'],       // $FE
  ['A', 'S', 'D', 'F', 'G'],          // $FD
  ['Q', 'W', 'E', 'R', 'T'],          // $FB
  ['1', '2', '3', '4', '5'],          // $F7
  ['0', '9', '8', '7', '6'],          // $EF
  ['P', 'O', 'I', 'U', 'Y'],          // $DF
  ['ENTER', 'L', 'K', 'J', 'H'],      // $BF
  ['SPACE', 'SYM', 'M', 'N', 'B'],    // $7F
];
/* IN A,($1F), ACTIVE HIGH, the standard bit order.  $20 is ADDED: the real
   port has five bits and nothing else; a gamepad's second button lands here
   so a joystick-only player can reach an action the game keeps on a key. */
const KEMPSTON_RIGHT = 0x01, KEMPSTON_LEFT = 0x02, KEMPSTON_DOWN = 0x04,
      KEMPSTON_UP = 0x08, KEMPSTON_FIRE = 0x10, KEMPSTON_POTION = 0x20;
class Keyboard {
  /* `kempston2` is ADDED: the original machine has exactly one Kempston
     port, so a second independent gamepad has nowhere to plug in.  It gets
     its own field; whether anything READS it is the port's decision. */
  constructor(){ this.held = new Set(); this.kempston = 0; this.kempston2 = 0; }
  press(k){ this.held.add(k); }
  release(k){ this.held.delete(k); }
  releaseAll(){ this.held.clear(); this.kempston = 0; this.kempston2 = 0; }
  down(k){ return this.held.has(k); }
  /* one half-row as the machine returns it (bits 5-7 high) */
  halfrow(r){
    let v = 0xFF;
    const row = KB_HALFROWS[r];
    for (let b = 0; b < 5; b++) if (this.held.has(row[b])) v &= ~(1 << b);
    return v | 0xE0;
  }
  /* `BIT b,(IX+r)` -- 0 when the key is DOWN */
  bit(r, b){ return (this.halfrow(r) >> b) & 1; }
  /* IN A,(C) with B = hi: every half-row whose select bit is LOW is ANDed
     in, exactly as the ULA does -- so IN with hi = $00 reads all eight. */
  port(hi){
    let v = 0xFF;
    for (let r = 0; r < 8; r++) if (!((hi >> r) & 1)) v &= this.halfrow(r);
    return v;
  }
}
/* KeyboardEvent.code -> Spectrum key name.  THE ARROW KEYS ARE THE
   SPECTRUM'S OWN CURSOR KEYS: on a 48K, cursor left/down/up/right ARE
   5/6/7/8 (CAPS + digit), which is exactly what a "cursor joystick" reads.
   Mapping the arrows onto those four keys is not a convenience layer, it is
   the machine.  `extra` overrides or adds entries. */
function buildKeymap(extra){
  const km = {
    ArrowLeft:'5', ArrowDown:'6', ArrowUp:'7', ArrowRight:'8',
    Space:'SPACE', Enter:'ENTER', ShiftLeft:'CAPS', ShiftRight:'CAPS',
    ControlLeft:'SYM', ControlRight:'SYM',
  };
  for (let i=0;i<10;i++) km['Digit'+i] = String(i);
  for (const row of KB_HALFROWS) for (const k of row)
    if (k.length === 1 && k >= 'A' && k <= 'Z') km['Key'+k] = k;
  return Object.assign(km, extra || {});
}
/* Wire the page's key and pointer events into a Keyboard.  Keystrokes aimed
   at a FORM FIELD are not game keys (digits are controls on most games, so
   typing in a field would otherwise walk the player about).  `onGesture`
   runs on any keydown or pointerdown -- the place to start audio, which a
   browser will not do before a user gesture. */
function attachKeyboard(keyboard, opts){
  opts = opts || {};
  const km = opts.keymap || buildKeymap();
  const inField = e => { const t = e.target; return !!t &&
    (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable); };
  const gesture = () => { if (opts.onGesture) opts.onGesture(); };
  addEventListener('pointerdown', gesture);
  addEventListener('keydown', e => { if (inField(e)) return; gesture();
    const k = km[e.code]; if (k){ keyboard.press(k); e.preventDefault(); } });
  addEventListener('keyup', e => { if (inField(e)) return;
    const k = km[e.code]; if (k){ keyboard.release(k); e.preventDefault(); } });
  /* a window that loses focus never sees the keyup -- release everything */
  addEventListener('blur', () => keyboard.releaseAll());
  return km;
}

/* ---- gamepads, through the same port byte the game reads -------------
   Standard Gamepad API layout: axes 0/1 and d-pad buttons 12-15 for the
   directions; face buttons A/X/Y (0/2/3) fire; B and the shoulders (1/4/5)
   carry the ADDED $20 bit.  Nothing here is read unless the game reads the
   Kempston port. */
function padBits(p){
  let v = 0;
  const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
  if (ax >  0.4) v |= KEMPSTON_RIGHT;
  if (ax < -0.4) v |= KEMPSTON_LEFT;
  if (ay >  0.4) v |= KEMPSTON_DOWN;
  if (ay < -0.4) v |= KEMPSTON_UP;
  const b = p.buttons || [];
  const on = i => b[i] && b[i].pressed;
  if (on(15)) v |= KEMPSTON_RIGHT;  if (on(14)) v |= KEMPSTON_LEFT;
  if (on(13)) v |= KEMPSTON_DOWN;   if (on(12)) v |= KEMPSTON_UP;
  if (on(0) || on(2) || on(3)) v |= KEMPSTON_FIRE;
  if (on(1) || on(4) || on(5)) v |= KEMPSTON_POTION;
  return v;
}
/* Poll once per display frame.  Returns the CONNECTED pads compacted (the
   API's own array is sparse and slot-indexed), so "pad 0" and "pad 1" mean
   the first and second controller actually plugged in. */
function pollGamepads(keyboard){
  keyboard.kempston = 0; keyboard.kempston2 = 0;
  const connected = [];
  if (typeof navigator !== 'undefined' && navigator.getGamepads){
    let pads;
    try { pads = navigator.getGamepads(); } catch(e) { pads = null; }
    for (const p of (pads || [])) if (p && p.connected) connected.push(p);
  }
  if (connected[0]) keyboard.kempston = padBits(connected[0]);
  if (connected[1]) keyboard.kempston2 = padBits(connected[1]);
  return {
    count: connected.length,
    names: connected.map(p => (p.id || 'PAD').slice(0, 11).toUpperCase()),
    bits: connected.map(padBits),
  };
}

/* =======================================================================
   SOUND -- two instruments at sample level, and the bridge to Web Audio
   =======================================================================
   A port's sound driver produces an EVENT LOG and nothing else:
       AY      rows of [simulatedFrame, register, value]   integer frames
       BEEPER  rows of [simulatedFrame, speakerLevel]      FRACTIONAL frames
   Every event carries the simulated frame it happened on, which is the
   same thing a .psg file holds and the same thing a differential gate reads
   off the real Z80.  Nothing in a driver touches Web Audio; SoundOut below
   turns the log into sound on the SIMULATION's clock, never the display's. */
const AY_CLOCK = 1773400;                   // 128K: CPU clock / 2
class AyChip{
  constructor(sampleRate, clock){
    this.sr = sampleRate; this.clock = clock || AY_CLOCK;
    this.stepsPerSample = (this.clock/8)/this.sr;
    this.frac = 0; this.last = 0;
    this.reg = new Uint8Array(16);
    this.tc = [0,0,0]; this.to = [1,1,1];
    this.nc = 0; this.lfsr = 1; this.no = 1;
    this.ec = 0; this.estep = 0; this.ehold = false; this.eatt = false;
    this.evol = 0;
    /* the AY-3-8910's 16 logarithmic levels, normalised: about -1.5 dB a
       step, i.e. amplitude ratio 2^(-1/4) per level */
    this.vt = new Float32Array(16);
    for (let i=0;i<16;i++) this.vt[i] = i === 0 ? 0 : Math.pow(2, (i-15)/4);
  }
  write(r, v){
    r &= 15; v &= 0xFF;
    this.reg[r] = v;
    /* a write to R13 RESTARTS the envelope, whatever value it carries */
    if (r === 13){ this.estep = 0; this.ehold = false; this.ec = 0;
                   this.eatt = !!(v & 4);
                   this.evol = this.eatt ? 0 : 15; }
  }
  period(lo){ return (this.reg[lo] | (this.reg[lo+1]<<8)) & 0xFFF; }
  /* one internal step = one count of clock/8 */
  chipStep(){
    for (let c=0;c<3;c++){
      const p = this.period(2*c) || 1;          // period 0 behaves as 1
      if (++this.tc[c] >= p){ this.tc[c] = 0; this.to[c] ^= 1; }
    }
    const np = (this.reg[6] & 31) || 1;
    if (++this.nc >= np*2){                     // f = clock/(16*NP)
      this.nc = 0;
      /* the 17-bit LFSR, taps 0 and 3 -- the standard AY noise generator */
      const bit = ((this.lfsr ^ (this.lfsr>>3)) & 1);
      this.lfsr = (this.lfsr>>1) | (bit<<16);
      this.no = this.lfsr & 1;
    }
    /* the envelope: 16 steps, one every clock/(16*EP), with R13's four bits
       read as continue/attack/alternate/hold -- the datasheet's shapes */
    const ep = ((this.reg[11] | (this.reg[12]<<8)) & 0xFFFF) || 1;
    if (!this.ehold && ++this.ec >= ep*2){
      this.ec = 0;
      const sh = this.reg[13] & 15;
      const cont = sh & 8, alt = sh & 2, hold = sh & 1;
      if (++this.estep > 15){
        if (!cont){ this.ehold = true; this.evol = 0; }
        else {
          this.estep = 0;
          if (alt) this.eatt = !this.eatt;
          if (hold){ this.ehold = true; this.estep = 15; }
        }
      }
      if (!(this.ehold && !cont))
        this.evol = this.eatt ? this.estep : 15 - this.estep;
    }
    const mixer = this.reg[7];
    let out = 0;
    for (let c=0;c<3;c++){
      /* INVERTED: a SET bit disables.  (tone|dis) & (noise|dis) is the
         chip's own AND of the two generators. */
      const t = ((mixer>>c) & 1) | this.to[c];
      const n = ((mixer>>(c+3)) & 1) | this.no;
      if (!(t & n)) continue;
      const v = this.reg[8+c];
      const lvl = (v & 16) ? this.evol : (v & 15);
      out += this.vt[lvl];
    }
    return out/3;
  }
  /* each output sample is the MEAN of the internal steps it spans -- the
     cheap anti-alias that keeps a tone-period-0 row from folding down as a
     whine */
  render(buf, off, n){
    for (let i=0;i<n;i++){
      this.frac += this.stepsPerSample;
      const k = this.frac|0; this.frac -= k;
      if (k){ let a = 0; for (let j=0;j<k;j++) a += this.chipStep();
              this.last = a/k; }
      buf[off+i] = this.last;
    }
  }
}

/* THE BEEPER, at sample level.  One bit, so there is no chip to model --
   only the square wave the edge stream describes.  Each output sample is
   the EXACT MEAN of the square over the sample's own interval (a box
   integral), because game data routinely puts pitches at or beyond the top
   of hearing and a point-sampled square would fold them straight into the
   audible band as a whine that is not in the original.  A chirp whose
   half-period is shorter than a sample simply averages towards zero, which
   is what a speaker cone does with it. */
/* ADDED: THE SPEAKER, as distinct from the VOLTAGE.  The chip reproduces
   bit 4 of $FE exactly -- a mathematically perfect square -- but nobody
   ever HEARD that: the real machine played it through a ~4 cm cone in a
   plastic case, which mechanically low-passed everything.  The raw square
   is measurably harsher into modern hardware (edge fold-back, and small
   laptop drivers buzz on full-bandwidth squares), so true runs the render
   through a 2nd-order low-pass at 4.2 kHz -- the same class of speaker
   model mature emulators apply -- and false is the raw voltage, toggleable
   live (speakerFilter.set) so the two can be A/B'd mid-game.  The dc=false
   exactness path and every edge-stream gate sit upstream, unaffected. */
let SPEAKER_FILTER = true;
const speakerFilter = {
  get(){ return SPEAKER_FILTER; },
  set(v){ SPEAKER_FILTER = !!v; return SPEAKER_FILTER; },
};
class BeeperChip{
  constructor(sampleRate, dc){
    this.sr = sampleRate; this.lvl = 0;
    /* A DC BLOCKER, because the speaker is a CONE and not a voltmeter.  Bit
       4 of $FE is a level, not a signal: between effects a game holds it
       LOW for tens of thousands of samples, and rendering that as -0.5 puts
       an enormous DC step at both ends of every effect.  Every real speaker
       and amplifier is AC coupled; this is the one-pole high pass:
           y[n] = x[n] - x[n-1] + R*y[n-1],   R = 1 - 2*pi*fc/sr, fc = 20 Hz
       Constant in -> zero out; a 1,588 Hz square passes at 0.998 of unity.
       Pass dc=false to see the raw duty cycle (what an exactness gate
       measures). */
    this.dc = dc !== false;
    this.R = 1 - 2*Math.PI*20/sampleRate;
    this.px = 0; this.py = 0;
    /* the SPEAKER MODEL's biquad (RBJ low-pass, fc 4.2 kHz, Q 0.7071),
       transposed direct form II; state persists across render() calls the
       same way px/py do, so buffer joins stay continuous.  The state is fed
       even when SPEAKER_FILTER is off, so a live toggle never thumps. */
    const w0 = 2*Math.PI*4200/sampleRate, cw = Math.cos(w0),
          al = Math.sin(w0)/(2*0.7071), a0 = 1 + al;
    this.fb0 = ((1-cw)/2)/a0; this.fb1 = (1-cw)/a0; this.fb2 = this.fb0;
    this.fa1 = (-2*cw)/a0;    this.fa2 = (1-al)/a0;
    this.z1 = 0; this.z2 = 0;
  }
  /* `edges` is a sorted list of [timeSeconds, level] relative to `t0`; every
     one strictly inside [t0, t0 + n/sr) is consumed.  Returns the index of
     the first edge NOT consumed. */
  render(buf, off, n, t0, edges, ei){
    const dt = 1/this.sr;
    for (let i=0;i<n;i++){
      const a = t0 + i*dt, b = a + dt;
      let acc = 0, cur = a;
      while (ei < edges.length && edges[ei][0] < b){
        const e = edges[ei];
        if (e[0] > cur){ acc += this.lvl*(e[0]-cur); cur = e[0]; }
        this.lvl = e[1]; ei++;
      }
      acc += this.lvl*(b-cur);
      const v = acc*this.sr;                  // the EXACT duty cycle, 0..1
      if (!this.dc){ buf[off+i] = v - 0.5; continue; }
      const y = v - this.px + this.R*this.py;
      this.px = v; this.py = y;
      const s = this.fb0*y + this.z1;             // the speaker model
      this.z1 = this.fb1*y - this.fa1*s + this.z2;
      this.z2 = this.fb2*y - this.fa2*s;
      buf[off+i] = SPEAKER_FILTER ? s : y;
    }
    return ei;
  }
}

/* =======================================================================
   THE BRIDGE (manual 11.10, and the one step everyone invents badly)
   =======================================================================
   A simulation drains a whole display frame's worth of work in one burst --
   and a blocking pause in the original can drain seconds of frames at once
   -- so playing each event on arrival would stack them into one instant.
   EVERY EVENT CARRIES ITS SIMULATED FRAME; the bridge converts that to
   stream time and renders the samples for it.

   TWO TRANSPORTS.  The worklet (default where available) is ONE continuous
   pull-model stream, the way an emulator does it: an AudioWorkletProcessor
   holding a FIFO of rendered chunks.  The scheduled path stitches one-shot
   AudioBufferSourceNodes onto a sample grid; it is sample-exact in context
   time, and it stays as the fallback for browsers without worklets and for
   the AY instrument -- but one machine in the case study (a gaming laptop)
   crackled on its joins while an emulator's stream played clean, which is
   why the worklet exists.  Both share the same rules: the whole-sample
   tiling, the restart re-origin, and the adaptive lead. */
const SND_LEAD = 0.08;        // seconds of head start given to the first buffer
const SND_LEAD_MAX = 0.24;    // the adaptive ratchet's ceiling -- see `lead`
const SND_AHEAD = 3.0;        // never schedule further ahead than this
const SND_VOICES = 48;        // the hard cap on LIVE scheduled buffers
/* The processor: chunk FIFO + a `min` refill gate.  Underruns emit zeros
   and REFUSE to resume until the queue holds `min` again -- recovery and
   lead-rebuild inside one gap -- then report the episode's length once.
   Boot silence (before the first chunk) is not an underrun. */
const WORKLET_SRC = `
class SpecBeeperOut extends AudioWorkletProcessor {
  constructor(){
    super();
    this.q = []; this.off = 0; this.depth = 0;
    this.min = 0;            // do not (re)start until this many are queued
    this.gap = 0;            // zeros emitted in the current underrun episode
    this.started = false;    // pre-start silence is not an underrun
    this.port.onmessage = (e) => {
      const d = e.data || {};
      if (typeof d.min === 'number') this.min = d.min;
      if (d.chunk){ this.q.push(d.chunk); this.depth += d.chunk.length; }
    };
  }
  process(inputs, outputs){
    const out = outputs[0][0];
    for (let i = 0; i < out.length; i++){
      if (!this.started || this.gap > 0){
        if (this.depth < this.min){
          out[i] = 0;
          if (this.started) this.gap++;
          continue;
        }
        if (this.gap > 0){ this.port.postMessage({ underrun: this.gap }); this.gap = 0; }
        this.started = true;
      } else if (this.depth === 0){
        out[i] = 0; this.gap++;
        continue;
      }
      const c = this.q[0];
      out[i] = c[this.off++]; this.depth--;
      if (this.off >= c.length){ this.q.shift(); this.off = 0; }
    }
    return true;
  }
}
registerProcessor('spec-beeper', SpecBeeperOut);
`;
class SoundOut{
  /* opts: instrument 'beeper' (default) | 'ay'; frameHz (default FRAME_HZ);
     gain (default 0.30); ayClock */
  constructor(opts){
    opts = opts || {};
    this.instrument = opts.instrument || 'beeper';
    this.frameHz = opts.frameHz || FRAME_HZ;
    this.gainValue = (opts.gain != null) ? opts.gain : 0.30;
    this.ayClock = opts.ayClock || AY_CLOCK;
    this.ctx = null; this.gain = null; this.chip = null;
    this.next = null;         // the next SIMULATED FRAME still to render
    this.base = 0;            // the simulated frame that maps to t0
    this.t0 = 0;              // its AudioContext time
    this.live = [];           // scheduled END TIMES, the only voice bookkeeping
    this.on = true; this.dropped = 0; this.resyncs = 0;
    /* THE ADAPTIVE LEAD (ADDED).  SND_LEAD is the whole jitter budget: the
       schedule runs `lead` seconds ahead of the clock, so a main-thread
       stall longer than that tears it -- one gap for the stall, then
       another `lead` of silence from the resync.  A fixed budget cannot fit
       both a quiet desktop and a janky laptop, so every GENUINE underrun
       (never a restart re-origin) ratchets the lead up to cover the stall
       just measured, capped at SND_LEAD_MAX.  It never decays: a machine
       that stalled once will stall again. */
    this.lead = SND_LEAD;
    this.underruns = 0;       // genuine tears only -- resyncs also counts restarts
    /* the worklet path: 'sched' until addModule resolves, 'worklet' from
       then on; initPending holds flush() off for the few ms the decision
       takes, so the first buffers take whichever path actually won */
    this.mode = 'sched'; this.node = null; this.initPending = false;
    this.workletErr = '';     // why the worklet did not engage, for info()
    this.vbase = 0;           // sim frame at the stream's origin
    this.vsent = 0;           // samples pushed since that origin
  }
  /* the underrun branch of both SCHEDULED paths: measure the deficit, cover it */
  ratchet(now, when){
    this.underruns++;
    this.lead = Math.min(SND_LEAD_MAX,
                         Math.max(this.lead, (now - when) + SND_LEAD));
  }
  /* the WORKLET's version, fed by its underrun reports: the episode length
     IS the measured deficit, in samples */
  ratchetSamples(n){
    this.underruns++;
    const sr = this.ctx ? this.ctx.sampleRate : 44100;
    this.lead = Math.min(SND_LEAD_MAX,
                         Math.max(this.lead, n/sr + SND_LEAD));
    if (this.node) this.node.port.postMessage({ min: Math.floor(this.lead*sr) });
  }
  /* one line for a bug report: the whole audio state, console-pasteable.
     On a machine you cannot touch, shipped diagnostics ARE the debugger. */
  info(){
    const c = this.ctx || {};
    return 'mode=' + this.mode + ' sr=' + (c.sampleRate || 0) +
           ' lead=' + this.lead.toFixed(3) + ' underruns=' + this.underruns +
           ' resyncs=' + this.resyncs + ' dropped=' + this.dropped +
           ' base=' + (c.baseLatency != null ? c.baseLatency.toFixed(4) : '?') +
           ' out=' + (c.outputLatency != null ? c.outputLatency.toFixed(4) : '?') +
           ' wk=' + (this.mode === 'worklet' ? 'on'
                     : (this.workletErr ? this.workletErr.trim() : 'off'));
  }
  /* Call from the first user gesture (a browser will not start a context
     before one).  Returns TRUE only on the call that brings the context up. */
  start(){
    if (this.ctx || !this.on) return false;
    const C = (typeof AudioContext !== 'undefined') ? AudioContext
            : (typeof webkitAudioContext !== 'undefined') ? webkitAudioContext
            : null;
    if (!C){ this.on = false; return false; }
    /* 'playback', NOT the default 'interactive': the default asks the OS
       for the SMALLEST hardware buffer it can serve, the most glitch-prone
       setting there is on a machine whose audio engine gets starved by DPC
       spikes.  A game's sound is quantised to its own frame or pass
       granularity anyway, so the ~100 ms 'playback' costs is below it. */
    try { this.ctx = new C({ latencyHint: 'playback' }); }
    catch (e) { this.ctx = new C(); }
    this.chip = this.instrument === 'beeper'
              ? new BeeperChip(this.ctx.sampleRate)
              : new AyChip(this.ctx.sampleRate, this.ayClock);
    this.gain = this.ctx.createGain();
    this.gain.gain.value = this.gainValue;
    this.gain.connect(this.ctx.destination);
    this.next = null;
    /* TWO module URLs, in order, because the obvious one fails exactly
       where a single-file port lives: Chrome refuses a BLOB module for a
       worklet on a file:// page (AbortError, 'Unable to load a worklet's
       module' -- MEASURED in headless Chrome, which also proved the data:
       form loads, constructs and talks), and file:// is how a download-and-
       double-click player runs the game.  blob: first for the http(s)
       world, data: as the file:// fallback, and a failure of both leaves
       the reason in workletErr where info() shows it -- a silent fallback
       once cost a whole remote-debugging round trip. */
    if (this.instrument === 'beeper' && this.ctx.audioWorklet &&
        typeof AudioWorkletNode !== 'undefined' &&
        typeof Blob !== 'undefined' && typeof URL !== 'undefined' &&
        URL.createObjectURL){
      this.initPending = true;
      const wire = () => {
        this.node = new AudioWorkletNode(this.ctx, 'spec-beeper',
          { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [1] });
        this.node.connect(this.gain);
        this.node.port.onmessage = (e) => {
          if (e.data && e.data.underrun) this.ratchetSamples(e.data.underrun);
        };
        this.node.port.postMessage(
          { min: Math.floor(this.lead * this.ctx.sampleRate) });
        this.mode = 'worklet'; this.initPending = false;
      };
      /* only addModule's own then(onOk, onErr) -- no interior Promises, so
         the chain is drivable synchronously by a thenable in tests */
      const attempt = (url, tag, next) => {
        this.ctx.audioWorklet.addModule(url).then(wire, (e) => {
          this.workletErr += tag + ':' + ((e && e.name) || e) + ' ';
          if (next) next(); else this.initPending = false;
        });
      };
      const blobUrl = URL.createObjectURL(
        new Blob([WORKLET_SRC], { type: 'application/javascript' }));
      attempt(blobUrl, 'blob', () => {
        if (typeof btoa !== 'undefined')
          attempt('data:application/javascript;base64,' + btoa(WORKLET_SRC),
                  'data', null);
        else this.initPending = false;
      });
    }
    return true;
  }
  /* `events` is the driver's log and `upto` is the first simulated frame the
     engine has NOT yet run, so every frame below it is closed and can be
     rendered.  Call once per display frame, AFTER the simulation step. */
  flush(events, upto){
    if (this.initPending) return;      // path not decided yet; the log waits
    if (this.mode === 'worklet') return this.flushWorklet(events, upto);
    if (this.instrument === 'beeper') return this.flushBeeper(events, upto);
    return this.flushAy(events, upto);
  }
  /* THE WORKLET PATH -- the same absolute whole-sample tiling flushBeeper
     explains, against a VIRTUAL stream clock: sample s of the stream is sim
     frame vbase + s*frameHz/sr, so chunk k's end and chunk k+1's start are
     the same expression of the same (vbase, vsent) and the FIFO
     concatenation reconstructs one continuous render exactly.  No voice
     cap, no scheduling, no resync arithmetic: bursts deepen the queue and
     drain, underruns are the WORKLET's to detect, and a sim-clock restart
     just re-origins the map with no gap at all. */
  flushWorklet(events, upto){
    if (!this.on){ events.length = 0; return; }
    const sr = this.ctx.sampleRate, FHZ = this.frameHz;
    if (this.next === null || upto < this.next){
      if (this.next !== null){
        this.resyncs++;
        if (events.length) this.chip.lvl = events[events.length-1][1];
      }
      this.next = upto; this.vbase = upto; this.vsent = 0;
      events.length = 0; return;
    }
    const nf = upto - this.next;
    if (nf <= 0) return;
    const total = Math.floor((upto - this.vbase)/FHZ*sr) - this.vsent;
    if (total <= 0) return;
    const vStart = this.vsent/sr;               // stream seconds since origin
    const vEnd = (this.vsent + total)/sr;
    /* cut by the window, not by the frame: an edge in the last sub-sample
       sliver stays in the log for the next chunk, which begins exactly there */
    let cut = 0;
    while (cut < events.length && events[cut][0] < upto) cut++;
    while (cut > 0 && (events[cut-1][0] - this.vbase)/FHZ >= vEnd) cut--;
    const chunk = new Float32Array(total);
    const ed = [];
    for (let i = 0; i < cut; i++)
      ed.push([(events[i][0] - this.vbase)/FHZ - vStart, events[i][1]]);
    const ei = this.chip.render(chunk, 0, total, 0, ed, 0);
    if (ei < ed.length) this.chip.lvl = ed[ed.length-1][1];
    events.splice(0, cut);
    this.next = upto; this.vsent += total;
    this.node.port.postMessage({ chunk }, [chunk.buffer]);
  }
  /* THE SCHEDULED BEEPER PATH.  A buffer is the WHOLE-SAMPLE WINDOW its own
     map picks out -- both ENDS taken onto the sample grid with floor, never
     a rounded LENGTH dropped at an exact time.  With a 50.08 Hz frame a
     frame is 880.591 samples (at 44.1 kHz), and rounding the length while
     leaving the ends exact makes every buffer a fraction of a sample wider
     or narrower than its slot: overlaps SUM on a sample, holes leave a
     zero mid-wave (in the case study 426 of 1,042 joins collided and the
     mixed peak reached 1.22 against a largest single sample of 1.00).
     Taking the two ends onto the grid makes consecutive buffers abut by
     construction for ANY frame count, and FLOOR (not round) keeps an
     event's time relative to its own buffer non-negative, so no edge is
     ever pushed back into a buffer already handed to the context. */
  flushBeeper(events, upto){
    if (!this.ctx || !this.on){ events.length = 0; return; }
    const now = this.ctx.currentTime, FHZ = this.frameHz;
    this.live = this.live.filter(t => t > now);
    /* THE SIMULATED CLOCK CAN RESTART (a game reset puts the frame counter
       back to 0), and a backward jump is not drift -- the map's ORIGIN is
       simply gone, so re-origin exactly as the first flush does.  Without
       this branch the game plays SILENT for as long as the previous run
       lasted (measured in the case study: 19.3 s after a 930-frame menu). */
    if (this.next === null || upto < this.next){
      if (this.next !== null){
        this.resyncs++;
        /* leave the SPEAKER where the driver left it */
        if (events.length) this.chip.lvl = events[events.length-1][1];
      }
      this.next = upto; this.base = upto; this.t0 = now + this.lead;
      events.length = 0; return;
    }
    const f0 = this.next, nf = upto - f0;
    if (nf <= 0) return;
    let when = this.t0 + (f0 - this.base)/FHZ;
    if (when < now + 0.005 || when > now + SND_AHEAD){
      if (when < now + 0.005) this.ratchet(now, when);   // a genuine tear
      this.base = f0; this.t0 = when = now + this.lead; this.resyncs++;
    }
    let cut = 0;
    while (cut < events.length && events[cut][0] < upto) cut++;
    /* THE VOICE CAP, counted against the clock: a buffer whose scheduled
       end time is in the past is finished, whatever the browser did or did
       not call back.  Nothing here decrements in an `onended` handler --
       that callback may never fire if the context is suspended, and then
       the cap never releases. */
    if (this.live.length >= SND_VOICES){
      this.dropped++; this.next = upto;
      /* a dropped buffer still has to leave the SPEAKER where the original
         left it, or the next buffer starts on the wrong level */
      if (cut) this.chip.lvl = events[cut-1][1];
      events.splice(0, cut);
      return;
    }
    const sr = this.ctx.sampleRate;
    const s0 = Math.floor(when*sr);
    const s1 = Math.floor((this.t0 + (upto - this.base)/FHZ)*sr);
    const total = s1 - s0;
    if (total <= 0) return;
    const start = s0/sr;                    // the time it REALLY starts
    /* CUT BY THE WINDOW, NOT BY THE FRAME: the window ends on a sample
       boundary, up to one sample short of `upto`'s exact time; an edge in
       that sliver STAYS IN THE LOG and is rendered at its true position by
       the next buffer, which begins exactly there. */
    const wEnd = start + total/sr;
    while (cut > 0 &&
           this.t0 + (events[cut-1][0]-this.base)/FHZ >= wEnd) cut--;
    const buf = this.ctx.createBuffer(1, total, sr);
    const out = buf.getChannelData(0);
    /* edge frames -> seconds from the START of this buffer, measured from
       `start` (the sample it is actually laid on), not from the ideal `when` */
    const ed = [];
    for (let i=0;i<cut;i++)
      ed.push([this.t0 + (events[i][0]-this.base)/FHZ - start, events[i][1]]);
    const ei = this.chip.render(out, 0, total, 0, ed, 0);
    /* NOTHING MAY BE SPLICED AWAY UNRENDERED: the backstop for a log that is
       not perfectly sorted (two interleaved voices), because an unrendered
       edge whose level never reaches the chip inverts the speaker for the
       rest of the stream. */
    if (ei < ed.length) this.chip.lvl = ed[ed.length-1][1];
    events.splice(0, cut);
    this.next = upto;
    const src = this.ctx.createBufferSource();
    src.buffer = buf; src.connect(this.gain); src.start(start);
    this.live.push(start + total/sr);
  }
  /* THE AY PATH -- same clock discipline; the payload is register writes on
     integer frames and the mixing is a chip step rather than a box integral */
  flushAy(events, upto){
    if (!this.ctx || !this.on){ events.length = 0; return; }
    const now = this.ctx.currentTime, FHZ = this.frameHz;
    this.live = this.live.filter(t => t > now);
    if (this.next === null || upto < this.next){
      if (this.next !== null){
        this.resyncs++;
        /* the CHIP's registers must still end where the driver left them */
        for (const e of events) this.chip.write(e[1], e[2]);
      }
      this.next = upto; this.base = upto; this.t0 = now + this.lead;
      events.length = 0; return;
    }
    const f0 = this.next, nf = upto - f0;
    if (nf <= 0) return;
    let when = this.t0 + (f0 - this.base)/FHZ;
    if (when < now + 0.005 || when > now + SND_AHEAD){
      if (when < now + 0.005) this.ratchet(now, when);   // a genuine tear
      this.base = f0; this.t0 = when = now + this.lead; this.resyncs++;
    }
    if (this.live.length >= SND_VOICES){        // the cap, not a callback
      this.dropped++; this.next = upto;
      let ei = 0;
      while (ei < events.length && events[ei][0] < upto){
        this.chip.write(events[ei][1], events[ei][2]); ei++;
      }
      events.splice(0, ei);
      return;
    }
    const sr = this.ctx.sampleRate;
    /* the same whole-sample tiling: the frame boundaries INSIDE the buffer
       are taken on the absolute grid too */
    const s0 = Math.floor(when*sr);
    const smp = f => Math.floor((this.t0 + (f - this.base)/FHZ)*sr) - s0;
    const total = smp(upto);
    if (total <= 0) return;
    const start = s0/sr;
    const buf = this.ctx.createBuffer(1, total, sr);
    const out = buf.getChannelData(0);
    let ei = 0, written = 0;
    for (let f=0; f<nf; f++){
      while (ei < events.length && events[ei][0] <= f0+f){
        this.chip.write(events[ei][1], events[ei][2]); ei++;
      }
      const end = Math.min(total, smp(f0+f+1));
      if (end > written){ this.chip.render(out, written, end - written);
                          written = end; }
    }
    if (written < total) this.chip.render(out, written, total - written);
    events.splice(0, ei);
    this.next = upto;
    const src = this.ctx.createBufferSource();
    src.buffer = buf; src.connect(this.gain); src.start(start);
    this.live.push(start + total/sr);
  }
}

/* =======================================================================
   THE LOOP -- a fixed simulation timestep under a free-running display
   =======================================================================
   The SIMULATION advances in whole video frames of 1/hz seconds, however
   many the elapsed wall time covers (capped, so a backgrounded tab does not
   burst minutes of frames on return); the DISPLAY draws once per rAF with
   whatever state that left.  Sound is flushed from `draw`, after the steps,
   with the simulation's own frame count -- never with wall time.
     makeLoop({ hz, poll(), step(frameIndex), draw(dt), maxDt, raf })      */
function makeLoop(o){
  const hz = o.hz || FRAME_HZ, maxDt = o.maxDt || 0.25;
  const raf = o.raf || (cb => requestAnimationFrame(cb));
  let last = null, acc = 0, frames = 0;
  function frame(t){
    if (last === null) last = t;
    const dt = Math.min((t - last)/1000, maxDt); last = t;
    if (o.poll) o.poll();
    acc += dt; if (acc > maxDt) acc = maxDt;
    while (acc >= 1/hz){ acc -= 1/hz; o.step(frames++); }
    o.draw(dt);
    raf(frame);
  }
  return { frame, start(){ raf(frame); }, get frames(){ return frames; } };
}

/* ---- per-browser settings, guarded -----------------------------------
   Every localStorage call is in try/catch: a page opened from file:// with
   site data blocked THROWS rather than returning null.  save() reports
   whether the write landed, so a caller (and a test) can tell a silent
   no-op from a round trip. */
function settingsStore(key){
  return {
    load(){ try { return JSON.parse(localStorage.getItem(key) || 'null'); }
            catch(e){ return null; } },
    save(v){ try { localStorage.setItem(key, JSON.stringify(v)); return true; }
             catch(e){ return false; } },
    clear(){ try { localStorage.removeItem(key); } catch(e){} },
  };
}

/* ---- the theme button: SYSTEM -> DARK -> LIGHT, remembered per browser --
   It blurs itself after a click, because a button left holding focus
   swallows SPACE -- which is a fire key on most games. */
function installThemeButton(btnId, storageKey){
  const root = (typeof document !== 'undefined') ? document.documentElement : null;
  const btn = (typeof document !== 'undefined') ? document.getElementById(btnId) : null;
  /* headless has a stub document and no page to theme -- nothing to do */
  if (!root || !root.setAttribute || !btn) return null;
  const store = settingsStore(storageKey || 'spec-port-theme');
  const FACE = {auto:'◐', dark:'☾', light:'☀'};
  let mode = store.load() || 'auto';
  if (!FACE[mode]) mode = 'auto';
  function apply(){
    if (mode === 'auto') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', mode);
    btn.textContent = FACE[mode];
    btn.title = 'theme: ' + mode + ' (click to change)';
  }
  btn.onclick = () => {
    mode = mode === 'auto' ? 'dark' : mode === 'dark' ? 'light' : 'auto';
    store.save(mode); apply(); btn.blur();
  };
  apply();
  return () => mode;
}

/* ---- the export for the headless rig ---------------------------------- */
globalThis.__SPEC__ = {
  get FRAME_HZ(){ return FRAME_HZ; }, set FRAME_HZ(v){ FRAME_HZ = v; },
  FRAME_HZ_48K, FRAME_HZ_128K,
  PAL_DIM, PAL_BRT, b64,
  SCR_LO, SCR_PX, SCR_BYTES, SpecScreen, blitOpaqueRow, renderScreen, paintBorder,
  KB_HALFROWS, Keyboard, buildKeymap, attachKeyboard,
  KEMPSTON_RIGHT, KEMPSTON_LEFT, KEMPSTON_DOWN, KEMPSTON_UP, KEMPSTON_FIRE,
  KEMPSTON_POTION, padBits, pollGamepads,
  AY_CLOCK, AyChip, BeeperChip, speakerFilter, SoundOut, WORKLET_SRC,
  SND_LEAD, SND_LEAD_MAX, SND_AHEAD, SND_VOICES,
  makeLoop, settingsStore, installThemeButton,
};

/* ---- end platform.js ---- */

/* ---- the demo "game" ------------------------------------------------- */
const TONE_HZ = 440;
class Demo {
  constructor(){
    this.scr = new SpecScreen();
    this.frame = 0;            // video frames stepped (the FLASH clock too)
    this.simFrame = 0;         // the sound bridge's clock, in video frames
    this.x = 15; this.y = 11;  // the block, in character cells
    this.border = 0;
    this.lvl = 0;              // the speaker level the log last set
    this.tNext = 0;            // the next tone edge, in fractional frames
    this.firing = false;
    this.sound = { log: [] };  // rows of [simulatedFrame, level]
    this.scr.fillAttr(0x0F);   // white ink on blue paper
    this.paintCell(true);
  }
  paintCell(on){
    let p = SpecScreen.pixelAddr(this.x*8, this.y*8);
    for (let i = 0; i < 8; i++){ this.scr.put(p, on ? 0xFF : 0); p = SpecScreen.nextRow(p); }
    /* FLASH while firing: bit 7 of the attribute, swapped by renderScreen
       every 16 video frames from the frame counter it is handed */
    this.scr.put(SpecScreen.attrAt(this.x, this.y), (this.firing ? 0x80 : 0) | 0x0F);
  }
  /* one video frame.  QAOP or the cursor keys (5678, i.e. the arrows) or a
     Kempston joystick move; SPACE or fire beeps and reddens the border. */
  step(kb){
    const f0 = this.simFrame, k = kb.kempston;
    let dx = 0, dy = 0;
    if (kb.down('O') || kb.down('5') || (k & KEMPSTON_LEFT))  dx = -1;
    if (kb.down('P') || kb.down('8') || (k & KEMPSTON_RIGHT)) dx = 1;
    if (kb.down('Q') || kb.down('7') || (k & KEMPSTON_UP))    dy = -1;
    if (kb.down('A') || kb.down('6') || (k & KEMPSTON_DOWN))  dy = 1;
    const fire = kb.down('SPACE') || !!(k & KEMPSTON_FIRE);
    if ((dx || dy) && (this.frame % 4) === 0){
      this.paintCell(false);
      this.x = (this.x + dx + 32) % 32; this.y = (this.y + dy + 24) % 24;
    }
    /* the tone is an EDGE STREAM on the simulated clock: a running phase,
       so consecutive frames join without a phase jump */
    if (fire){
      const half = FRAME_HZ / (2 * TONE_HZ);         // half a period, in frames
      if (!this.firing) this.tNext = Math.max(this.tNext, f0);
      while (this.tNext < f0 + 1){
        this.lvl ^= 1; this.sound.log.push([this.tNext, this.lvl]);
        this.tNext += half;
      }
    } else if (this.lvl){
      this.lvl = 0; this.sound.log.push([f0, 0]);    // leave the speaker LOW
    }
    this.firing = fire;
    this.border = fire ? 2 : 0;
    this.paintCell(true);
    this.frame++; this.simFrame++;
  }
}

/* ---- driver ---------------------------------------------------------- */
const cvs = document.getElementById('scr'), ctx = cvs.getContext('2d');
const demo = new Demo();
/* created here, STARTED from the first gesture -- a browser will not run an
   AudioContext before one */
const sound = new SoundOut();
const keyboard = new Keyboard();
attachKeyboard(keyboard, { onGesture(){ sound.start(); } });
const loop = makeLoop({
  hz: FRAME_HZ,
  poll(){ pollGamepads(keyboard); },
  step(){ demo.step(keyboard); },
  draw(){
    /* the bridge is handed the driver's log and the SIMULATED frame the
       engine has reached -- never wall time */
    sound.flush(demo.sound.log, demo.simFrame);
    paintBorder(demo.border);
    renderScreen(ctx, demo.scr, demo.frame);
  },
});
installThemeButton('theme', 'spec-port-theme');
loop.start();

/* the test hook: test/kit.test.js loads the BUILT file and drives this */
globalThis.__PORT__ = { Demo, demo, sound, keyboard, loop, assets: A };
</script>
