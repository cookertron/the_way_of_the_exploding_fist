# ledger/AD44.toml -- current truth about time_up (manual 12.2, 12.11).
# Written with tools/record.py; history is in git.

name     = "time_up"
entries  = ["$AD44", "$AE67", "$ACCF"]
oracle   = "tools/callio.py"
fixtures = ["end_ae67", "time_ad44", "draw_ad44", "live_time"]
port     = "timeUp"
manual   = ["7.2", "Q11"]

[[fact]]
kind   = "insn"
at     = "$AD44"
says   = "time up: $AE67 poses both ($1C, loop $AD0B), two $AF1A, RET to $AD1B with A = (IX), IX = word $C428; $AD44 compares $AA01/$AA41 then $AA02/$AA42: $AD5F, $AD94, or the draw A=$81: $ACCF CALL $ACE8 (both $19), JP $AC5F"
by     = "python tools/adis.py 0xAE5C 12 ; python tools/adis.py 0xAD18 50 ; python tools/adis.py 0xACC6 12 ; python tools/grepbytes.py \"DD 2A\" --range 0x8000 0xFFFF"

[[fact]]
kind   = "measured"
says   = "endStart, endTail, timeUp, drawStart and winPass match the machine on $AE67-$AD1B (1 case), $AD44-$ACA6 (5: draw, by count, by tally) and $AD44-$ACD6 (the draw pose): bytes, T, R; starts constructed"
by     = "python tools/callio.py --check --state p1 --fixture build/callio_ad44.json ; node test/kit.test.js"

[[fact]]
kind   = "gated"
says   = "Fist follows live_time (Time poked to 1) sample for sample: 34 round passes, 3 round-end passes at $AD0B, the draw, 66 pose passes, out at $AC5F on the machine's row; drawStart's charge only to the 0.5% mean"
by     = "node test/kit.test.js (live block, time)"

[[fact]]
kind   = "measured"
says   = "(IX) at $AE78 is never >= $80: every frame 0-58 ($44CC + word $C440+2n) starts with 1, 2 or 3; all 8 time ups in the live fixtures end on P1 frame $37 ($F3D4 = 1), and no fixture row holds a frame above 58"
by     = "python (image.bin: m[$44CC + word at $C440+2n] for n 0-58) ; scan of build/live_*.json rows: p1/p2 frame max, P1 frame on rows marked $AE67"
