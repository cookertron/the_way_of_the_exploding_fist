# ledger/AC09.toml -- current truth about main_game_loop (manual 12.2, 12.11).
# Written with tools/record.py; history is in git.

name     = "main_game_loop"
entries  = ["$AC09", "$AB70"]
oracle   = "tools/callio.py"
fixtures = ["demo_ac3c", "live"]
port     = "demoIn"
manual   = ["7.2"]

[[fact]]
kind   = "measured"
says   = "demoIn matches the machine $AC3C to the demo's first $AE29 on 5 cases (1 played after the lost bout, 4 derived by R at the JR: both ranks take 7-10): bytes outside the text cells (D5 blind), T 640994, R exactly"
by     = "python tools/callio.py --check --state p1 --fixture build/callio_ac3c.json ; node test/kit.test.js"

[[fact]]
kind   = "measured"
says   = "demoIn matches the machine $AC3C to the demo's first $AE29 on 5 cases (1 played, 4 derived by R at the JR: both ranks take 7-10): bytes outside the text cells (D5), T 640994, R exactly"
by     = "python tools/callio.py --check --state p1 --fixture build/callio_ac3c.json ; node test/kit.test.js"

[[fact]]
kind   = "gated"
says   = "live (P2 lost) runs past $AC3C: demoIn a pass (within 0.2% of the machine's 768438 T), then round_loop as the demo's, row for row to row 418, the machine's return to $ABCB: the engine stops there"
by     = "node test/kit.test.js (live block, P2 leave row) ; python tools/sample.py (port.json live note)"

[[fact]]
kind   = "gated"
says   = "the demo's points are played on by demoPoint ($ABCB, ledger ABCB); its other ways out (poses, time, quit, round end) are ABCB open 1"
by     = "node test/kit.test.js (demoPoint block ; live block, P2 leave row)"
