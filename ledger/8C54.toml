says   = "29 menu and font mutants all killed (affected run 211 listed, 207 killed, 4 timeouts, then killed once the gate throws on a read 64 past the port log)"
by     = "python tools/mutants.py --affected ; python tools/mutants.py --match \"Get_Key mask||Kempston tests key 4\""

[[fact]]
kind   = "gated"
says   = "key 0 throws MenuSuspend at $9821; Fist.menuPass steps configs() to each IN or delay, T on the clock, keys live; at its RET the pass replays from its start with its recorded reads. live_menu follows 700 rows, menu pass within 0.5%"
