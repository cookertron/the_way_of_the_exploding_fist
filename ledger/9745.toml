# ledger/9745.toml -- current truth about play_pass (manual 12.2, 12.11).
# Written with tools/record.py; history is in git.

name     = "play_pass"
entries  = ["$9745"]
fixtures = ["pass9745"]
port     = "playPass"
manual   = ["Q11", "3.8", "7.2"]

[[fact]]
kind   = "measured"
says   = "Q11 not multi-modal -- $BF13 (fighter render) is 95% of the pass, broad 158k-338k T (median 254k s1, 260k p1); every other CALL under 10k except $B15A"
by     = "python tools/chaincost.py --state s1 --range 0x9745 0x97AC --frames 3000 ; same for p1"

[[fact]]
kind   = "measured"
says   = "$B15A plays the sound effect requested in $B150 inline and blocking -- one call cost 746783 T (10.7 frames) in s1; this is the 13-15 frame pass tail (battery.toml)"
by     = "python tools/chaincost.py --state s1 --range 0x9745 0x97AC --frames 3000"

[[fact]]
kind   = "measured"
says   = "$BF13 cost is fixed by its inputs $C41B-$C43B to 0.65% (within-key spread 1648 T max) once the $C3F0 LDIR to the display is excluded; that LDIR is 9% of the call at 20.4-31.4 T/byte, so contention adds up to 12.3k T by frame phase"
by     = "python tools/callcost.py --state s1 --call 0x9790 0x9793 --key 0xC41B 0xC43C --sub 0xC3F0 0xC3F2 ; same for p1"

[[fact]]
kind   = "measured"
says   = "$BF13 draws through the sprite decoder $8803-$8AFF (compressed rows, mirror flag $C407, shift $C40E; its 13 hottest 16-byte blocks are 42% of $BF13 in s1, PROVISIONAL: scratch profile); the back buffer is at $F730 (uncontended)"
by     = "python tools/adis.py 0x8803 110 ; python tools/adis.py 0xC1A2 12"

[[fact]]
kind   = "data"
says   = "timing model chosen (D3) -- the JS sprite decoder tallies T-states as it walks the same rows as $8803; checked per key against callcost.py within 0.65% outside the display copy"
by     = "grep -n \"D3\" docs/DECISIONS.md"

[[fact]]
kind   = "measured"
says   = "the whole pass $AE29 to $AE2C, s1 300 frames: 79 calls, 51 distinct PC sets, about 16 KB in/out per case; writes the timer cells $400B-$470F (ROM font: blind) and the $C3F0 display copy"
by     = "python tools/callio.py --capture --state s1 --call 0xAE29 0xAE2C --frames 300 --per 1 --blind 0x400B-0x400F (and each row to $470B) --out scratch/pass.json"

[[fact]]
kind   = "measured"
says   = "playPass, composed from the callees, matches the machine on all 130 driven pass cases and the quit: bytes, timer cells, T, A, R, port order; ROM-effect $FE writes in count, value and first T (D6 moves inner edges)"
by     = "node test/kit.test.js (play_pass block; build/callio_ae29.json, 24 cases after callio --cover)"

[[fact]]
kind   = "gated"
says   = "derived pass case (case 19, $AA03=3, $AA56=1) sends P1's step through $9930, reading P2 via $9C29: kills \"$9C29 left 0\"; the yinYang2P/P2-step swap is equivalent (disjoint reads, writes; T126), now \"P2 stepped after the motion\""
by     = "python tools/callio.py --derive --state s1 --fixture build/callio_ae29.json --case 19 --set 0xAA03=3,0xAA56=1 ; python tools/mutants.py --match \"9745 pass\""
