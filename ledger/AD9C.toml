# ledger/AD9C.toml -- current truth about Start_2UP_Game (manual 12.2, 12.11).
# Written with tools/record.py; history is in git.

name     = "Start_2UP_Game"
entries  = ["$AD9C"]
oracle   = "tools/callio.py"
fixtures = ["start2_ac27", "live_2up"]
port     = "stage2"
manual   = ["7.2"]

[[fact]]
kind   = "measured"
says   = "Num_Players 2: gameDispatch to $ADB1, Intro_Music, start2Rest, stage2, roundIn match the machine $AC27 to the 2UP game's first $AE29: bytes outside the text cells (D5), T 12911903, R, the tune's 3422 $FE writes exactly"
by     = "python tools/callio.py --check --state p1 --fixture build/callio_ac27_2up.json ; node test/kit.test.js"

[[fact]]
kind   = "insn"
at     = "$AD9C"
says   = "Start_2UP_Game: rank, demo flag, $AA46, points cleared, stage 2, Intro_Music always, New_Round, Reset_Score; $ADBA the per-bout stage (both scores, high score from $B038); CALL $AE14, out to $AE17"
by     = "python tools/adis.py 0xAD9C 60"

[[fact]]
kind   = "gated"
says   = "live_2up follows the machine row for row: key 2 quits the demo at row 401, tune and setup within 0.05%, $AE14 to $AE29 within 2%, then the 2UP game on through $AE17's ways (ledger/AE17.toml)"
by     = "node test/kit.test.js (live block, the 2UP rows)"

[[fact]]
kind   = "measured"
says   = "answered by $AE17 (ledger/AE17.toml): its ways on ported and gated, callio_ae17 and live_2up to row 2400"
by     = "node test/kit.test.js"

[[fact]]
kind   = "measured"
says   = "the mutant 'ad9c: Fist: the 2UP game's points played as 1UP' is now killed: live_2up scores P1 a 2UP point (row 599)"
by     = "python tools/mutants.py --match \"points played as 1UP\""
