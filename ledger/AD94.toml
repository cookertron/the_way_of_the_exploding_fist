# ledger/AD94.toml -- current truth about p2_wins_pose (manual 12.2, 12.11).
# Written with tools/record.py; history is in git.

name     = "p2_wins_pose"
entries  = ["$AD94"]
oracle   = "tools/callio.py"
fixtures = ["win_ad94", "live"]
port     = "winPass"
manual   = ["7.2", "Q11"]

[[fact]]
kind   = "measured"
says   = "winStart+winPass x66+winEnd match the machine from $AD94 to $ACA6 on the one p1 case: every byte outside the stack frames, uncontended T 14363956, R"
by     = "python tools/callio.py --capture --state p1 --call 0xAD94 0xACA6 --frames 3000 --out build/callio_ad94.json ; node test/kit.test.js"

[[fact]]
kind   = "gated"
says   = "Fist follows p1 sample for sample through 335 round passes and the 66 pose passes (sample.py --also 0xAEB2), leaving with 'lost' where the machine reaches $ACA6; charge 0.23% under the machine over 401 passes, worst 2.42%"
by     = "node test/kit.test.js (round_loop live block)"

[[fact]]
kind   = "insn"
at     = "$AD94"
says   = "P2 wins: CALL $AE9D sets $AA4C=$19, $AA58=$7A, clears $AA4B/$AA56, $C427=1, loops $95D4+$BF13 until $AA4D; $AD97 returns A=0 to $ACA6, out of the 1UP game. $AE7A is P1's twin"
by     = "python tools/adis.py 0xAD94 6 ; python tools/adis.py 0xAE78 40 ; python tools/adis.py 0xAC80 40"

[[fact]]
kind   = "gated"
at     = "$AD94"
says   = "the case 'winStart's R lost' now anchors on $AD94's own R line (4-space indent, with the demoNext line above); its old 6-space anchor could only hit the 'end' and 'quit' paths; killed by the P2 roundPass row"
by     = "python tools/mutants.py --match \"winStart's R lost\" --jobs 1"
