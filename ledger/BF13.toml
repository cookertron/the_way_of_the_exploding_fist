# ledger/BF13.toml -- current truth about render_fighters (manual 12.2, 12.11).
# Written with tools/record.py; history is in git.

name     = "render_fighters"
entries  = ["$BF13"]
oracle   = "tools/rendfx.py"
fixtures = ["rendfx"]
port     = "renderFighters"
manual   = ["7.2", "Q11"]

[[fact]]
kind   = "insn"
at     = "$BFB7"
says   = "LD A,E is overwritten by LD A,$BE (also at $C001): the y-max of each fighter's box ($C437/$C43B) is always $BE, never the computed max -- every box extends to row 190"
by     = "python tools/adis.py 0xBFB4 4 ; python tools/adis.py 0xBFFE 4"

[[fact]]
kind   = "insn"
at     = "$BF73"
says   = "each fighter's box is the union of this frame (x=$C41B/$C41D, y=$C41C/$C41E, w,h from frame header +1,+2) and last frame ($C42C..$C433); then this frame is saved to $C42C..$C433 at $C007"
by     = "python tools/adis.py 0xBF73 70 ; python tools/adis.py 0xC007 13"

[[fact]]
kind   = "insn"
at     = "$C03B"
says   = "overlap test 8-bit (ADD A,11 wraps): (p2xmax+11)&255 < p1xmin or (p1xmax+11)&255 < p2xmin draws each box apart ($C101); else boxes merged by minmax $C1F6 (D<E unchanged, else swapped: D=min, E=max)"
by     = "python tools/adis.py 0xC03B 40 ; python tools/adis.py 0xC1F6 13"

[[fact]]
kind   = "insn"
at     = "$C0D2"
says   = "merged path draw order: $C427 nonzero draws P1 ($C1A2) then P2 ($C1CC), zero draws P2 then P1; separate path ($C136/$C186) draws each in its own box"
by     = "python tools/adis.py 0xC0D2 7"

[[fact]]
kind   = "insn"
at     = "$C34F"
says   = "parts: header count,width,byte2; per part dx,dy,stride; y=$C413+dy (dy=$FF: $BE-$C41A-12); x=$C412+dx, flipped $C412+w-dx-4*byte0; dest $F730+y*$C40D+x>>2, x&3 -> flag 0/2/4/8 in $C40E"
by     = "python tools/adis.py 0xC34F 30 ; python tools/adis.py 0xC393 40 ; python tools/adis.py 0xC2B5 40"

[[fact]]
kind   = "insn"
at     = "$C09F"
says   = "box: width bytes ((xmax-xmin)>>2)+2 to $C40A/$C40F, height ymax-ymin to $C409, $C41A=ymin; $C234 copies rows from the 64-row shadow at $8000 (B=xmin&$FC, C=ymin-$48) into $F730, zero-filling rows past shadow row $40"
by     = "python tools/adis.py 0xC091 50 ; python tools/adis.py 0xC234 60"

[[fact]]
kind   = "measured"
at     = "$BF13"
says   = "gated (template.html): renderFighters writes every byte and the uncontended T of all 50 rendfx cases (saved SP at $C2B0 = entry SP - 2); rfPlayT pools at 1.00026 of their contended T (gate 0.25%), worst 2.43% (gate 3%)"
by     = "python tools/build.py ; node test/kit.test.js ; python tools/mutants.py --match \"BF13 play T||BF13 cost\""

[[fact]]
kind   = "insn"
at     = "$C23C"
says   = "with y-max forced to $BE, c+l-1 = (ymin-$48)+($BE-ymin)-1 = $75 always, so the shadow-overflow branch $C244 runs on every call and the no-overflow path is dead in play (50/50 cases overflow)"
by     = "python tools/adis.py 0xC237 12 ; python tools/rendfx.py --check --state s1 --paths"

[[fact]]
kind   = "measured"
at     = "$BF13"
says   = "rendfx fixture, 50 cases: s1 + p1 one per PC set, plus p1 A and p1 Q (Q swaps sides) one per new margin; replay reproduces every write and T (176361-317689); both $C03B comparisons have margins -2..2, so the +11 slack is pinned (10 and 12 killed)"
by     = "python tools/rendfx.py --capture --state s1 --per 1 ; p1 --per 1 --append ; p1 --keys A --per 0 --near 3 --append ; p1 --frames 3000 --keys Q --per 0 --near 2 --append ; python tools/rendfx.py --check --state s1 --paths"

[[fact]]
kind   = "unreachable"
at     = "$C203"
says   = "box tops ($C41A) never leave $67-$7A, so the copy-out always starts in the middle third: Screen_Calc never returns a top- or bottom-third base in play, and their mutants survive by design"
by     = "python tools/rendfx.py --capture --state p1 --keys W --per 3 ; same for p1 Q E C Z A+W, p1b W, s1 W"
window = "600 frames each of 8 state/key runs"
n      = 548

[[fact]]
kind   = "measured"
at     = "$BF13"
says   = "play contention, D4 means: $C3F0 LDIR +4.72 T/byte (s1 4.63, p1 4.81); own code outside it and $8803 x1.0425 over 614 calls (s1 1.031 .. p1b 1.052); rfPlayT pools within 0.15% per state, one call within 2.9%"
by     = "python tools/callcost.py --state s1 --call 0x9790 0x9793 --key 0xC41B 0xC43C --sub 0xC3F0 0xC3F2 ; python tools/rendfx.py --capture --state s1 --per 100000 --out scratch/rf_s1.json ; same for p1, p1b, p1 --keys A"
