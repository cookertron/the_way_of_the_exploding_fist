kind   = "measured"
says   = "fixture build/callio_976f.json, $976F-$978D: 10 play cases (s1 p1 p1b, D+W, 3000 frames, Num_Players poked 2) reach counts 1-2 only; 12 derived (counts to 7, $AA08=2, equal reel bits, 1P); --check 22/22, T 32-9277"
by     = "python tools/callio.py --capture --state s1 --poke 0x9C2C=2 --call 0x976F 0x978D --frames 3000 --keys D+W --per 2 --out build/callio_976f.json --append ; python tools/callio.py --check --state s1 --fixture build/callio_976f.json"

[[fact]]
kind   = "data"
says   = "writers of $AA01/$AA41 are $900E itself, New_Round $909F and the pass clear $9787; so via $9783 the count enters as 0 and only 1-2 occur; $900E is also called at $ABD2 and $AD22 (with $AF01 before each), where counts 3+ can arise"
by     = "python tools/grepbytes.py \"01 AA\" ; python tools/grepbytes.py \"CD 0E 90\""

[[fact]]
kind   = "gated"
says   = "yinYang2P writes every byte and the exact uncontended T of all 22 cases; every branch of $976F, $900E, $9255 and both $9229 exits reached; 15 mutants killed; dropping $9229's H-8 step is equivalent here (it follows the last byte)"
by     = "python tools/build.py ; node test/kit.test.js ; python tools/mutants.py --affected"

[[fact]]
kind   = "gated"
says   = "yinYang2P and its helpers count their M1 into M1.m1 and match rx - r mod 128 on all 22 callio cases; every cell is at row 8 or 16, so Screen_Calc takes its 24-M1 top-third path and $9229 never steps to the next third"
by     = "python tools/blockcost.py 0x976F 0x978D ; python tools/blockcost.py 0x900E 0x9090 ; python tools/blockcost.py 0x9255 0x92A0 ; node test/kit.test.js"
