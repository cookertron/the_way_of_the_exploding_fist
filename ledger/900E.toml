name     = "yin_yang"
entries  = ["$900E", "$AF01", "$9255", "$92CA"]
oracle   = "tools/callio.py"
fixtures = ["yy976f"]
port     = "yinYang2P"
manual   = ["5.1", "7.2"]

[[fact]]
kind   = "insn"
at     = "$976F"
says   = "2P only (Num_Players $9C2C = 2): $AF01 is A = ($AA03 XOR $AA43) AND $10; zero (neither or both reeling) clears both Points_Awarded $AA08/$AA48 before Yin_Yang_1UP, which then adds them to $AA01/$AA41; both counts are cleared after"
by     = "python tools/adis.py 0x976F 12 ; python tools/adis.py 0xAF01 5"

[[fact]]
kind   = "insn"
at     = "$900E"
says   = "P1 points nonzero returns after drawing P1: a P2 award in the same pass goes undrawn; count 1 half at $0408, 2 full, 3 full + half at $0108, 4+ full at $0108; P2 at $1A08/$1D08; $9255 copies 4 cells of UDG via $92CA"
by     = "python tools/adis.py 0x900E 60 ; python tools/adis.py 0x9255 30 ; python tools/adis.py 0x92CA 12"

