# ledger/AC27.toml -- current truth about main_game_dispatch (manual 12.2, 12.11).
# Written with tools/record.py; history is in git.

name     = "main_game_dispatch"
entries  = ["$AC27"]
oracle   = "tools/callio.py"
fixtures = ["demo_ac27", "live"]
port     = "gameDispatch"
manual   = ["7.2"]

[[fact]]
kind   = "measured"
says   = "gameDispatch matches the machine $AC27 to the next demo's first $AE29 (Num_Players 0, after the demo's rank-4 RET): bytes outside the text cells (D5), T 641011 (demoIn's less the JR, plus 13+4+12), R exactly"
by     = "python tools/callio.py --check --state p1 --fixture build/callio_ac27.json ; node test/kit.test.js"

[[fact]]
kind   = "gated"
says   = "live (P2 lost) follows the demo through its rank-4 RET at row 2543, $AC27 to $AC09 and a new demo in the same pass (0.998 of the machine), on row for row to row 3000"
by     = "node test/kit.test.js (live block, the ABB9 stage row)"

[[fact]]
kind   = "insn"
at     = "$AC4E"
says   = "Start_1UP_Game sets $AF35 and $AA46 to 1, $AA3C and the stage $AF34 to 2; the tune runs because $AF35 is 1, and the setup then makes $AF35 0"
by     = "python tools/adis.py 0xAC3E 12"

[[fact]]
kind   = "measured"
says   = "Num_Players 1: gameDispatch (Start_1UP_Game, Reset_Score) to $AC5F, then setupMusic, setupRest, roundIn, matches the machine $AC27 to the game's first $AE29: bytes outside the text cells, T 12902202, R, the tune's $FE writes exactly"
by     = "python tools/callio.py --check --state p1 --fixture build/callio_ac27_1up.json ; node test/kit.test.js"

[[fact]]
kind   = "gated"
says   = "live_1up follows the machine row for row: the demo quit by key 1 at row 401 through $ABB9 and $AC27, the 1UP game's tune and setup (0.05%), roundIn (8020 T vs 8152, 1.6%), the game lost at row 800 back into the demo, to row 1000"
by     = "node test/kit.test.js (live block, the 1UP rows)"
