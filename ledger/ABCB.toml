# ledger/ABCB.toml -- current truth about demo_point (manual 12.2, 12.11).
# Written with tools/record.py; history is in git.

name     = "demo_point"
entries  = ["$ABCB"]
oracle   = "tools/callio.py"
fixtures = ["demo_abcb", "live"]
port     = "demoPoint"
manual   = ["7.2", "Q11"]

[[fact]]
kind   = "insn"
at     = "$ABCB"
says   = "pointPath's twin for the demo's CALL at $ABC8: $AF01, $900E, $AF36; then $AA03 set looks at P2's count only (4: CALL $AE9D at $ABE5), clear at P1's only (4: CALL $AE7A at $AC00); $9C2B -> XOR A, RET to $ABB9; else JR $ABC8"
by     = "python tools/adis.py 0xABC8 30"

[[fact]]
kind   = "measured"
says   = "demoPoint matches the machine from $ABCB to $AE29 or its way out on 17 cases (9 played in the demo after the lost bout, 8 derived, 3 of them with --up 0xABB9): bytes (score row blind, D5), exit, uncontended T 15-17734, R"
by     = "python tools/callio.py --check --state p1 --fixture build/callio_abcb.json ; node test/kit.test.js"

[[fact]]
kind   = "gated"
says   = "live (P2 lost) follows the demo through its point at row 418 to the fixture's last row (499), no way out; the demo's p1/p2/time/quit/end exits stop the engine at DEMO_OUT"
by     = "node test/kit.test.js (live block, P2 leave row)"

[[fact]]
kind   = "gated"
says   = "the demo's poses, time up and the RET M lead to $ABB9; ported as demoOn (ledger ABB9), live through both poses"
by     = "node test/kit.test.js (demo_abb9 block ; live block, P2 both poses row)"

[[fact]]
kind   = "measured"
says   = "worlds pin play's pairs: $AA43 set with P1's award in $AA08; $AA03 set, $AA08 0, P2's in $AA48. 9 were missing (full points, both hit, counts to 3/4/5); cases 19-25 derived, no new PCs; an OR guard and a win at exactly 4 now killed"
by     = "python tools/callio.py --derive --state p1 --fixture build/callio_abcb.json --case 1 --set 0xAA08=2 (and 2 more), --case 3 --set 0xAA48=2 (and 3 more) ; python tools/callio.py --check ... (26 cases, 0 disagree) ; node test/kit.test.js"
