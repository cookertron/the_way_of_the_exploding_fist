# ledger/topics/battery.toml -- current truth about "section 8 diagnostic battery -- results and the 8.20 checklist", a system spanning
# routines (manual 12.11).  Written with tools/record.py; history is in git.

name     = "section 8 diagnostic battery -- results and the 8.20 checklist"
routines = ["$9745", "$C3E4", "$B15A"]
manual   = ["Q19", "C1"]

[[fact]]
kind   = "measured"
says   = "Q10 free-running: entry $8800 does DI and no game code ever EIs or sets IM2; loop top $9745 passes are 2.8-5.2 frames (mean 266623 T over 157), tail at 13-15 frames"
by     = "python tools/battery.py --state s1 --frames 600 --loop 0x9745"

[[fact]]
kind   = "measured"
says   = "Q2 ports in demo play: reads $F7FE $EFFE (keys 1-5, 6-0) and $1F Kempston; writes $FE only (1142 beeper writes / 600 frames)"
by     = "python tools/battery.py --state s1 --frames 600 --loop 0x9745"

[[fact]]
kind   = "measured"
says   = "Q15 render: 156948 of 157204 display-file writes come from the LDIR at $C3F0 (an off-screen buffer copied out); 0 attribute writes in play"
by     = "python tools/battery.py --state s1 --frames 600 --loop 0x9745"

[[fact]]
kind   = "measured"
says   = "Q3 no self-modification in 600 frames of demo: 0 writes landed on executed bytes"
by     = "python tools/battery.py --state s1 --frames 600 --loop 0x9745"

[[fact]]
kind   = "insn"
at     = "$9C2E"
says   = "start-up: DI, border 5, SP=$5BFF, CALL $B138, then LDIR $6000-$80FF down to $5F00 -- static image below $8100 is pre-relocation"
by     = "python tools/adis.py 0x9c2e 12"

[[fact]]
kind   = "measured"
says   = "Q2 in 1P keyboard play: reads $FBFE $FEFE $FDFE $BFFE $F7FE and never $1F (demo s1 polls Kempston, p1 does not); writes $FE only"
by     = "python tools/battery.py --state p1 --frames 600 --loop 0x9745 --script \"40:,60:D,40:W,40:E,60:A,40:C,40:X,40:Z,40:Q,60:D+W,60:A,80:\""

[[fact]]
kind   = "measured"
says   = "Q10 in 1P play matches demo: p1 driven 148 passes mean 280328 T (4.01 frames, 2.79-5.02); p1 idle and p1b also have the ~14.8-frame tail"
by     = "python tools/battery.py --state p1b --frames 600 --loop 0x9745 --script \"40:,60:D,40:W,40:E,60:A,40:C,40:X,40:Z,40:Q,60:D+W,60:A,80:\""

[[fact]]
kind   = "measured"
says   = "keys in p1: Z X C A D Q W E each change only $AA05 within $AA00-$AA7F; H runs new PCs $982E-$9833; 1 runs $8BA4; the other 29 keys do nothing"
by     = "python tools/keyprobe.py --state p1 --hold 300000 --vars 0xAA00 0xAA7F"

[[fact]]
kind   = "measured"
says   = "Q17 beeper is event-driven: $FE writes per 600 frames are 0 in driven p1, 886 in idle p1, 1644 in driven p1b, 1142 in demo"
by     = "python tools/battery.py --state p1 --frames 600 --loop 0x9745"

[[fact]]
kind   = "measured"
says   = "Q3 and Q15 hold in 1P play: 0 writes on executed bytes; display-file writes $C3F0 LDIR 157825 of 158185, $924B 360; 0 attribute writes"
by     = "python tools/battery.py --state p1 --frames 600 --loop 0x9745 --script \"40:,60:D,40:W,40:E,60:A,40:C,40:X,40:Z,40:Q,60:D+W,60:A,80:\""

[[fact]]
kind   = "absent"
says   = "Q19 no stack imbalance in play -- 0 discards, 0 rewrites, 0 fake returns, 0 LD SP cuts, ODD 0 over ~2.47M frames; window covers points both sides (YY_1UP/2UP), 6 New_Round per state, and 1P game over (Check_HighScore $A647 in p1, p1b)"
by     = "python tools/stackscan.py --state p1 --frames 15000 --mark 900E,9057,909E,A647 ; same for s1, p1b"
window = "15000 frames each of p1, s1, p1b"
n      = 0

[[fact]]
kind   = "measured"
says   = "chain live in every saved state: bout loop $AC3E/$AB70 -> $AD18/$ABC8 -> $AE26 -> play_pass $9745 -> $BF13 -> $C1A2 -> $C34F -> $C36E -> $C2B5 -> $8803; the bout frames return only at round end / game over"
by     = "python tools/stackscan.py --state p1 --frames 15000 ; same for s1, p1b"

[[fact]]
kind   = "measured"
says   = "at 15-20 workers every case times out at 180 s (suite alone 54 s); the same 15 cases on 8 workers: 3.9 min, 14 killed, no timeouts. The 184 timeouts of the 2026-10-08 full run (20 workers) are contention"
by     = "python tools/mutants.py --match \"<the 15 labels>\" --jobs 8 (2026-10-08 13:24) against --affected --jobs 20 (13:18)"

[[open]]
ask    = "does a P1 bout WIN (dan progression, bonus stage) or 2P play use a stack-unwinding idiom?"
tried  = "Q19 over p1, s1, p1b -- every window has P1 losing; no won bout, no bonus stage, no 2P state"
settle = "stackscan.py --mark 909E,A647 over a state where P1 wins a bout and over a 2P state, once either exists"
