# ledger/8803.toml -- current truth about sprite_decoder (manual 12.2, 12.11).
# Written with tools/record.py; history is in git.

name     = "sprite_decoder"
entries  = ["$8803"]
oracle   = "tools/sprdec.py"
fixtures = ["sprdec"]
port     = "spriteDecode"
manual   = ["7.2", "Q11", "5.1", "3.8"]

[[fact]]
kind   = "measured"
says   = "tools/sprdec.py transliterates $8803 with per-instruction T -- agrees with the harness on 2604 calls (s1 1500 frames, p1 600, p1b 600): every byte written, and T exact against an uncontended twin; 573 distinct calls frozen"
by     = "python tools/sprdec.py --capture --state s1 --frames 1500 ; --state p1 --frames 600 --append ; --state p1b --frames 600 --append ; python tools/sprdec.py --check"

[[fact]]
kind   = "insn"
at     = "$8853"
says   = "sprite = width byte, rows, 0 to end; a row header with bit 7 set is packed (bit 6 skip flag, bits 5-3 skip bytes, bits 2-0 byte count), bit 7 clear is a raw row of width bytes re-headed at $8AE9; dest advances by the stride $C408 per row"
by     = "python tools/adis.py 0x8803 30 ; python tools/adis.py 0x8A30 20"

[[fact]]
kind   = "insn"
at     = "$8A74"
says   = "plot -- the first byte is ORed into dest masked by $B5[src], the last by $B6[src], middle bytes LDIR unmasked; a one-byte row takes $B5 OR $B6 ($8AA5)"
by     = "python tools/adis.py 0x8A74 30 ; python tools/adis.py 0x8AA5 12"

[[fact]]
kind   = "measured"
says   = "the stack ($5Fxx) is contended, so each PUSH/POP/CALL/RET in play costs 11-21 T by frame phase; the decoder runs 0-7.2% (median 3.1%, at most 5749 T) over its uncontended T"
by     = "python -c \"import json,statistics as s; c=json.load(open('build/sprdec_cases.json'))['cases']; r=[(x['tc']-x['t'])/x['t'] for x in c]; print(min(r),s.median(r),max(r))\""

[[fact]]
kind   = "never"
says   = "no raw row (header bit 7 clear) and no empty row (count 0) in play; mirror always comes with recolour (7950 rows each)"
by     = "python tools/sprdec.py --check --paths"
window = "s1 1500 frames, p1 600, p1b 600"
n      = 2604

[[fact]]
kind   = "insn"
at     = "$88A5"
says   = "$C40E bit 0 mirrors (bytes reversed via $B7, skip measured from the right); bits 1/2/3 shift 2/4/6 px, dropping a blank first ($8AFE) or last ($8AFF) byte; $C407 recolours via $B8 odd rows, $B9 even ($8AD1)"
by     = "python tools/adis.py 0x8882 70 ; python tools/adis.py 0x8965 100 ; python tools/adis.py 0x8AD1 10"

[[fact]]
kind   = "measured"
says   = "spriteDecode (web/template.html) ports tools/sprdec.py: on all 441 sprdec cases the whole 64K outside $8AE9-$8B1C matches the real call and T equals the uncontended T; 22 mutants killed, each by its named row"
by     = "node test/kit.test.js ; python tools/mutants.py --match 8803"

[[open]]
ask    = "how the JS tally charges stack contention (0-7.2% of the call by frame phase) -- a mean factor, or per stack access keyed to the 7.2 clock phase"
tried  = "measured the spread only (tc vs t in build/sprdec_cases.json)"
settle = "count stack accesses per call in the model and fit extra T per access against tc; decide with the $C3F0 copy question"
