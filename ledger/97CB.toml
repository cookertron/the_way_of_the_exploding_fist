# ledger/97CB.toml -- current truth about control_pass (manual 12.2, 12.11).
# Written with tools/record.py; history is in git.

name     = "control_pass"
entries  = ["$97CB"]
oracle   = "tools/callio.py"
fixtures = ["control97cb"]
port     = "controlPass"
manual   = ["Q18", "5.1", "7.2"]

[[fact]]
kind   = "measured"
says   = "Num_Players $9C2C = 0 in s1 (demo): both fighters driven by the AI ($A090-$A5C2, $AADC-$AB67), 4.3k-9.1k T; reads and writes both records $AA00-$AA19 / $AA40-$AA59 and $AA77-$AA9C, writes $A5EC-$A644; reads $A646, $A905-$A93E, $B330-$B496"
by     = "python tools/callio.py --state s1 --gap 16 --frames 1500 --call 0x9757 0x975A"

[[fact]]
kind   = "gated"
says   = "controlPass matches all 456 cases: same ports in order, every byte, exact uncontended T, A and R at the return; R is an M1 count from io.r (blockcost.py); a hand mutant (one LD A,R as 1 M1) fails bytes, T and R"
by     = "python tools/build.py ; node test/kit.test.js"

[[fact]]
kind   = "insn"
at     = "$97CB"
says   = "control_pass -- demo: keys + Kempston tested, both fighters by the AI $A090 on copies (self $A5F1, AI state $A60B, foe $A62B); 1P/2P: quit keys 1+6, P1 from $8B1F via moves $98DD, P2 likewise or by AI; $909E/$8C54 are later units"
by     = "python tools/adis.py 0x97CB 80 ; python tools/adis.py 0x987A 60 ; python tools/adis.py 0xA090 700 ; python tools/adis.py 0xAADC 60"

[[fact]]
kind   = "measured"
says   = "fixture build/callio_97cb.json: 456 cases, one per PC set (s1; p1 x 7 keys; p1b W), ports and R per case; --check 456/456, T 882-9393; play never reached $A096 $A2A6 $A49A-$A4C7 $A57B $A5C3-$A5EB, nor $909E/$8C54"
by     = "python tools/callio.py --capture --state s1 --call 0x9757 0x975A --frames 6000 --per 2 --out build/callio_97cb.json (p1, p1b --append; one per PC set kept) ; python tools/callio.py --check --state s1 --fixture build/callio_97cb.json"

[[fact]]
kind   = "gated"
says   = "cases reach every outcome of every executed conditional in $97CB/$8B1F/$A090 but 11: 4 menu exits to $909E/$8C54, 7 dead; 670 cases (456 play, 202 keyed/poked: H G X 1, 2P, Kempston; 12 derived); controlPass passes all"
by     = "python tools/branches.py --fixture build/callio_97cb.json ; python tools/build.py ; node test/kit.test.js"

[[fact]]
kind   = "unreachable"
says   = "dead on hardware: $A094 fall ($AA03/$AA43 tested 0 before each AI call), $A49F fall ($A49A only from $A580, after $A614 < 7), $98A2 fall ($8B1F sets bits 0-4 only); and the A3FF R-bit-7 outcomes"
by     = "python tools/adis.py 0xA090 6 ; python tools/grepbytes.py \"9A A4\" ; python tools/adis.py 0x8B1F 70"
window = "$97CB-$98BE, $8B1F-$8BD1, $A090-$A5EB"
n      = 0

[[fact]]
kind   = "measured"
says   = "three mutants dropped as equivalent on hardware: $A090 A5F4 test (A5F4 is 0 whenever the AI runs, fact 6), the $98A2 fire fold (bits 0-4 only, fact 6), R bit 7 at $A3FF (no LD R,A ED 4F anywhere in the 64K, so R bit 7 stays 0)"
by     = "python tools/grepbytes.py \"ED 4F\" ; python tools/adis.py 0xA090 6"

[[fact]]
kind   = "gated"
says   = "27 controlPass/AI mutants all killed; 3 derived cases added to kill them (case 1 with R=$0D; $AA19=$5B for d=$D4; Kempston $08 via --derive --port); fixture 673 cases"
by     = "python tools/mutants.py --affected ; python tools/callio.py --check --state s1 --fixture build/callio_97cb.json"

[[fact]]
kind   = "gated"
says   = "18 mutants for the starts, New_Round and the print M1 tallies, 46 affected cases all killed (4 older anchors repointed after the print edits)"
by     = "python tools/mutants.py --affected"

[[fact]]
kind   = "unreachable"
says   = "New_Round prints the constant nine spaces ($B060, never written) at rows 8/16: $C206 fall, the 8 $C319 ADD outcomes and $9233 carry never run ($9239 is credited via $922D); carry-M1 mutant dropped"
by     = "python tools/grepbytes.py \"60 B0\" ; python tools/grepbytes.py \"64 B0\" ; python tools/branches.py --fixture build/callio_97cb.json"
window = "$909E-$90CF, $92E4-$92FE, $923A-$9254, $9229-$9239, $C203-$C233, $C319-$C34E"
n      = 0

[[fact]]
kind   = "gated"
says   = "starts ported: key 1 or Kempston fire to $97EF, key 2 to $9808, then New_Round $909E (4 prints of $B064), A=$80; 3 derived cases (case 0 --port 0=0, 1=$10, 2=0), 676 in all; M1 counted through Print_String for R; only $8C54 throws"
