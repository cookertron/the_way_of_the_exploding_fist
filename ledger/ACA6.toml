# ledger/ACA6.toml -- current truth about bout_next (manual 12.2, 12.11).
# Written with tools/record.py; history is in git.

name     = "bout_next"
entries  = ["$ACA6", "$AF27"]
oracle   = "tools/callio.py"
fixtures = ["next_aca6"]
port     = "boutNext"
manual   = ["7.2", "Q18"]

[[fact]]
kind   = "gated"
says   = "Fist leaves live (P2) at $AC39 and live_p1w (P1) and live_time (draw) at $AC5F on the machine's row, boutNext inside the pass that ends the bout"
by     = "node test/kit.test.js (live block, leave rows)"

[[fact]]
kind   = "insn"
at     = "$ACA6"
says   = "A=0 RETs to $AC39; A=1 DECs bouts-left $AA3C, at 0: back to 2, $AF27 steps stage $AF34 1-3, $AF35=1, rank $B05F +1 BCD, $AA80 +1, or at rank $10 $AA80 = 7+(R AND 3); A=$81 the draw; then JP $AC5F"
by     = "python tools/adis.py 0xAC40 80 ; python tools/adis.py 0xAF27 6"

[[fact]]
kind   = "measured"
says   = "boutNext (drawStart, pose, JP for $81) match the machine $ACA6 to $AC5F/$AC39 on 8 cases: lost 40 T x2, won 54, rank up 222, wrap 240, top 251 (R at r+22), draw, rank 9 to $10 derived; bytes, T, R, PC; starts poked"
by     = "python tools/callio.py --check --state p1 --fixture build/callio_aca6.json ; node test/kit.test.js"
