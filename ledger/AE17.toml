# ledger/AE17.toml -- current truth about Two_Player_Round_On (manual 12.2, 12.11).
# Written with tools/record.py; history is in git.

name     = "Two_Player_Round_On"
entries  = ["$AE17"]
oracle   = "tools/callio.py"
fixtures = ["round_ae17"]
port     = "twoOn"
manual   = ["7.2"]

[[fact]]
kind   = "insn"
at     = "$AE17"
says   = "RET M (quit; $ADE0 RET M to $AC34); New_Round, $AF36 award; $9C2B clear: JR Z $AE14, the next round; set: RET, $ADE0 RET M, $ADE2 $AF27, Intro_Music, Current_Rank+1, below 4 JR $ADBA (stage2), at 4 to $ADF3"
by     = "python tools/adis.py 0xAD9C 80"

[[fact]]
kind   = "insn"
at     = "$ADF3"
says   = "game end: Check_HighScore; $A6B6 0: $ACE8 both posed; 1: $AE7A P1 pose; 2: $AE9D P2 pose; then $AE12 XOR A: RET to $AC34, JR Main_Game_Loop (demoIn); the poses run at SP +2 of the 1UP ones"
by     = "python tools/adis.py 0xADF3 12 ; python tools/adis.py 0xAC09 25"

[[fact]]
kind   = "measured"
says   = "P1 fire is key 1 ($8BFA entry 9: row $F7 bit 0); live's script then ',165:,1:2,30:,24:D,10:,15:D+1,15:,15:E+1,15:,15:C+1,15:,15:X+1' scores P1 a 2UP point: $AA08 = 1 at pass 566, back at $AE17 by 599"
by     = "python tools/sample.py --state p1 --at 0xAE29 --passes 640 --script (that) --var pts=0xAA08 --var c1=0xAA02 --changes"

[[fact]]
kind   = "measured"
says   = "the 2UP game of fact 3's script, 2400 passes: the point back at $AE17 row 599; time up through $ADE2 into the next bout at rows 880, 1301, 1722; at 2143 rank 4: $ADF3, P1's pose ($AE8E), $AC34 and the demo's $AE29 in one row"
by     = "python scratch/gen2up.py (fact 3's script) 2400 scratch/live_2up_new.json ADE2 ADF3 AC34"

[[fact]]
kind   = "measured"
says   = "callio records \"up\" for any POP/RET at or above the entry SP; --up takes WORD,WORD (2UP: $5BFB $ADE0, $5BFD $AC34); callio_ae17: 2 captured + 6 derived (no time up, quit, game end tie/P1/P2/hi), 0 disagree"
by     = "python tools/callio.py --check --state p1 --fixture build/callio_ae17.json"

[[fact]]
kind   = "measured"
says   = "round_ae17 gated: twoOn and its ways on as the engine runs them, 8 cases exact (bytes, PC, T, R, the tune's writes); recaptured with start2_ac27's text-cell blinds (D5), T and R unchanged"
by     = "python tools/callio.py --check --state p1 --fixture build/callio_ae17.json ; node test/kit.test.js"

[[fact]]
kind   = "measured"
says   = "ported; live_2up (2400 passes) followed row for row: point 599, time ups 880 1301 1722, rank-4 end with P1's pose out to $AC34 and the demo at 2143; tune passes within 0.05%, end pass 0.37% under"
by     = "python tools/build.py ; node test/kit.test.js ; node scratch/endpass.js"
